<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>何が食べたい？</title>
<style>
/* ご飯帖「何が食べたい？」— 家族がアプリなしで答える1枚のページ。どこにも通信しない（返事は本人が選んだアプリで送る） */
:root{
  --bg:#fbf5ec; --card:#fffaf2; --ink:#3a2c22; --sub:#7a6556; --line:#e7d8c4;
  --acc:#b8532f; --acc-ink:#fff8f0; --acc-soft:#f6e1d3; --gold:#d99a2b; --gold-soft:#f8ebcc;
  --err:#9d3a2a; --shadow:0 1px 2px rgba(80,50,20,.10), 0 2px 8px rgba(80,50,20,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1d1712; --card:#2a211a; --ink:#f3e7d8; --sub:#c2ab95; --line:#47392c;
    --acc:#e2825c; --acc-ink:#24170f; --acc-soft:#4a2e20; --gold:#e8b75a; --gold-soft:#3f321c;
    --err:#f0a08d; --shadow:none; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans",sans-serif;overflow-wrap:anywhere}
main{max-width:520px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
h1{font-size:24px;line-height:1.3;margin:4px 0 4px}
.from{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:15px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--gold-soft);color:var(--ink);display:grid;place-items:center;font-weight:700}
.hint{color:var(--sub);font-size:15px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:259px){ .grid{grid-template-columns:minmax(0,1fr)} main{padding-left:10px;padding-right:10px} h1{font-size:21px} }
.dish{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;width:100%;padding:10px 8px;border:3px solid transparent;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);font:inherit;font-weight:600;font-size:15px;line-height:1.3;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dish img,.dish .ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--gold-soft)}
.dish .ph{display:grid;place-items:center;font-size:24px;color:var(--sub)}
.dish .nm{display:block;max-width:100%;overflow-wrap:anywhere}
.dish[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.dish[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;inset-inline-end:8px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--acc-ink);font-size:15px;line-height:24px}
.any{margin-top:10px;min-height:56px;flex-direction:row}
.sub{font-size:15px;font-weight:700;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 16px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
label.nm-l{display:block;font-size:15px;font-weight:700;margin:18px 0 6px}
input[type=text]{width:100%;min-height:48px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit}
.reply{margin-top:22px;padding:14px;border-radius:16px;background:var(--card);border:2px solid var(--acc);box-shadow:var(--shadow)}
.reply[hidden]{display:none}
.reply h2{font-size:18px;margin:0 0 8px}
.txt{width:100%;min-height:96px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical;user-select:all;-webkit-user-select:all}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:259px){ .acts{grid-template-columns:minmax(0,1fr)} }
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:8px 10px;border:2px solid var(--acc);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;text-decoration:none;text-align:center;cursor:pointer}
.btn.main{grid-column:1/-1;background:var(--acc);color:var(--acc-ink)}
.btn.line{border-color:#3f8a3a}
.st{min-height:1.5em;margin:8px 0 0;font-size:14px;color:var(--sub)}
.note{margin-top:22px;font-size:13px;color:var(--sub)}
.bad{margin-top:24px;padding:16px;border-radius:16px;background:var(--card);border:2px solid var(--err);color:var(--ink)}
.bad b{color:var(--err)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

  const seen = new Set(), d = [];
  for (const a of o.d){
    if (!Array.isArray(a) || a.length < 2 || a.length > 3) continue;
    const id = a[0], name = typeof a[1] === 'string' ? clean(a[1], NAME_MAX) : '';
    if (typeof id !== 'string' || !ID_RE.test(id) || !name || seen.has(id)) continue;
    seen.add(id);
    d.push({id, name, img: typeof a[2] === 'string' && IMG_RE.test(a[2]) ? a[2] : ''});
  }
  if (!d.length) return null;
  return {n: typeof o.n === 'string' ? clean(o.n, 10) : '', d, l: typeof o.l === 'string' ? o.l : '', t: realYmd(o.t)};
}

const el = (tag, attrs, kids) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs){ if (k === 'text') e.textContent = attrs[k]; else if (k === 'cls') e.className = attrs[k]; else e.setAttribute(k, attrs[k]); }
  (kids || []).forEach(c => c && e.appendChild(c));
  return e;
};
const todayPack = () => { const d = new Date(); return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); };

function boot(){
  const app = document.getElementById('app');
  const p = parse(location.hash);
  const lang = pickLang(p ? p.l : '');
  const T = L[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = T.ask;
  app.textContent = '';
  if (!p){
    app.appendChild(el('h1', {text: T.ask}));
    app.appendChild(el('div', {cls: 'bad', role: 'alert', id: 'bad'}, [el('b', {text: T.bad})]));
    return;
  }
  const st = {sel: [], any: false, m: null, me: ''};
  // 送った人
  const from = el('div', {cls: 'from'});
  if (p.n){ from.appendChild(el('span', {cls: 'av', 'aria-hidden': 'true', text: [...p.n][0]})); }
  const fromTx = el('div');
  if (p.n) fromTx.appendChild(el('div', {text: fill(T.from, {name: p.n})}));
  if (p.t){ try{ fromTx.appendChild(el('div', {text: new Intl.DateTimeFormat(lang, {month: 'long', day: 'numeric'}).format(new Date(+p.t.slice(0, 4), +p.t.slice(4, 6) - 1, +p.t.slice(6, 8)))})); }catch(e){} }
  from.appendChild(fromTx);
  if (p.n || p.t) app.appendChild(from);
  app.appendChild(el('h1', {text: T.ask}));
  const hint = el('p', {cls: 'hint', id: 'hint', text: T.hint});
  app.appendChild(hint);
  // 料理のボタン
  const grid = el('div', {cls: 'grid', role: 'group', 'aria-label': T.ask, id: 'grid'});
  const btns = p.d.map(x => {
    const b = el('button', {type: 'button', cls: 'dish', 'data-id': x.id, 'aria-pressed': 'false'});
    if (x.img){ const im = el('img', {src: x.img, alt: '', width: '64', height: '64', decoding: 'async'}); im.addEventListener('error', () => { im.replaceWith(el('span', {cls: 'ph', 'aria-hidden': 'true', text: '🍚'})); }); b.appendChild(im); }
    else b.appendChild(el('span', {cls: 'ph', 'aria-hidden': 'true', text: '🍚'}));
    b.appendChild(el('span', {cls: 'nm', text: x.name}));
    b.addEventListener('click', () => {
      const i = st.sel.indexOf(x.id);
      if (i >= 0) st.sel.splice(i, 1);
      else if (st.sel.length < PICK_MAX) st.sel.push(x.id);
      else { hint.animate && hint.animate([{opacity: .3}, {opacity: 1}], {duration: 400}); return; }
      st.any = false; update();
    });
    grid.appendChild(b); return b;
  });
  app.appendChild(grid);
  const anyB = el('button', {type: 'button', cls: 'dish any', id: 'any', 'aria-pressed': 'false', text: T.any});
  anyB.addEventListener('click', () => { st.any = !st.any; if (st.any) st.sel = []; update(); });
  app.appendChild(anyB);
  // ひとこと
  app.appendChild(el('h2', {cls: 'sub', text: T.word}));
  const chips = el('div', {cls: 'chips', role: 'group', 'aria-label': T.word});
  const chipB = T.w.map((w, v) => { const c = el('button', {type: 'button', cls: 'chip', 'data-v': String(v), 'aria-pressed': 'false', text: w}); c.addEventListener('click', () => { st.m = st.m === v ? null : v; update(); }); chips.appendChild(c); return c; });
  app.appendChild(chips);
  // 名前
  const nmId = 'me';
  app.appendChild(el('label', {cls: 'nm-l', for: nmId, text: T.me}));
  const nm = el('input', {type: 'text', id: nmId, maxlength: '10', autocomplete: 'nickname', enterkeyhint: 'done'});
  nm.addEventListener('input', () => { st.me = clean(nm.value, 10); update(); });
  app.appendChild(nm);
  // 返事
  const reply = el('section', {cls: 'reply', id: 'reply', hidden: ''});
  reply.appendChild(el('h2', {text: T.send}));
  const txt = el('textarea', {cls: 'txt', id: 'reply-text', readonly: '', rows: '4', 'aria-label': T.send});
  reply.appendChild(txt);
  const acts = el('div', {cls: 'acts'});
  const canShare = typeof navigator.share === 'function';
  const shareB = canShare ? el('button', {type: 'button', cls: 'btn main', id: 'act-share', text: T.share}) : null;
  const lineA = el('a', {cls: 'btn line', id: 'act-line', target: '_blank', rel: 'noopener noreferrer', text: 'LINE'});
  const mailA = el('a', {cls: 'btn', id: 'act-mail', text: T.mail});
  const smsA = el('a', {cls: 'btn', id: 'act-sms', text: 'SMS'});
  const copyB = el('button', {type: 'button', cls: 'btn' + (canShare ? '' : ' main'), id: 'act-copy', text: T.copy});
  [shareB, lineA, mailA, smsA, copyB].forEach(x => x && acts.appendChild(x));
  reply.appendChild(acts);
  const stat = el('p', {cls: 'st', id: 'st', role: 'status'});
  reply.appendChild(stat);
  app.appendChild(reply);
  app.appendChild(el('p', {cls: 'note', text: T.priv}));

  let text = '';
  if (shareB) shareB.addEventListener('click', async () => { try{ await navigator.share({title: T.subj, text}); }catch(e){} });
  copyB.addEventListener('click', async () => {
    let ok = false;
    try{ await navigator.clipboard.writeText(text); ok = true; }catch(e){}
    if (!ok){ try{ txt.focus(); txt.select(); ok = document.execCommand('copy'); }catch(e){} }
    stat.textContent = ok ? T.copied : '';
    if (!ok){ txt.focus(); txt.select(); }
  });
  txt.addEventListener('focus', () => txt.select());

  function replyLink(){
    const o = {v: 1, k: 'w', d: st.sel.slice(0, PICK_MAX), t: todayPack()};
    if (st.me) o.n = st.me;
    if (st.m != null) o.m = st.m;
    return DOC_BASE + '#g=' + b64uEnc(JSON.stringify(o));
  }
  function update(){
    btns.forEach(b => b.setAttribute('aria-pressed', String(st.sel.includes(b.dataset.id))));
    anyB.setAttribute('aria-pressed', String(st.any));
    chipB.forEach((c, v) => c.setAttribute('aria-pressed', String(st.m === v)));
    stat.textContent = '';
    if (!st.sel.length && !st.any){ reply.hidden = true; text = ''; return; }
    const who = st.me ? st.me + ': ' : '';
    const word = st.m != null ? ' (' + T.w[st.m] + ')' : '';
    if (st.any) text = who + T.rAny + word;
    else {
      const names = st.sel.map(id => (p.d.find(x => x.id === id) || {}).name).filter(Boolean);
      text = [who + fill(T.rWish, {list: names.join(T.sep)}) + word, T.open + (lang === 'ar' ? ' ← ' : ' → ') + replyLink()].join('\n');
    }
    txt.value = text;
    lineA.href = 'https://line.me/R/share?text=' + encodeURIComponent(text);
    mailA.href = 'mailto:?subject=' + encodeURIComponent(T.subj) + '&body=' + encodeURIComponent(text);
    smsA.href = 'sms:?&body=' + encodeURIComponent(text);
    reply.hidden = false;
  }
}
boot();
window.addEventListener('hashchange', boot);
})();
</script>
