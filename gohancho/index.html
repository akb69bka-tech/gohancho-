R('asarimiso','あさりの味噌汁','和','汁物','汁',10,'あさり 200g|長ねぎ 少々?','水 400ml・味噌 大さじ2','あさりは砂抜きして、殻をこすり洗いする。|鍋に水とあさりを入れて火にかける。|殻が開いたらアクを取り、火を弱めて味噌を溶き入れる。|小口切りのねぎを散らす（あさりからだしが出るので、だしは不要）。');
R('cornsoup','コーンスープ','洋','汁物','汁',15,'コーン缶（クリーム） 1缶|牛乳 200ml|玉ねぎ 1/4個?','バター 10g・コンソメ 小さじ1・塩 こしょう 少々','玉ねぎは薄切りにし、バターでしんなりするまで炒める。|コーン缶とコンソメを加えて混ぜる。|牛乳を加え、沸騰させないように弱火で温める。|塩こしょうで味をととのえる。');
R('clamchowder','クラムチャウダー','洋','汁物','汁',25,'あさり 200g|じゃがいも 1個|玉ねぎ 1/2個|にんじん 1/3本|牛乳 300ml|ベーコン 2枚?','バター 10g・小麦粉 大さじ1・水 200ml・コンソメ 小さじ1・塩 こしょう 少々','あさりは水200mlで酒蒸しのように加熱し、殻が開いたら身と蒸し汁に分ける。|野菜とベーコンは1cm角に切り、バターで炒めて小麦粉をふり入れる。|あさりの蒸し汁とコンソメを加え、野菜がやわらかくなるまで10分煮る。|牛乳とあさりを加えて温め、塩こしょうで味をととのえる。');
R('sanratan','酸辣湯','中','汁物','汁',15,'絹ごし豆腐 1/2丁|しいたけ 2枚|卵 1個|たけのこ水煮 50g?','水 400ml・鶏ガラスープの素 小さじ2・醤油 小さじ2・酢 大さじ2・こしょう 少々・ラー油 少々・水溶き片栗粉 大さじ1','豆腐・しいたけ・たけのこは細切りにする。|水と鶏ガラを煮立て、具を入れて3分煮る。|醤油で味をつけ、水溶き片栗粉でとろみをつけて溶き卵を回し入れる。|火を止めてから酢を加え、こしょうとラー油をふる（酢は最後に入れると香りが立つ）。');
R('tomatoeggsoup','トマトと卵のスープ','中','汁物','汁',10,'トマト 1個|卵 1個','水 400ml・鶏ガラスープの素 小さじ2・塩 こしょう 少々・ごま油 少々','トマトはくし切りにする。|水と鶏ガラを煮立て、トマトを入れて2分煮る。|塩こしょうで味をととのえ、溶き卵を細く回し入れる。|卵がふんわり固まったら、ごま油をたらす。');
R('sumashijiru','豆腐と三つ葉のすまし汁','和','汁物','汁',10,'絹ごし豆腐 1/2丁|三つ葉 少々|えのき 1/4袋?','だし 400ml・薄口醤油 小さじ1・塩 小さじ1/4・酒 小さじ1','豆腐は1.5cm角に切り、えのきは根元を落として半分の長さに切る。三つ葉は3cm長さに切る。|鍋にだしを入れて中火で温め、酒・塩・薄口醤油で味をととのえる。|豆腐とえのきを入れ、弱めの中火で2分、豆腐が温まるまで煮る（ぐらぐら煮立てると豆腐がくずれ、香りも飛ぶ）。|椀に盛り、三つ葉をのせる。');
R('kasujiru','鮭の粕汁','和','汁物','汁',30,'生鮭 2切れ|酒粕 50g|大根 3cm|にんじん 1/3本|油揚げ 1/2枚|こんにゃく 1/4枚?|長ねぎ 1/3本?','だし 600ml・味噌 大さじ1・塩 少々','鮭は一口大に切って塩少々をふり、10分おいて出た水気を拭く。酒粕は小さくちぎり、温めただし100mlに浸してやわらかくしておく。|大根とにんじんはいちょう切り、油揚げは短冊切り、こんにゃくはちぎって2分下ゆでする。|残りのだしで野菜とこんにゃくを中火で8分、やわらかくなるまで煮る。|鮭と油揚げを加え、アクを取りながら弱めの中火で5分、鮭の中まで火が通るまで煮る。|酒粕をだしごと溶きのばして加え、味噌も溶き入れる。弱火で2分温め、斜め切りのねぎを加えて火を止める。');
R('noppeijiru','のっぺい汁','和','汁物','汁',30,'鶏もも肉 100g|里芋 3個|大根 3cm|にんじん 1/3本|しいたけ 2枚?|こんにゃく 1/4枚?','だし 600ml・酒 大さじ1・醤油 大さじ1・塩 小さじ1/4・水溶き片栗粉 大さじ1.5','鶏肉は小さめの一口大、里芋は皮をむいて1cm幅の輪切り、大根・にんじんはいちょう切り、しいたけは薄切りにする。こんにゃくはちぎって2分下ゆでする。|鍋にだし・野菜・こんにゃくを入れて中火にかけ、煮立ったら鶏肉と酒を加える。|アクを取り、ふたをずらして弱めの中火で12分、里芋に竹串がすっと通り、鶏肉の中まで火が通るまで煮る。|醤油と塩で味をととのえ、水溶き片栗粉を回し入れて混ぜながら1分煮立て、とろみをつける。');
R('satsumajiru','さつま汁','和','汁物','汁',30,'鶏もも肉 150g|大根 3cm|にんじん 1/3本|ごぼう 1/3本?|さつまいも 1/3本?|長ねぎ 1/3本','だし 600ml・味噌 大さじ2.5・ごま油 小さじ1','鶏肉は一口大、大根とにんじんはいちょう切り、ごぼうはささがきにして水にさらす。さつまいもは1cm幅のいちょう切りにして水にさらす。|鍋にごま油を熱し、鶏肉を中火で2分、表面の色が変わるまで炒め、大根・にんじん・ごぼうを加えてさっと炒める。|だしを加え、煮立ったらアクを取る。さつまいもを入れ、弱めの中火で12分、野菜がやわらかくなり鶏肉の中まで火が通るまで煮る。|火を弱めて味噌を溶き入れ、斜め切りのねぎを加えてひと煮して火を止める。');
R('kakitamajiru','かき玉汁','和','汁物','汁',10,'卵 1個|三つ葉 少々?|長ねぎ 少々?','だし 400ml・薄口醤油 小さじ1・塩 小さじ1/4・水溶き片栗粉 小さじ2','卵はよく溶きほぐす。三つ葉は2cm長さ、ねぎは小口切りにする。|だしを中火で煮立て、薄口醤油と塩で味をつける。|水溶き片栗粉を加えて混ぜ、軽くとろみがついて煮立った状態を保つ。|溶き卵を細く回し入れ、30秒ほど触らずに待ってから大きくひと混ぜし、卵がふんわり固まるまで火を通す。椀に盛り、三つ葉とねぎを散らす。');
R('ishikarijiru','石狩汁','和','汁物','汁',30,'生鮭 2切れ|じゃがいも 1個|玉ねぎ 1/2個|キャベツ 2枚|にんじん 1/3本|長ねぎ 1/3本?|バター 10g?','だし 600ml・酒 大さじ1・味噌 大さじ2.5','鮭は3等分に切って熱湯をさっとかけ、くさみを取る。じゃがいもは一口大、玉ねぎはくし切り、にんじんは半月切り、キャベツはざく切りにする。|鍋にだし・じゃがいも・にんじん・玉ねぎを入れて中火にかけ、煮立ったら弱めの中火で8分煮る。|鮭・キャベツ・酒を加え、アクを取りながら6分、鮭の中まで火が通るまで煮る。|火を弱めて味噌を溶き入れ、斜め切りのねぎを加える。好みで椀に盛ってからバターをのせる。');
R('sawaniwan','沢煮椀','和','汁物','汁',20,'豚バラ薄切り肉 50g|にんじん 1/4本|ごぼう 1/4本|しいたけ 2枚|長ねぎ 1/3本|三つ葉 少々?','だし 500ml・酒 大さじ1・薄口醤油 小さじ2・塩 少々・こしょう 少々','にんじん・しいたけ・ねぎは4cm長さのせん切り、ごぼうもせん切りにして水にさらす。豚肉は細切りにする。|豚肉は熱湯に入れ、色が変わってから30秒ゆでてざるに上げ、余分な脂を落とす。|だしを中火で煮立て、ごぼうとにんじんを入れて3分煮る。しいたけ・ねぎ・豚肉を加え、さらに2分、豚肉の中まで火が通るまで煮る。|酒・薄口醤油・塩で味をととのえ、椀に盛って三つ葉をのせ、こしょうをふる。');
R('senbajiru','船場汁','和','汁物','汁',25,'さば 2切れ|大根 4cm|長ねぎ 1/3本?|生姜 1かけ?','水 500ml・昆布 5cm・酒 大さじ1・塩 小さじ1/3・薄口醤油 小さじ1','さばは一口大に切って塩少々（分量外）をふり、10分おく。熱湯をかけて水気を拭く。大根は短冊切り、生姜はせん切りにする。|鍋に水と昆布を入れて15分おき、中火にかけて煮立つ直前に昆布を取り出す。|大根を入れて5分煮たら、さばと酒を加える。アクを取りながら弱めの中火で8分、さばの中まで火が通るまで煮る。|塩と薄口醤油で味をととのえ、椀に盛ってねぎと生姜をのせる。');
R('gojiru','呉汁','和','汁物','汁',25,'大豆（水煮） 100g|大根 3cm|にんじん 1/3本|油揚げ 1/2枚|長ねぎ 1/3本?|里芋 2個?','だし 600ml・味噌 大さじ2.5','大豆はだし200mlと一緒にミキサーにかけ、なめらかにする（これが「呉」）。|大根・にんじんはいちょう切り、里芋は輪切り、油揚げは短冊切りにする。|残りのだしで野菜と油揚げを中火で10分、やわらかくなるまで煮る。|大豆のペーストを加え、ふきこぼれないよう混ぜながら弱めの中火で3分、しっかり煮立たせて火を通す。|火を弱めて味噌を溶き入れ、小口切りのねぎを散らす。');
R('dangojiru','だんご汁','和','汁物','汁',40,'小麦粉 100g|豚バラ薄切り肉 80g|大根 3cm|にんじん 1/3本|ごぼう 1/3本|しいたけ 2枚?|長ねぎ 1/3本?','水 60ml（だんご用）・塩 ひとつまみ・だし 700ml・味噌 大さじ3','小麦粉に塩と水を少しずつ加えてこね、耳たぶくらいのやわらかさにまとめる。ラップをして15分休ませる。|豚肉は3cm幅、大根とにんじんはいちょう切り、ごぼうはささがき、しいたけは薄切りにする。|鍋にだしと野菜を入れて中火にかけ、煮立ったら豚肉を加える。アクを取りながら8分、野菜がやわらかくなり豚肉の中まで火が通るまで煮る。|生地を一口大にちぎり、指で薄くのばしながら入れる。浮き上がってから3分、芯がなくなるまで煮る。|味噌を溶き入れ、小口切りのねぎを散らす。');
R('shijimimiso','しじみの味噌汁','和','汁物','汁',10,'しじみ 200g|長ねぎ 少々?','水 450ml・酒 大さじ1・味噌 大さじ2','しじみは砂抜きし、殻をこすり合わせて洗う。|鍋に水・酒・しじみを入れて中火にかける（水から入れるとうまみがよく出る）。|煮立ったらアクを取り、弱めの中火で2分、殻がすべて開くまで煮る（開かないものは取り除く）。|火を弱めて味噌を溶き入れ、小口切りのねぎを散らす。');
R('imoni','芋煮','和','汁物','汁',35,'里芋 6個|牛こま切れ肉 150g|こんにゃく 1/2枚|長ねぎ 1本|しめじ 1/2パック?','水 700ml・酒 大さじ2・醤油 大さじ3・砂糖 大さじ1.5','里芋は皮をむいて大きければ半分に切り、塩少々（分量外）でもんでぬめりを洗う。こんにゃくはちぎって2分下ゆでする。ねぎは斜め切り、しめじはほぐす。|鍋に水・里芋・こんにゃくを入れて中火にかけ、煮立ったら弱めの中火で12分、里芋に竹串が通るまで煮る。|酒・砂糖・醤油の半量を加え、牛肉を広げながら入れる。アクを取りながら4分、牛肉の色がすっかり変わり中まで火が通るまで煮る。|残りの醤油としめじ・ねぎを加え、3分煮てねぎがしんなりしたら火を止める。');
R('daikonmiso','大根と油揚げの味噌汁','和','汁物','汁',15,'大根 4cm|油揚げ 1/2枚|長ねぎ 少々?','だし 400ml・味噌 大さじ2','大根は5mm角の拍子木切り、油揚げは熱湯をかけて油抜きし、短冊切りにする。|だしに大根を入れて中火にかけ、煮立ったら弱めの中火で6分、大根が透き通るまで煮る。|油揚げを加えて1分煮る。|火を弱めて味噌を溶き入れ、小口切りのねぎを散らす。');
R('zoni','お雑煮（関東風）','和','汁物','汁',25,'切り餅 4個|鶏もも肉 100g|小松菜 2株|にんじん 3cm?|かまぼこ 4切れ?|三つ葉 少々?','だし 600ml・酒 大さじ1・薄口醤油 大さじ1・塩 小さじ1/4','鶏肉は小さめの一口大に切る。にんじんは薄い輪切り、小松菜は塩ゆでして水にとり、3cm長さに切って水気を絞る。|鍋にだし・にんじんを入れて中火にかけ、煮立ったら鶏肉と酒を加える。アクを取りながら6分、鶏肉の中まで火が通るまで煮る。|薄口醤油と塩で味をととのえる。|餅はオーブントースターで6〜8分、ふくらんで焼き色がつくまで焼く。小さな子どもやお年寄りには小さく切って出し、よくかんで食べるよう声をかける。|椀に餅・小松菜・かまぼこを入れ、熱い汁と鶏肉を注いで三つ葉をのせる。');
R('kabochapotage','かぼちゃのポタージュ','洋','汁物','汁',25,'かぼちゃ 1/8個|玉ねぎ 1/4個|牛乳 250ml|生クリーム 大さじ2?','バター 10g・水 150ml・コンソメ 小さじ1・塩 こしょう 少々','かぼちゃは種とわたを取り、皮をむいて薄切りにする。玉ねぎも薄切りにする。|鍋にバターを溶かし、玉ねぎを弱めの中火で3分、しんなりするまで炒める。かぼちゃを加えてさっと炒める。|水とコンソメを加え、ふたをして弱火で10分、かぼちゃがくずれるくらいやわらかくなるまで煮る。|粗熱をとってミキサーにかけ、なめらかにする。|鍋に戻して牛乳を加え、沸騰させないように弱火で温める。塩こしょうで味をととのえ、生クリームをたらす。');
R('potofu','ポトフ','洋','汁物','汁',40,'ウインナー 6本|じゃがいも 2個|にんじん 1/2本|玉ねぎ 1個|キャベツ 1/8個|ブロッコリー 1/4株?','水 700ml・コンソメ 小さじ2・ローリエ 1枚・塩 こしょう 少々・粒マスタード 適量','じゃがいもは半分、にんじんは縦4つ割り、玉ねぎはくし形に切る。キャベツは芯をつけたまま2等分にする。ブロッコリーは小房に分ける。|鍋に水・コンソメ・ローリエ・じゃがいも・にんじん・玉ねぎを入れて中火にかけ、煮立ったら弱火で15分煮る。|キャベツとウインナーを加え、ふたをしてさらに10分煮る。ブロッコリーは最後の3分で入れる。|塩こしょうで味をととのえ、粒マスタードを添える。');
R('wantansoup','ワンタンスープ','中','汁物','汁',25,'ワンタンの皮 20枚|豚ひき肉 100g|長ねぎ 1/3本|チンゲン菜 1株?|生姜 少々?','醤油 小さじ1・ごま油 小さじ1・水 600ml・鶏ガラスープの素 大さじ1・塩 こしょう 少々','長ねぎの半量はみじん切り、残りは斜め薄切りにする。チンゲン菜は4cm長さに切る。|ひき肉にみじん切りのねぎ・すりおろした生姜・醤油・ごま油を加え、粘りが出るまで混ぜる。ワンタンの皮に小さじ1ずつのせ、縁に水をつけて三角に折って閉じる。|水と鶏ガラスープの素を煮立て、チンゲン菜の茎を入れて1分煮る。|ワンタンを1つずつ入れ、浮き上がってからさらに2〜3分、肉あんの中まで火が通るまで中火で煮る。チンゲン菜の葉と斜め切りのねぎを加え、塩こしょうで味をととのえる。');
R('harusamesoup','春雨スープ','中','汁物','汁',15,'春雨 20g|豚ひき肉 50g?|しいたけ 2枚|にんじん 1/4本|卵 1個?|万能ねぎ 少々?','ごま油 小さじ1・水 500ml・鶏ガラスープの素 小さじ2・醤油 小さじ1・酢 小さじ1（好みで）・塩 こしょう 少々','しいたけは薄切り、にんじんはせん切りにする。春雨は乾燥のまま、長ければキッチンばさみで切る。|鍋にごま油を熱し、ひき肉を中火で2分、ポロポロになって色がすっかり変わるまで炒める。にんじんとしいたけを加えてさっと炒める。|水と鶏ガラスープの素を加えて煮立て、春雨を入れて表示時間（約3〜4分）煮る。|醤油・塩こしょうで味をととのえ、溶き卵を回し入れて卵がふんわり固まるまで火を通す。好みで酢を加え、小口切りのねぎを散らす。');
R('kimchichige','キムチチゲ','韓','汁物','汁',25,'白菜キムチ 150g|豚バラ薄切り肉 120g|木綿豆腐 1/2丁|玉ねぎ 1/4個|長ねぎ 1/3本?|えのき 1/2袋?','ごま油 大さじ1・おろしにんにく 小さじ1/2・コチュジャン 小さじ2・水 450ml・鶏ガラスープの素 小さじ2・醤油 小さじ1','豚肉は4cm幅、豆腐は1cm幅、玉ねぎは薄切り、ねぎは斜め切りにする。キムチは大きければ切る。|鍋にごま油を熱し、豚肉を中火で炒める。色が変わったらキムチとにんにくを加え、2分炒めて酸味をとばす。|水・鶏ガラスープの素・コチュジャンを加えて煮立て、玉ねぎとえのきを入れて5分煮る（豚肉の中まで火が通る）。|豆腐を入れて3分煮て、醤油で味をととのえ、ねぎを加えてひと煮する。');
R('tomyumkung','トムヤムクン','エスニック','汁物','汁',20,'えび 6尾|しめじ 1/2パック|トマト 1/2個?|パクチー 少々?','トムヤムペースト 大さじ1.5・水 500ml・鶏ガラスープの素 小さじ1・ナンプラー 小さじ2・砂糖 小さじ1・レモン汁 大さじ1','えびは背わたを取り、殻をむく（尾は残す）。しめじはほぐし、トマトはくし切りにする。|鍋に水と鶏ガラスープの素を煮立て、トムヤムペーストを溶かす。|しめじとトマトを入れて2分煮て、えびを加える。中火で2〜3分、えびの身が白くなり中まで火が通るまで煮る。|ナンプラーと砂糖で味をととのえ、火を止めてからレモン汁を加える。器に盛り、パクチーをのせる。');
R('sukiyaki','すき焼き','和','主菜','煮',25,'牛薄切り肉 250g|木綿豆腐 1/2丁|長ねぎ 1本|白菜 1/8個|しらたき 1袋|しいたけ 4枚?|春菊 1/2束?|卵 2個?','醤油 大さじ4・砂糖 大さじ3・みりん 大さじ3・酒 大さじ3・水 100ml・牛脂またはサラダ油 少々','豆腐は8等分、長ねぎは斜め切り、白菜はざく切り、春菊は葉を摘む。しいたけは軸を取り、しらたきは下ゆでして食べやすく切る。|醤油・砂糖・みりん・酒・水を混ぜて割り下を作る。|鍋に油を熱して牛肉の半量を広げて焼き、割り下を少し注いでからめる。|残りの肉・豆腐・野菜・しらたきを並べ、割り下を加えて中火で8分ほど煮る。好みで溶き卵につけて食べる（生卵なので、小さな子どもや妊娠中の人には卵を鍋に落として火を通す）。');
R('tarakopasta','たらこスパゲッティ','和','麺','炒',15,'スパゲッティ 200g|たらこ 1腹（80g）|バター 20g|大葉 4枚?|刻みのり 少々?','塩 大さじ1（ゆで用）・醤油 小さじ1・牛乳 大さじ1','たらこは薄皮に切り目を入れ、中身をこそげ出す。|ボウルにたらこ・やわらかくしたバター・醤油・牛乳を混ぜておく。|スパゲッティを塩を入れた湯で表示どおりにゆで、湯を切ってすぐボウルに入れて和える。|器に盛り、せん切りの大葉と刻みのりをのせる。');
R('korokke','コロッケ','洋','主菜','揚',45,'じゃがいも 3個|合いびき肉 100g|玉ねぎ 1/2個|卵 1個|パン粉 1カップ|キャベツ 1/8個?','塩 小さじ1/4・こしょう 少々・醤油 小さじ1・砂糖 小さじ1・小麦粉 大さじ3・揚げ油 適量・中濃ソース 適量','じゃがいもは皮をむいて4等分にし、やわらかくゆでて湯を捨て、火にかけて水分を飛ばしてからつぶす。|玉ねぎはみじん切りにし、ひき肉と炒めて塩・こしょう・醤油・砂糖で味をつけ、じゃがいもと混ぜる。|6等分して小判形にまとめ、粗熱を取る。小麦粉→溶き卵→パン粉の順に衣をつける。|180℃の油で2〜3分、きつね色になるまで揚げ、千切りキャベツとソースを添える。');
R('saikyoyaki','さわらの西京焼き','和','主菜','焼',30,'さわら 2切れ|大根 3cm?','白味噌 大さじ3・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1','前日（遅くとも3時間前）に仕込む。白味噌・みりん・酒・砂糖を混ぜて西京みそを作る。|さわらに西京みそを塗ってラップで包み、冷蔵庫でひと晩（最低3時間）おく。|みそを軽くぬぐい取り、魚焼きグリルの弱めの中火で両面を7〜8分焼く（焦げやすいので様子を見る）。|器に盛り、大根おろしを添える。');
R('kajikisaute','かじきのバター醤油ソテー','洋','主菜','焼',15,'かじき 2切れ|しめじ 1/2パック|ブロッコリー 1/3株?','塩 こしょう 少々・小麦粉 大さじ1・サラダ油 小さじ2・バター 10g・醤油 大さじ1・みりん 大さじ1','かじきに塩こしょうをふって5分おき、水気を拭いて小麦粉を薄くまぶす。しめじはほぐす。|フライパンに油を熱し、かじきを中火で2分焼き、返してしめじを加え2分焼く。|バター・醤油・みりんを加えて全体にからめる。|器に盛り、ゆでたブロッコリーを添える。');
R('ajinanbanzuke','あじの南蛮漬け','和','主菜','揚',30,'あじ（三枚おろし） 4尾分|玉ねぎ 1/2個|にんじん 1/3本|ピーマン 1個?','片栗粉 大さじ2・揚げ油 適量・酢 100ml・だし 50ml・砂糖 大さじ2・醤油 大さじ2・赤唐辛子 1本','酢・だし・砂糖・醤油・輪切りの唐辛子をひと煮立ちさせ、バットに入れて南蛮酢を作る。|玉ねぎは薄切り、にんじんとピーマンはせん切りにして南蛮酢に入れる。|あじは小骨を取って半分に切り、水気を拭いて片栗粉をまぶす。|170℃の油で3分からりと揚げ、熱いうちに南蛮酢に漬けて15分以上おく。');
R('ebifry','えびフライ','洋','主菜','揚',30,'えび（大） 8尾|卵 1個|パン粉 1カップ|キャベツ 1/8個?|レモン 1/4個?','塩 こしょう 少々・小麦粉 大さじ3・揚げ油 適量・タルタルソース 適量（またはとんかつソース）','えびは尾を残して殻をむき、背わたを取る。腹側に3〜4か所切り込みを入れて筋を切り、まっすぐに伸ばす。|塩こしょうをふり、小麦粉→溶き卵→パン粉の順に衣をつける。|180℃の油で2〜3分、きつね色になるまで揚げる。|千切りキャベツとレモンを添え、タルタルソースをかける。');
R('kanitama','かに玉','中','主菜','焼',15,'卵 4個|かに風味かまぼこ 4本|長ねぎ 1/3本|しいたけ 2枚?|グリーンピース 少々?','塩 こしょう 少々・サラダ油 大さじ1.5・（あん）水 150ml・鶏ガラスープの素 小さじ1・醤油 大さじ1・砂糖 大さじ1・酢 大さじ1・片栗粉 小さじ2','かにかまはほぐし、長ねぎは斜め薄切り、しいたけは薄切りにする。|卵を溶き、具と塩こしょうを混ぜる。|フライパンに油をよく熱し、卵液を一気に流して大きく混ぜ、半熟で丸く整えて返し、器に盛る。|同じフライパンにあんの材料を入れて混ぜながら煮立て、とろみがついたらかに玉にかけ、グリーンピースを散らす。');
R('tofusteak','豆腐ステーキ','和','主菜','焼',20,'木綿豆腐 1丁|豚ひき肉 80g?|万能ねぎ 少々?','片栗粉 大さじ2・サラダ油 大さじ1・醤油 大さじ1.5・みりん 大さじ1.5・酒 大さじ1・おろし生姜 小さじ1/2','豆腐はキッチンペーパーで包み、重しをのせて15分水切りし、厚さを半分にして4枚に切る。|水気を拭いて片栗粉をまぶし、油を熱したフライパンで両面をこんがり焼いて器に盛る。|同じフライパンでひき肉を炒め、醤油・みりん・酒・生姜を加えて煮立てる。|豆腐にかけ、小口切りのねぎを散らす。');
R('ankakeyakisoba','あんかけ焼きそば','中','麺','炒',20,'中華麺 2玉|豚こま切れ肉 100g|むきえび 80g?|白菜 1/8個|にんじん 1/4本|しいたけ 2枚?|うずらの卵（水煮） 4個?','サラダ油 大さじ2・ごま油 小さじ1・（あん）水 300ml・鶏ガラスープの素 小さじ2・オイスターソース 大さじ1・醤油 大さじ1・酒 大さじ1・片栗粉 大さじ1.5','白菜はそぎ切り、にんじんは短冊切り、しいたけは薄切りにする。|フライパンに油大さじ1を熱し、麺を広げて押さえながら両面をカリッと焼いて器に盛る。|残りの油で豚肉とえびを炒め、野菜とうずらの卵を加えて炒め、片栗粉以外のあんの材料を入れて煮立てる。|水溶き片栗粉でとろみをつけ、ごま油を回しかけて麺にかける。');
R('beefstew','ビーフシチュー','洋','主菜','煮',90,'カレー用牛肉 300g|玉ねぎ 1個|にんじん 1本|じゃがいも 2個|マッシュルーム 6個?|赤ワイン 100ml?','塩 こしょう 少々・小麦粉 大さじ1・サラダ油 大さじ1・水 500ml・デミグラスソース缶 1/2缶（またはビーフシチュールウ 1/2箱）・ケチャップ 大さじ1・バター 10g','牛肉は大きめの一口大に切り、塩こしょうをして小麦粉をまぶす。野菜は大きめに切る。|鍋に油を熱して牛肉の表面を焼き、玉ねぎを加えて炒め、赤ワインを入れて煮立てる。|水を加え、アクを取りながらふたをして弱火で60分煮る。|にんじん・じゃがいも・マッシュルームを加えて15分煮て、デミグラスソースとケチャップを入れ、とろみがつくまで10分煮て最後にバターを溶かす。');
R('tempura','天ぷら','和','主菜','揚',35,'えび 6尾|なす 1本|かぼちゃ 1/8個|さつまいも 1/3本?|大葉 4枚?|ししとう 4本?','（衣）小麦粉 100g・冷水 150ml・卵 1/2個分・揚げ油 適量・（天つゆ）だし 150ml・醤油 大さじ2・みりん 大さじ2・大根おろし 適量','えびは殻と背わたを取り、腹側に切り込みを入れて伸ばす。なすは縦4つ、かぼちゃとさつまいもは5mm厚さに切り、ししとうは包丁で穴をあける。|だし・醤油・みりんをひと煮立ちさせて天つゆを作る。|冷水に卵を溶き、ふるった小麦粉をさっくり混ぜる（混ぜすぎない）。|具に薄く粉をまぶして衣をつけ、野菜は170℃で2〜3分（大葉は裏側だけに衣をつけて30秒）、えびは180℃で1分半揚げる。天つゆと大根おろしで食べる。');
R('asparamaki','豚肉のアスパラ巻き','和','主菜','焼',20,'豚バラ薄切り肉 8枚|グリーンアスパラガス 8本|ミニトマト 4個?','塩 こしょう 少々・小麦粉 少々・サラダ油 小さじ1・醤油 大さじ1・みりん 大さじ1・酒 大さじ1','アスパラは根元のかたい部分を切り落とし、下1/3の皮をむいて半分に切る。|豚肉を広げて塩こしょうをし、アスパラを2切れずつのせて斜めに巻き、小麦粉を薄くまぶす。|巻き終わりを下にしてフライパンで焼き、転がしながら全体に焼き色をつけてふたをし、弱火で3分蒸し焼きにする。|醤油・みりん・酒を加えて煮からめ、ミニトマトを添える。');
R('tsukune','鶏つくね','和','主菜','焼',25,'鶏ひき肉 300g|長ねぎ 1/2本|卵 1個?|大葉 6枚?','片栗粉 大さじ1・おろし生姜 小さじ1・塩 少々・サラダ油 小さじ1・醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1・酒 大さじ1','長ねぎはみじん切りにする。|ボウルにひき肉・ねぎ・卵・片栗粉・生姜・塩を入れ、粘りが出るまでよく練り、8等分して小判形にする（好みで大葉で巻く）。|フライパンに油を熱して並べ、中火で焼き色がついたら返し、ふたをして弱火で5分、中まで火が通るまで蒸し焼きにする。|醤油・みりん・砂糖・酒を加えて照りが出るまで煮からめる。');
R('rebanira','レバニラ炒め','中','主菜','炒',25,'豚レバー 200g|ニラ 1束|もやし 1袋|にんじん 1/4本?','（下味）醤油 小さじ2・酒 小さじ2・おろし生姜 小さじ1・片栗粉 大さじ1・サラダ油 大さじ1.5・オイスターソース 大さじ1・醤油 小さじ2・酒 大さじ1・砂糖 小さじ1/2・ごま油 小さじ1','レバーは薄切りにして水を2〜3回替えながら10分さらし、血抜きをして水気を拭く。|下味の醤油・酒・生姜をもみ込んで10分おき、片栗粉をまぶす。ニラは4cm長さ、にんじんは短冊切りにする。|フライパンに油大さじ1を熱し、レバーを両面焼いて火を通し、いったん取り出す。|残りの油でにんじん・もやしを強火で炒め、レバーとニラを戻して合わせ調味料を加え、手早く炒めてごま油を回す。');
R('yasaiitame','野菜炒め','中','主菜','炒',15,'豚こま切れ肉 120g|キャベツ 1/4個|もやし 1袋|にんじん 1/4本|ピーマン 1個?|きくらげ（乾燥） 3g?','塩 こしょう 少々・サラダ油 大さじ1・鶏ガラスープの素 小さじ1・醤油 小さじ2・オイスターソース 小さじ1・ごま油 小さじ1','キャベツはざく切り、にんじんは短冊切り、ピーマンは細切りにする。きくらげは水でもどす。|豚肉に塩こしょうをふり、油を熱したフライパンで炒めて色が変わったら取り出す。|強火でにんじん→キャベツの芯→残りの野菜・もやしの順に、火の通りにくいものから炒める。|豚肉を戻して調味料を加え、手早く全体を混ぜてごま油を回す（炒めすぎない）。');
R('katsudon','かつ丼','和','ごはん','煮',35,'豚ロース厚切り肉 2枚|玉ねぎ 1/2個|卵 3個|パン粉 1カップ|ご飯 2杯分|三つ葉 少々?','塩 こしょう 少々・小麦粉 大さじ2・揚げ油 適量・だし 150ml・醤油 大さじ2・みりん 大さじ2・砂糖 小さじ2','豚肉は筋を切って塩こしょうをふり、小麦粉→溶き卵（1個分）→パン粉をつけて170℃の油で5〜6分揚げ、食べやすく切る。|小さめのフライパンにだし・醤油・みりん・砂糖と薄切りの玉ねぎを入れて3分煮る。|1人分ずつ、かつをのせて溶き卵1個分を回し入れ、ふたをして半熟になるまで1分煮る（小さな子どもや妊娠中の人の分は2分煮て卵に火を通す）。|丼のご飯にすべらせるようにのせ、三つ葉を添える。');
R('chirashi','ちらし寿司','和','ごはん','炊',45,'米 2合|干ししいたけ 3枚|にんじん 1/3本|れんこん 50g?|卵 2個|さやいんげん 6本?|むきえび 6尾?|刻みのり 少々?','昆布 5cm・（すし酢）酢 大さじ4・砂糖 大さじ2・塩 小さじ1・（具の煮汁）しいたけのもどし汁 100ml・醤油 大さじ1・砂糖 大さじ1・みりん 大さじ1・（錦糸卵）砂糖 小さじ1・塩 少々','米は昆布を入れてやや少なめの水で炊く。干ししいたけは水でもどして細切り、にんじんも細切り、れんこんは薄いいちょう切りにする。|しいたけ・にんじん・れんこんを煮汁で汁気がなくなるまで煮る。えびといんげんはゆでる。|卵に砂糖と塩を混ぜて薄焼きにし、細く切って錦糸卵にする。|炊きたてのご飯にすし酢を回しかけて切るように混ぜ、煮た具を混ぜて器に盛り、錦糸卵・えび・いんげん・のりを飾る。');
R('tandoori','タンドリーチキン','エスニック','主菜','焼',30,'鶏もも肉 2枚|プレーンヨーグルト 大さじ4|レモン 1/4個?|サニーレタス 2枚?','カレー粉 大さじ1・ケチャップ 大さじ1・おろしにんにく 小さじ1・おろし生姜 小さじ1・塩 小さじ1/2・サラダ油 小さじ1','鶏肉は余分な脂を取り、厚い部分を開いて半分に切る。|ヨーグルト・カレー粉・ケチャップ・にんにく・生姜・塩を混ぜ、鶏肉をもみ込んで30分以上（できればひと晩）漬ける。|フライパンに油を熱し、皮目から中火で焼く。焼き色がついたら返し、ふたをして弱火で7〜8分焼く。|食べやすく切り、レタスとレモンを添える。');
R('meatsauce','ミートソーススパゲッティ','洋','麺','煮',30,'スパゲッティ 200g|合いびき肉 200g|玉ねぎ 1/2個|にんじん 1/4本?|トマト缶 1缶|粉チーズ 適量?','オリーブ油 大さじ1・おろしにんにく 小さじ1・赤ワインまたは酒 大さじ2・ケチャップ 大さじ2・中濃ソース 大さじ1・コンソメ 小さじ1・砂糖 小さじ1・塩 こしょう 少々','玉ねぎとにんじんはみじん切りにする。|オリーブ油でにんにく・玉ねぎ・にんじんを炒め、しんなりしたらひき肉を加えてポロポロになるまで炒める。|ワインを入れて煮立て、トマト缶・ケチャップ・ソース・コンソメ・砂糖を加え、ときどき混ぜながら弱めの中火で15分煮詰めて塩こしょうで味を調える。|スパゲッティを塩を入れた湯でゆで、器に盛ってソースをかけ、粉チーズをふる。');
R('kabuamazu','かぶの甘酢漬け','和','副菜','和え',10,'かぶ 3個|かぶの葉 少々?|昆布 3cm?','塩 小さじ1/2・酢 大さじ3・砂糖 大さじ2・赤唐辛子 少々','かぶは皮をむいて薄いいちょう切りにし、葉は細かく刻む。|塩をふって10分おき、しんなりしたら水気を絞る。|酢と砂糖をよく混ぜて溶かし、かぶ・細切りの昆布・輪切りの唐辛子と合わせる。|冷蔵庫で30分以上おいて味をなじませる。');
R('gomokumame','五目豆','和','副菜','煮',40,'大豆（水煮） 200g|にんじん 1/3本|ごぼう 1/3本|こんにゃく 1/3枚|昆布 5cm?|干ししいたけ 2枚?','だし 300ml・醤油 大さじ2・砂糖 大さじ2・みりん 大さじ1','干ししいたけと昆布は水でもどす。|にんじん・ごぼう・こんにゃく・しいたけ・昆布をすべて大豆くらいの1cm角に切る。こんにゃくは下ゆでする。|鍋に大豆と具、だしを入れて煮立て、砂糖を加えて落としぶたをし、弱火で10分煮る。|醤油とみりんを加え、汁気が少なくなるまでさらに15分煮る。');
R('shiraae','白和え','和','副菜','和え',20,'木綿豆腐 1/2丁|ほうれん草 1/2束|にんじん 1/4本|こんにゃく 1/4枚?','白すりごま 大さじ2・砂糖 大さじ1・薄口醤油 小さじ1・塩 少々・（具の下味）だし 100ml・醤油 小さじ1・砂糖 小さじ1','豆腐はキッチンペーパーで包んで重しをし、20分水切りする。|にんじんとこんにゃくは細切りにし、だし・醤油・砂糖で汁気がなくなるまで煮て冷ます。ほうれん草はゆでて3cm長さに切り、水気を絞る。|ボウルに豆腐をくずし入れ、すりごま・砂糖・薄口醤油・塩を加えてなめらかになるまで混ぜる。|具の汁気をよく切って和える。');
R('shiokombu','キャベツの塩昆布和え','和','副菜','和え',5,'キャベツ 1/4個|塩昆布 10g|きゅうり 1/2本?','ごま油 大さじ1・白ごま 小さじ1・酢 小さじ1（好みで）','キャベツはざく切り、きゅうりは薄切りにする。|ポリ袋にキャベツ・きゅうり・塩昆布を入れて軽くもむ。|ごま油を加えてさらにもみ、5分おく。|器に盛り、白ごまをふる。');
R('nasudengaku','なす田楽','和','副菜','焼',20,'なす 2本','サラダ油 大さじ2・味噌 大さじ2・砂糖 大さじ1・みりん 大さじ1・酒 大さじ1・白ごま 少々','なすはへたを取って縦半分に切り、皮に浅く格子の切り目を入れる（断面にも浅く切り目を入れる）。|味噌・砂糖・みりん・酒を小鍋で混ぜながら弱火で練り、田楽みそを作る。|フライパンに油を熱し、なすを皮目から焼き、返してふたをして弱火でやわらかくなるまで5分焼く。|切り口に田楽みそを塗り、白ごまをふる。');
R('furofuki','ふろふき大根','和','副菜','煮',50,'大根 1/2本|米のとぎ汁 適量?|ゆずの皮 少々?','昆布 10cm・水 800ml・塩 少々・味噌 大さじ2・砂糖 大さじ1・みりん 大さじ1・だし 大さじ2','大根は3cm厚さの輪切りにして皮を厚めにむき、角を面取りし、片面に十字の隠し包丁を入れる。|米のとぎ汁で竹串がすっと通るまで20分下ゆでし、水で洗う。|鍋に昆布・水・塩・大根を入れ、弱火で20分煮て味を含ませる。|味噌・砂糖・みりん・だしを小鍋で練って練りみそを作り、器に盛った大根にかけてゆずの皮をのせる。');
R('koyadofu','高野豆腐の含め煮','和','副菜','煮',25,'高野豆腐 2枚|にんじん 1/3本?|さやいんげん 4本?|干ししいたけ 2枚?','だし 400ml・砂糖 大さじ2・みりん 大さじ1・薄口醤油 大さじ1・塩 少々','高野豆腐はぬるま湯に5分つけてもどし、両手ではさんで水を押し出しながら2〜3回洗い、4等分に切る。|にんじんは輪切り、しいたけはもどして半分に切る。|鍋にだし・砂糖・みりん・薄口醤油・塩を煮立て、高野豆腐・にんじん・しいたけを入れて落としぶたをし、弱火で15分煮る。|ゆでたいんげんを加え、火を止めてそのまま冷まして味を含ませる。');
R('germanpotato','ジャーマンポテト','洋','副菜','炒',20,'じゃがいも 2個|ベーコン 3枚|玉ねぎ 1/4個?|パセリ 少々?','オリーブ油 大さじ1・おろしにんにく 小さじ1/2・塩 こしょう 少々・粒マスタード 小さじ1（好みで）','じゃがいもは皮付きのまま一口大に切り、電子レンジで4分加熱する。ベーコンは1cm幅、玉ねぎは薄切りにする。|フライパンにオリーブ油とにんにくを入れて弱火にかけ、香りが出たらベーコンと玉ねぎを炒める。|じゃがいもを加え、中火で焼き色がつくまであまり動かさずに焼く。|塩こしょうと粒マスタードで味を調え、刻んだパセリを散らす。');
R('shirishiri','にんじんしりしり','和','副菜','炒',10,'にんじん 1本|卵 1個|ツナ缶 1/2缶?','ごま油 小さじ2・醤油 小さじ1・和風だしの素 小さじ1/2・塩 少々','にんじんはスライサーで細切りにする。|フライパンにごま油を熱し、にんじんを中火で2〜3分、しんなりするまで炒める。|ツナを加え、だしの素・醤油・塩で味をつける。|溶き卵を回し入れ、全体を混ぜてふんわり火を通す。');

function matchRecipe(r, have){
    const req = r.items.filter(i => !i.opt && !PANTRY.has(i.key));
    const got = [], miss = [], subs = [];
    req.forEach(i => {
        if (have.has(i.key)) got.push(i);
        else {
            const alt = (SUBS[i.key]||[]).find(k => have.has(k));
            if (alt) subs.push({i, alt}); else miss.push(i);
        }
    });
    const optGot = r.items.filter(i => i.opt && have.has(i.key));
    const ratio = req.length ? (got.length + subs.length*0.6) / req.length : 0;
    return {r, got, miss, subs, optGot, ratio, used: got.length + subs.length + optGot.length};
}

const BENTO_FEW = 5;

    const key = (mixCc(slot) || currentCountry()) + '|' + slot + '|' + pool.length + '|' + S.hidden.length + '|' + S.settings.avoid.join() + '|' + scarceList().join();
    if (bentoMemo.has(key)) return bentoMemo.get(key);
    const n = pool.filter(r => (slot === '主菜' ? r.main : slotOf(r) === slot) && bentoFits(r) && !S.hidden.includes(r.id) && !isAvoided(r)).length;

function bentoPool(slot, list){ const f = list.filter(bentoFits); return f.length ? f : list; }

function bentoNote(){

    const m = bentoCount('主菜'), sd = bentoCount('副菜');
    if (items.some(x => !bentoFits(x.r))) return t('この国にはお弁当向きの料理が足りないので、お弁当に向かない料理が含まれています');
    const note = t('お弁当向きのおかずです（冷ましてから詰めてください）');
    return m < BENTO_FEW || sd < BENTO_FEW ? note + ' ' + t('お弁当向きが少ない国です（主菜{m}品・副菜{s}品から選んでいます）', {m, s: sd}) : note;
}
function easyPool(slot, list){
    if (session.mood === 'bento') return bentoPool(slot, list);
    if (session.mood !== 'easy') return list;
    const f = easyInfo(slot); return f.lv >= 5 ? list : list.filter(r => easyOk(r, f));
}
function moodOk(r, mood){
    switch(mood){
        case 'quick': return r.min <= 20;
        case 'easy': return easyOk(r, easyInfo(['副菜', '汁物'].includes(slotOf(r)) ? slotOf(r) : '主菜'));
        case 'bento': return bentoFits(r);
        case 'asia': return r.genre === '韓' || r.genre === 'エスニック';
        case 'fish': return ['魚','魚介'].includes(r.family);
        case 'meat': return ['豚','鶏','牛','ひき肉'].includes(r.family);

    }

function scoreRecipe(r, ctx){
    if (S.hidden.includes(r.id) || session.rejected.has(r.id) || isAvoided(r)) return -Infinity;
    const avoid = S.settings.avoidDays;
    const ds = daysSince(r.id);
    if (ds < avoid && !ctx.relax) return -Infinity;
    let s = 1;
    if (ds < avoid*2) s -= 0.35 * (1 - (ds - avoid) / avoid);
    if (ds === Infinity) s += 0.1;
    if (S.favs.includes(r.id)) s += 0.3;
    if (session.mood === 'easy' && ['炒','焼','煮','炊','汁'].includes(r.method)) s += 0.2;   // ラクの日は、1つの鍋・フライパンで作れる調理法を少し優先
    if (mildOn() && spiceLevel(r) === 1) s -= 0.4;   // 辛いのが苦手な人がいるときは、辛みの少ない料理を先に
    s += reactBias(r.id);   // 家族の「おいしかった！」が多い料理は少し出やすく
    if (ctx.recent){
        ctx.recent.forEach(x => {
            if (x.family === r.family && r.family !== '野菜') s -= x.ago <= 1 ? 0.6 : 0.2;
            if (x.genre === r.genre && x.ago <= 1) s -= 0.2;
        });
    }
    if (ctx.main){
        if (ctx.main.genre === r.genre) s += 0.3;
        else if ((ctx.main.genre === '韓' && r.genre === '中') || (ctx.main.genre === 'エスニック' && r.genre === '中')) s += 0.15;
        if (r.family === ctx.main.family && r.family !== '野菜') s -= 0.5;
        const overlap = r.items.filter(i => ctx.main.items.some(m => m.key === i.key)).length;
        s -= overlap * 0.15;
    }
    (ctx.others || []).forEach(o => {
        if (o.method === r.method) s -= 0.25;
        if (o.family === r.family && r.family !== '野菜') s -= 0.3;
        s -= r.items.filter(i => o.items.some(m => m.key === i.key)).length * 0.15;
    });
    if (ctx.fridge && ctx.fridge.size){ s += matchRecipe(r, ctx.fridge).ratio * 0.8; }
    if (ctx.weekday && r.min > 45) s -= 0.7 * Math.min(1, (r.min - 45) / 45);   // 平日は時間のかかる主菜を出しにくく（土日はそのまま）
    return s;
}
function pick(cands, ctx){
    let scored = cands.map(r => ({r, s: scoreRecipe(r, ctx)})).filter(x => x.s > -Infinity);
    if (!scored.length && !ctx.strict) scored = cands.filter(r => !S.hidden.includes(r.id) && !isAvoided(r)).map(r => ({r, s: scoreRecipe(r, Object.assign({}, ctx, {relax:true}))})).filter(x => x.s > -Infinity);
    if (!scored.length) return null;
    scored.forEach(x => x.s += Math.random() * 0.7);
    scored.sort((a,b) => b.s - a.s);
    return scored[0].r;
}
// keep: そのまま残すほかの料理（{…, slot}）。同じ料理・2品目の主菜と同じ肉や魚にならない主菜から選ぶ
// bowl: 主菜だけを「かえる」とき、ご飯もの・麺・汁ものかどうかをいまの主菜とそろえる（ご飯の欄がお漬物に変わるなど、ほかの欄が動かないように）
const isBowlMain = r => !!r && (r.type === 'ごはん' || r.type === '麺' || r.type === '汁物' || r.id === 'nikuudon');
function suggestMain(keep = [], bowl = null, sameKind = false){   // sameKind: 「かえる」では、同じ種類（ご飯もの・麺／ふつうの主菜）の候補がなければ null（別の種類にして、ご飯の欄を動かさない）
    const wd = parseYmd(TODAY).getDay();
    const ctx = {recent: recentMainFamilies(3), fridge: session.useFridge ? fridgeKeys() : null, weekday: wd >= 1 && wd <= 5 && session.mood === 'all'};
    const clash = r => keep.some(k => k && (k.id === r.id || ((k.slot || '主菜') === '主菜' && k.family === r.family && r.family !== '野菜'))) || (bowl != null && isBowlMain(r) !== bowl);
    let cands = poolFor('主菜').filter(r => r.main && moodOk(r, session.mood) && !isAvoided(r));
    if (!cands.length) cands = poolFor('主菜').filter(r => r.main && !isAvoided(r));      // その気分の料理がない国でも空にしない
    if (sameKind && bowl != null && !cands.some(r => !clash(r))) return null;

    // 1週間プランで、これから先の日の主菜にした料理は、今日は避ける（ほかに候補があるとき）
    const ahead = new Set(((S.week && S.week.days) || []).filter(x => x.d > TODAY && !x.skip).map(x => x.id));

// 条件（最近作った・肉魚の重なり・ジャンル）で候補がなくなったときは、その枠の料理からどれかを出す（空の枠を作らない）
function suggestOrAny(slot, items, main){

function formLabel(k){
    return {don:t('丼にする'), gratin:t('グラタンにする'), harumaki:t('春巻きにする'), pasta:t('パスタにする'), omelet:t('オムレツにする'), sand:t('サンドにする'), cheese:t('チーズ焼きにする'), nabe:t('鍋にする'), onigiri:t('焼きおにぎりにする')}[k] || (FORMS[k] ? FORMS[k].label : k);
}
function swapOf(k){ if (!k) return null; const [f,i] = k.split(':'); return (SWAPS[f]||[])[+i] || null; }
function twistId(baseId, fl, fo, sw){ return ['a', baseId, fl||'', fo||'', sw||''].join('~'); }
function buildTwist(id){
    const [, baseId, fl, fo, sw] = String(id).split('~');
    const base = RECIPES.find(r => r.id === baseId); if (!base) return null;
    const F = FLAVORS[fl], M = FORMS[fo], W = swapOf(sw);
    const re = W ? FAMILY_RE[base.family] : null;
    const repl = t => re ? t.replace(re, W.word) : t;
    const items = base.items.map(i => {
        if (W && i.key === base.protein) return Object.assign({}, i, {name:W.word, key:keyOf(W.word), label:labelOf(W.word), changed:true});
        return i;
    });
    const addItems = [...(F ? F.add : []), ...(M ? M.add : [])].map(s => Object.assign(parseIng(s), {opt:false, added:true}));
    const steps = base.steps.map(t => ({t: repl(t)}));
    if (F){
        steps.splice(Math.max(steps.length-1, 1), 0, {t:F.step, add:true});
    }
    if (M) M.steps.forEach(t => steps.push({t, add:true}));
    if (F && F.garnish) steps.push({t:`仕上げに${F.garnish}を添える。`, add:true});
    let name = base.name;
    if (W && ['豚肉','鶏肉','牛肉'].includes(W.to)) name = name.replace(/^(豚|鶏|牛)の/, W.to[0] + 'の');
    if (M) name = name + M.suffix;
    if (F) name = `${F.prefix} ${name}`;
    if (W) name = `${name}（${W.label}）`;
    const changes = [];
    if (F) changes.push(t('味: {v}', {v:flavorLabel(fl)}));
    if (M) changes.push(t('かたち: {v}', {v:formLabel(fo)}));
    if (W) changes.push(t('主役: {v}に', {v:W.to}));
    const genreMap = {kr:'韓', it:'洋', cn:'中', et:'エスニック', wa:'和'};
    const r = {
        id, name, base, isTwist:true, changes,
        genre: (F && genreMap[fl]) || base.genre,
        type: M && ['don','onigiri'].includes(fo) ? 'ごはん' : M && fo === 'pasta' ? '麺' : base.type,
        method: base.method, min: base.min + (M ? 10 : 0),
        items: [...items, ...addItems], seas: base.seas, steps: steps,
        note: W ? W.note : '',
    };
    const p = r.items.find(i => FAMILY[i.key] && i.key !== '卵');
    r.protein = p ? p.key : null; r.family = p ? FAMILY[p.key] : '野菜';
    r.main = ['主菜','ごはん','麺'].includes(r.type);
    return r;
}
// 変化の数: 1=ちょっとだけ 2=しっかり 3=大胆に
function generateTwists(opts={}){
    const {baseId=null, level=2, flavor='any', form='any', swap='any', count=3, fromIds=null} = opts;
    let bases = baseId ? [RECIPES.find(r => r.id === baseId)] :
        (fromIds && fromIds.length ? fromIds.map(id => RECIPES.find(r => r.id === id)) : RECIPES.filter(r => r.type !== '汁物'));
    // 苦手な食材が主役（主役を替えれば使わなくなる）の料理は、主役を替える案だけ出す
    const strict = r => r.items.filter(i => !i.opt && itemAvoided(i));
    bases = bases.filter(r => r && strict(r).every(i => i.key === r.protein));
    const all = [];
    bases.forEach(b => {
        const o = twistOptions(b);
        const fls = flavor === 'none' ? [''] : flavor === 'any' ? ['', ...o.flavors] : (o.flavors.includes(flavor) ? [flavor] : []);
        const fos = form === 'none' ? [''] : form === 'any' ? ['', ...o.forms] : (o.forms.includes(form) ? [form] : []);
        let sws = swap === 'none' ? [''] : swap === 'any' ? ['', ...o.swaps] : o.swaps;
        if (strict(b).length) sws = sws.filter(Boolean);
        fls.forEach(fl => fos.forEach(fo => sws.forEach(sw => {
            const n = [fl,fo,sw].filter(Boolean).length;
            if (!n) return;
            all.push({id: twistId(b.id, fl, fo, sw), n, base:b});
        })));
    });
    const seen = new Set(S.seenTwists);
    const eaten = new Set(S.history.map(h => h.id));
    const scored = all.map(x => {
        let s = Math.random();
        s -= Math.abs(x.n - level) * 0.8;
        if (seen.has(x.id)) s -= 1.2;
        if (eaten.has(x.id)) s -= 1.5;
        if (S.favs.includes(x.base.id)) s += 0.25;
        if (daysSince(x.base.id) < 3) s -= 0.3;
        return {x, s};
    }).sort((a,b) => b.s - a.s);
    // 同じ元料理ばかりにならないように
    const out = [], usedBase = new Set();
    for (const {x} of scored){
        if (out.length >= count) break;
        if (usedBase.has(x.base.id) && !baseId) continue;
        const tw = buildTwist(x.id); if (twistAvoided(tw)) continue;
        usedBase.add(x.base.id); out.push(tw);
    }
    for (const {x} of scored){
        if (out.length >= count) break;
        if (out.some(t => t.id === x.id)) continue;
        const tw = buildTwist(x.id); if (!twistAvoided(tw)) out.push(tw);
    }
    return out;
}
// できあがったひとひねり案に、苦手な食材が残っていないか（足す食材も含めて）
function twistAvoided(tw){ return !tw || tw.items.some(i => !i.opt && itemAvoided(i)); }
function markSeen(list){
    list.forEach(t => { if (t && !S.seenTwists.includes(t.id)) S.seenTwists.push(t.id); });
    if (S.seenTwists.length > 300) S.seenTwists = S.seenTwists.slice(-300);
    save();
}
function suggestTwist(){
    // よく作る定番やお気に入りをベースに、今日のひとひねりを1品
    const counts = {};
    S.history.forEach(h => { if (!String(h.id).startsWith('a~')) counts[h.id] = (counts[h.id]||0) + 1; });
    const favBases = [...new Set([...S.favs.filter(id => !String(id).startsWith('a~')), ...Object.keys(counts)])];
    const res = generateTwists({level:2, count:1, fromIds: favBases.length ? shuffle(favBases).slice(0,8) : null});
    return res[0] || null;
}

// i日あとの主菜にしても、「○日以内に作った料理は出さない」に当たらない料理か
function weekFresh(r, i){ return daysSince(r.id) + i >= (Number(S.settings.avoidDays) || 0); }
const WEEK_BOWL_MAX = 3;
const weekBowl = r => !!r && (r.type === 'ごはん' || r.type === '麺');
function makeWeek(){
    const days = [], used = new Set();
    for (let i = 0; i < 7; i++){
        const d = addDays(TODAY, i);
        const recent = [];
        for (let k = 1; k <= 2 && days.length - k >= 0; k++){ const r = byId(days[days.length-k].id); if (r) recent.push({ago:k, family:r.family, genre:r.genre}); }
        if (i === 0) recent.push(...recentMainFamilies(2).map(x => Object.assign({}, x, {ago:x.ago+1})));
        const all0 = poolFor('主菜').filter(r => r.main && !used.has(r.id) && !isAvoided(r));
        const fresh = all0.filter(r => weekFresh(r, i)); let cands = fresh.length ? fresh : all0;   // 「○日以内に作った料理は出さない」はプランの主菜にも効かせる（足りないときだけ外す）
        // ごはんもの・麺の一品料理は1週間で3日まで（中華圏などで主菜が丼・麺ばかりにならないように。候補が足りないときはそのまま）
        if (days.filter(x => weekBowl(byId(x.id))).length >= WEEK_BOWL_MAX){ const rest = cands.filter(r => !weekBowl(r)); if (rest.length) cands = rest; }
        const wdi = parseYmd(d).getDay();
        let r = pick(cands, {recent, fridge: i < 2 && session.useFridge ? fridgeKeys() : null, weekday: wdi >= 1 && wdi <= 5, relax: !fresh.length});
        if (!r && cands.length) r = pick(cands, {recent: [], relax: !fresh.length});                       // 肉・魚やジャンルの条件を外して選ぶ
        if (!r && cands.length) r = cands[Math.floor(Math.random() * cands.length)];
        if (!r){                                                                       // 主菜の数が7に足りない国: いちばん前に使った料理をもう一度
            const okAll = poolFor('主菜').filter(x => x.main && !isAvoided(x)); let all = okAll.length ? okAll : poolFor('主菜').filter(x => x.main); const order = days.map(x => x.id);
            const fr = all.filter(x => weekFresh(x, i)); if (fr.length) all = fr;
            r = all.slice().sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id))[0] || null;
        }
        if (r){ used.add(r.id); days.push({d, id:r.id}); }
    }
    const skipped = new Set(((S.week && S.week.days) || []).filter(x => x.skip).map(x => x.d));   // 作り直しても、「作らない日」にした日はそのまま（日付で引き継ぐ）
    days.forEach(x => { if (skipped.has(x.d)) x.skip = true; });
    const whoBy = new Map(((S.week && S.week.days) || []).filter(x => x.who).map(x => [x.d, x.who]));   // 日ごとの担当も、作り直しても日付で引き継ぐ
    days.forEach(x => { if (whoBy.has(x.d)) x.who = whoBy.get(x.d); });
    S.week = {start:TODAY, days}; save();
}
// 苦手な食材を足したり料理を「今は出さない」にしたりしたとき、作ってある1週間プランのうち、その料理の日だけ選び直す
function refreshWeek(){
    if (!S.week) return 0;
    const out = r => !r || isAvoided(r) || S.hidden.includes(r.id);
    const used = new Set(S.week.days.map(x => x.id)); let n = 0;
    S.week.days.forEach((x, i) => {
        if (x.d < TODAY || !out(byId(x.id))) return;
        const recent = S.week.days.slice(Math.max(0, i - 2), i).map(y => byId(y.id)).filter(Boolean).reverse().map((r, k) => ({ago:k+1, family:r.family, genre:r.genre}));
        const all0 = poolFor('主菜').filter(r => r.main && !used.has(r.id) && !out(r)), off = Math.max(0, daysBetween(TODAY, x.d));
        const fresh = all0.filter(r => weekFresh(r, off)), cands = fresh.length ? fresh : all0;
        const r = pick(cands, {recent, relax: !fresh.length}) || pick(cands, {recent: [], relax: !fresh.length}) || cands[0];
        if (r){ used.add(r.id); x.id = r.id; delete x.extra; n++; }
    });
    if (n) save();
    return n;
}
// 1週間プランの各日の副菜・汁もの（主菜だけを決めるので、買い物メモに入れるときに主菜に合う副菜と汁ものを1品ずつ選び、S.week.days[i].extra = {side, soup} に残す。作り直さないかぎり同じ）
function weekSidesOn(){ return !!S.settings.weekSides; }
function ensureWeekExtras(){
    if (!S.week) return;
    const ok = id => { const r = byId(id); return !!r && !isAvoided(r) && !S.hidden.includes(id); };
    const taken = new Set(); let ch = false;
    S.week.days.forEach(x => { const e = x.extra; if (e) [e.side, e.soup].forEach(id => { if (id && ok(id)) taken.add(id); }); });
    visiblePlanDays().forEach(x => {
        const main = byId(x.id); if (!main) return;
        const e = x.extra && typeof x.extra === 'object' ? x.extra : (x.extra = {});
        [['side', '副菜'], ['soup', '汁物']].forEach(([k, slot]) => {
            if (e[k] && ok(e[k])) return;
            const r = suggestFor(slot, [{r:main}, ...[...taken].map(id => ({r:byId(id)})).filter(y => y.r)], main) || suggestFor(slot, [{r:main}], main);
            if (r && ok(r.id)){ e[k] = r.id; taken.add(r.id); } else delete e[k];
            ch = true;
        });
    });
    if (ch) save();
}
// その日に買い物メモへ入れる料理（主菜＋スイッチが入っているときは副菜・汁もの）
function dayDishes(x){

function weekToday(){

function record(id, slot, d=TODAY){
    const r = byId(id); if (!r) return;

/* ---- 「おいしかった！」と今月の料理自慢（サーバーなし・端末の中だけ）----
   作った記録（S.history の1件）に h.y = おいしかったと押した人数を付ける（家族ひとりにつき1回押す）。
   その月の人数の合計がいちばん多い料理が「今月のわが家の料理自慢」（同じなら新しく作ったほう）。終わった月は S.awards['2026-10'] に残す。
   以前の h.r（'again'・'good'）は1人ぶんとして数える */
const YUM_MAX = 20;
function yumOf(h){ return h ? (h.y > 0 ? h.y : (h.r === 'again' || h.r === 'good') ? 1 : 0) : 0; }
function histEntry(id, d){ return S.history.find(h => h.id === id && h.d === d); }
let reactVer = 0, reactCache = null;
function addYum(id, d, n){
    const h = histEntry(id, d); if (!h) return 0;
    const y = Math.max(0, Math.min(YUM_MAX, yumOf(h) + n));
    delete h.r; if (y) h.y = y; else delete h.y;
    reactVer++; settleAwards(); save(); return y;
}
// おいしかったが多い料理は献立に少し出やすく（下げることはしない）
function reactBias(id){
    if (!reactCache || reactCache.h !== S.history || reactCache.n !== S.history.length || reactCache.v !== reactVer){
        const m = {}; S.history.forEach(h => { const y = yumOf(h); if (y) m[h.id] = (m[h.id] || 0) + y; });
        reactCache = {h: S.history, n: S.history.length, v: reactVer, m};
    }
    return Math.min(0.3, (reactCache.m[id] || 0) * 0.1);
}
function monthAward(ym){
    const m = {};
    S.history.forEach(h => { const y = yumOf(h); if (!y || !String(h.d).startsWith(ym)) return;
        const x = m[h.id] = m[h.id] || {id:h.id, name:h.name, pts:0, last:''};
        x.pts += y; if (h.d > x.last) x.last = h.d; });
    return Object.values(m).sort((a,b) => b.pts - a.pts || (a.last < b.last ? 1 : a.last > b.last ? -1 : 0))[0] || null;
}
function awardName(a){ const r = byId(a.id); return r ? r.name : a.name; }
// 終わった月の料理自慢を S.awards に残す（記録が残っている月は記録から数え直す。消した月はそのまま残す）
function settleAwards(){
    const cur = TODAY.slice(0,7); let ch = false;
    if (!S.awards || typeof S.awards !== 'object') S.awards = {};
    // 「おいしかった！」がある月と、もう表彰がある月（取り消して0人になった月は表彰を消す）
    new Set([...S.history.filter(h => yumOf(h)).map(h => String(h.d).slice(0,7)), ...Object.keys(S.awards)].filter(ym => ym < cur)).forEach(ym => {
        const w = monthAward(ym), o = S.awards[ym];

        if (!o || o.id !== w.id || o.pts !== w.pts){ S.awards[ym] = {id:w.id, name:awardName(w), pts:w.pts}; ch = true; }

let tab = 'today';

// 描き直し（料理の入れ替え・絵の読みこみ）で画面が動かないようにする。
// 1) 見えているボタンのうち一番上のものを目印にして、描き直しのあとにその位置が変わっていたら、変わった分だけスクロールを戻す
// 2) 横にスクロールする列（気分・品数のチップなど）の横位置を戻す
let lastRenderTab = null;
function anchorKeyOf(el){ const d = el.dataset; return (d.act || '') + '|' + (d.id || d.k || d.i || d.d || d.v || d.cc || ''); }
function holdView(v){
    const keep = {sy: window.scrollY, anchor: null, rows: [...v.querySelectorAll('.scroll')].map(e => e.scrollLeft)};
    if (keep.sy > 40){
        const seen = {}, H = window.innerHeight;
        for (const e of v.querySelectorAll('[data-act]')){
            const k = anchorKeyOf(e); const n = seen[k] = (seen[k] || 0) + 1;
            const r = e.getBoundingClientRect();
            if (r.height && r.top >= 0 && r.top < H && getComputedStyle(e).position !== 'fixed'){ keep.anchor = {k, n, top: r.top}; break; }
        }
    }
    return keep;
}
function releaseView(v, keep){
    const rows = v.querySelectorAll('.scroll');
    if (rows.length === keep.rows.length) rows.forEach((e, i) => { if (keep.rows[i]) e.scrollLeft = keep.rows[i]; });
    if (keep.anchor){
        const seen = {};
        for (const e of v.querySelectorAll('[data-act]')){
            const k = anchorKeyOf(e); const n = seen[k] = (seen[k] || 0) + 1;
            if (k === keep.anchor.k && n === keep.anchor.n){ const d = e.getBoundingClientRect().top - keep.anchor.top; if (Math.abs(d) > 0.5) window.scrollBy(0, d); return; }
        }
    }
}
// 浮き上がる動き（.pop）は、新しく出たときの1回だけにする。描き直し（絵が届いた・値が変わった）のたびに弾むと、画面が動いて見える

const PHOTO_KEY = 'gohancho.photos.v2';
let PHOTOS = {}, photoStatus = 'idle';
try{
    const c = JSON.parse(localStorage.getItem(PHOTO_KEY) || 'null');
    if (c && c.v === 2 && Date.now() - c.t < 30*864e5){ PHOTOS = c.data || {}; photoStatus = 'done'; }
}catch(e){}
function stripHtml(h){ try{ return (new DOMParser().parseFromString(String(h||''), 'text/html').body.textContent || '').trim().replace(/\s+/g,' '); }catch(e){ return ''; } }
async function loadPhotos(){
    if (photoStatus === 'done' || photoStatus === 'loading') return;
    photoStatus = 'loading';
    // 同梱の絵がある料理は、Wikipedia に問い合わせない
    const need = Object.entries(WIKI).filter(([id]) => !GEN[id]);
    if (!need.length){ photoStatus = 'done'; return; }
    try{
        const titles = [...new Set(need.map(([, ts]) => ts).flat())], fileOf = {};
        for (let k = 0; k < titles.length; k += 40){
            const chunk = titles.slice(k, k+40);
            const url = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&redirects=1&prop=pageimages&piprop=name&titles=' + encodeURIComponent(chunk.join('|'));
            const j = await (await fetch(url)).json();
            const map = {}; [...(j.query.normalized||[]), ...(j.query.redirects||[])].forEach(n => map[n.from] = n.to);
            const byTitle = {}; (j.query.pages||[]).forEach(pg => { if (pg.pageimage) byTitle[pg.title] = pg.pageimage; });
            chunk.forEach(t => { let x = t; for (let n = 0; n < 3 && map[x]; n++) x = map[x]; if (byTitle[x]) fileOf[t] = byTitle[x]; });
        }
        const files = [...new Set(Object.values(fileOf))].filter(f => /\.(jpe?g|png|webp)$/i.test(f));
        const info = {};
        for (let k = 0; k < files.length; k += 40){
            const chunk = files.slice(k, k+40);
            const url = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&origin=*&prop=imageinfo&iiprop=url|extmetadata&iiurlwidth=720&iiextmetadatafilter=Artist|LicenseShortName&titles=' + encodeURIComponent(chunk.map(f => 'File:' + f).join('|'));
            const j = await (await fetch(url)).json();
            const back = {}; (j.query.normalized||[]).forEach(n => back[n.to] = n.from);
            (j.query.pages||[]).forEach(pg => {
                const ii = pg.imageinfo && pg.imageinfo[0]; if (!ii || pg.missing) return;
                const em = ii.extmetadata || {};
                const rec = {src: ii.thumburl || ii.url, page: ii.descriptionurl,
                    artist: stripHtml(em.Artist && em.Artist.value).slice(0, 80), license: stripHtml(em.LicenseShortName && em.LicenseShortName.value)};
                [pg.title, back[pg.title] || pg.title].forEach(t => { const f = t.replace(/^File:/,''); info[f] = rec; info[f.replace(/_/g,' ')] = rec; });
            });
        }
        const out = {};
        need.forEach(([id, ts]) => { for (const t of ts){ const f = fileOf[t]; const rec = f && (info[f] || info[f.replace(/_/g,' ')]); if (rec && rec.src && /^https:\/\//.test(rec.src)){ out[id] = rec; break; } } });
        PHOTOS = out; photoStatus = 'done';
        try{ localStorage.setItem(PHOTO_KEY, JSON.stringify({v:2, t:Date.now(), data:out})); }catch(e){}
    }catch(e){ photoStatus = 'blocked'; }
    const a = document.activeElement;
    if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
    if (modalId) renderModal();
}
/* ---- わが家の写真（作った料理を撮って登録。このブラウザの IndexedDB に保存） ---- */
let MINE = {};
function openDb(){
    return openDb.p || (openDb.p = new Promise((res, rej) => {
        const q = indexedDB.open('gohancho', 3);
        q.onupgradeneeded = () => { const db = q.result; ['photos', 'sketches'].forEach(n => { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); });
            if (!db.objectStoreNames.contains('album')) db.createObjectStore('album', {autoIncrement: true}); };
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
    }));
}
async function idbDo(mode, fn, store='photos'){
    const db = await openDb();
    return new Promise((res, rej) => { const tx = db.transaction(store, mode); const out = fn(tx.objectStore(store)); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); });
}
async function loadMine(){
    try{
        const db = await openDb();
        await new Promise((res, rej) => {
            const tx = db.transaction('photos', 'readonly'); const cur = tx.objectStore('photos').openCursor();
            cur.onsuccess = () => { const c = cur.result; if (!c) return; MINE[c.key] = {src: URL.createObjectURL(c.value.blob), d: c.value.d, mine: true}; c.continue(); };
            tx.oncomplete = res; tx.onerror = () => rej(tx.error);
        });
        if (Object.keys(MINE).length){ render(); if (modalId) renderModal(); if (JP_DATA) loadRefs(); }
        // 以前に登録した写真（アルバムができる前の分）をアルバムにも入れる
        if (!S.albumMigrated){
            const n = await idbDo('readonly', st => st.count(), 'album');
            if (!n){ for (const id of Object.keys(MINE)){ const v = await idbDo('readonly', st => st.get(id)); const r = byId(id); if (v) await idbDo('readwrite', st => st.add({id, name: r ? r.name : id, blob: v.blob, d: v.d}), 'album'); } }
            S.albumMigrated = true; save();
        }
    }catch(e){}
}
// わが家のアルバム（撮った写真を新しい順に。料理の写真を撮り直しても前の写真は残る）
let ALBUM = null;   // [{key, id, name, d, src}]
async function loadAlbum(){
    try{
        const db = await openDb(); const out = [];
        await new Promise((res, rej) => { const tx = db.transaction('album', 'readonly'); const cur = tx.objectStore('album').openCursor(null, 'prev');
            cur.onsuccess = () => { const c = cur.result; if (!c) return; out.push({key: c.key, id: c.value.id, name: c.value.name, d: c.value.d, blob: c.value.blob}); c.continue(); };
            tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        if (ALBUM) ALBUM.forEach(a => URL.revokeObjectURL(a.src));
        ALBUM = out.map(a => Object.assign(a, {src: URL.createObjectURL(a.blob)}));
        if (JP_DATA) loadRefs();
    }catch(e){ ALBUM = []; }
    if (tab === 'log') render();
}
const PHOTO_MAX = 40e6;   // これより大きい写真は読み込まない（縮小の途中で端末のメモリが足りなくなるため）
async function shrinkImage(file){
    if (file.size > PHOTO_MAX) throw new Error('big');
    const url = URL.createObjectURL(file);
    try{
        let img;
        try{ img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
        catch(e){ img = window.createImageBitmap ? await createImageBitmap(file) : Promise.reject(e); }   // <img> で開けない形式は、ブラウザの画像デコーダで試す
        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        const k = Math.min(1, 1000 / Math.max(w, h));
        const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        if (img.close) img.close();
        return await new Promise(res => c.toBlob(res, 'image/jpeg', .82));
    } finally { URL.revokeObjectURL(url); }
}
async function saveMine(id, file){
    try{
        const blob = await shrinkImage(file); if (!blob) throw 0;
        await idbDo('readwrite', st => st.put({blob, d: TODAY}, id));
        { const r = byId(id); await idbDo('readwrite', st => st.add({id, name: r ? r.name : id, blob, d: TODAY}), 'album').catch(() => {}); ALBUM = null; }
        if (MINE[id]) URL.revokeObjectURL(MINE[id].src);
        MINE[id] = {src: URL.createObjectURL(blob), d: TODAY, mine: true};
        toast(t('わが家の一枚を登録しました。献立と「記録」のアルバムにも出ます'), true);
    }catch(e){
        toast(e && e.message === 'big' ? t('写真が大きすぎます（40MBまで）。別の写真で試してください')
            : /hei[cf]/i.test((file.type || '') + (file.name || '')) ? t('このブラウザでは HEIC の写真を開けません。iPhone は「設定 > カメラ > フォーマット > 互換性優先」にするか、JPEG や PNG の写真で試してください')
            : t('写真を保存できませんでした。別の写真で試してください'));
    }
    render(); if (modalId) renderModal();
}

function photoOf(r){
    if (!r) return null;
    if (MINE[r.id]) return MINE[r.id];               // 自分で撮った写真はそのまま
    const id = r.isTwist ? r.base.id : r.id;
    return GEN[id] || sketchOf(PHOTOS[id]);          // 次に同梱の絵（手描き・ChatGPT）、その次に写真をイラスト化したもの
}

/* ---- アプリに同梱した料理の絵 ----
   img/dish/manifest.json に並んだ絵を使う。via が 'svg' は tools/illustrations/draw で描いたイラスト、
   'api' / 'chatgpt' は ChatGPT（OpenAI の画像生成）で前もって作った画像。アプリから外部へは通信しない。 */
const GEN = {};
const GEN_BUNDLES = {};   // 国ごとにまとめた絵（試せるページ用。ファイルの数に上限があるため）。国 → ファイル名、読みこみ済みは true
function addGenerated(items){
    Object.keys(items).forEach(id => {
        const it = items[id]; if (!it || !it.file || !/^[\w.-]+$/.test(it.file)) return;
        const v = '?v=' + encodeURIComponent(it.v || it.date || '');   // v は絵の中身から作った印（描き直すと変わる）
        GEN[id] = {src: it.data && /^data:image\//.test(it.data) ? it.data : 'img/dish/' + it.file + v, gen: true, ai: it.via === 'api' || it.via === 'chatgpt',
            // 一覧用の小さい絵（192px）。一覧に何百品も並んでも、SVG の影を毎回計算しないので速い
            thumb: it.thumbData && /^data:image\//.test(it.thumbData) ? it.thumbData : it.thumb && /^t\/[\w.-]+$/.test(it.thumb) ? 'img/dish/' + it.thumb + v : null};
    });
}
async function loadGenerated(){
    try{
        const res = await fetch('img/dish/manifest.json?v=' + encodeURIComponent(APP_VERSION + '.' + (window.ASSET_V || '')));
        if (!res.ok) return;
        const m = await res.json();
        addGenerated((m && m.items) || {});
        Object.assign(GEN_BUNDLES, (m && m.bundles) || {});
        loadGenBundle(currentCountry());
        if (Object.keys(GEN).length) scheduleRender();
    }catch(e){}
}
// 国の絵のまとまりを、その国を使うときにだけ読みこむ（manifest に bundles があるときだけ）
async function loadGenBundle(cc){
    const f = GEN_BUNDLES[cc];
    if (!f || f === true || !/^[\w.-]+\.json$/.test(f)) return;
    GEN_BUNDLES[cc] = true;
    try{
        const res = await fetch('img/dish/' + f);
        if (!res.ok) throw new Error(res.status);
        const m = await res.json(); addGenerated((m && m.items) || {}); scheduleRender();
    }catch(e){ GEN_BUNDLES[cc] = f; }
}

/* ---- 参考写真をもとに、ポップなイラストに描き直す ----
   Wikipedia の写真は、端末の中で一度だけ「細部をなめらかに → 明るさを数段階のぬり分けにして鮮やかに → くっきりした輪郭に太い線」でイラスト化して保存し、以後はそれを表示する。
   変換が終わるまで・変換できない写真は、アプリが描くイラストを表示する（元の写真そのものは出さない）。 */
const SKETCH = {};          // 元の写真URL → イラスト化した画像のURL（null は変換できなかった）
const sketchQueue = [];
let sketchBusy = false;
function sketchOf(ph){
    if (!ph) return null;
    const u = SKETCH[ph.src];
    if (u) return Object.assign({}, ph, {src: u, sketch: true});
    if (u === undefined) requestSketch(ph.src);
    return null;
}
function requestSketch(src){
    if (SKETCH[src] !== undefined || sketchQueue.includes(src)) return;
    sketchQueue.push(src); pumpSketches();
}
async function pumpSketches(){
    if (sketchBusy) return; sketchBusy = true;
    while (sketchQueue.length){
        const src = sketchQueue.shift();
        try{
            const key = 'pop3:' + src;
            let blob = await idbDo('readonly', st => st.get(key), 'sketches').catch(() => null);
            if (!blob){ blob = await popIllustrate(src); idbDo('readwrite', st => st.put(blob, key), 'sketches').catch(() => {}); }
            SKETCH[src] = URL.createObjectURL(blob);
        }catch(e){ SKETCH[src] = null; }
        scheduleRender();
    }
    sketchBusy = false;
}
let renderTimer = null;
function scheduleRender(){
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
        const a = document.activeElement;
        if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) render();
        if (modalId) renderModal();
    }, 250);
}
function popIllustrate(src){
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onerror = () => reject(new Error('load'));
        img.onload = () => {
            try{
                const k = Math.min(1, 520 / Math.max(img.naturalWidth, img.naturalHeight));
                const W = Math.max(1, Math.round(img.naturalWidth * k)), H = Math.max(1, Math.round(img.naturalHeight * k)), n = W * H;
                const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
                const ctx = cv.getContext('2d', {willReadFrequently: true});
                ctx.drawImage(img, 0, 0, W, H);
                const im = ctx.getImageData(0, 0, W, H), d = im.data;     // 許可のない画像はここで例外 → イラスト表示
                // 1) 細部をなめらかに（輪郭は残すぼかし）
                let px = new Float32Array(n * 3);
                for (let i = 0; i < n; i++){ px[i*3] = d[i*4]; px[i*3+1] = d[i*4+1]; px[i*3+2] = d[i*4+2]; }
                for (let it = 0; it < 3; it++) px = smoothKeepEdges(px, W, H, 3, 26);
                // 2) 色（色み）はそのままに、明るさだけを数段階にそろえて「ぬり分け」にする → 赤いトマトは赤、緑の野菜は緑のまま
                const LEVELS = 5, lumS = new Float32Array(n);
                for (let i = 0; i < n; i++){
                    const r = px[i*3], g = px[i*3+1], b = px[i*3+2];
                    const L = .3 * r + .59 * g + .11 * b; lumS[i] = L;
                    const band = Math.min(LEVELS - 1, Math.floor(L / 256 * LEVELS));
                    const Lq = (band + .62) * 256 / LEVELS;                 // 段階の中ほどへ（少し明るめ）
                    const f = Lq / Math.max(8, L);
                    let R = r * f, G = g * f, B = b * f;
                    const l2 = .3 * R + .59 * G + .11 * B;                   // 鮮やかに
                    R = l2 + (R - l2) * 1.55; G = l2 + (G - l2) * 1.55; B = l2 + (B - l2) * 1.55;
                    d[i*4] = Math.max(0, Math.min(255, R + 6)); d[i*4+1] = Math.max(0, Math.min(255, G + 4)); d[i*4+2] = Math.max(0, Math.min(255, B));
                    d[i*4+3] = 255;
                }
                // 3) くっきりした輪郭だけに太い線（明るさの変化が大きい所）
                const thr = 22, edge = new Uint8Array(n);
                for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
                    const i = y * W + x;
                    const gx = -lumS[i-W-1] - 2*lumS[i-1] - lumS[i+W-1] + lumS[i-W+1] + 2*lumS[i+1] + lumS[i+W+1];
                    const gy = -lumS[i-W-1] - 2*lumS[i-W] - lumS[i-W+1] + lumS[i+W-1] + 2*lumS[i+W] + lumS[i+W+1];
                    if (Math.hypot(gx, gy) / 4 > thr) edge[i] = 1;
                }
                const thick = Math.max(1, Math.round(W / 300));
                for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
                    if (!edge[y*W+x]) continue;
                    for (let dy = -thick; dy <= thick; dy++) for (let dx = -thick; dx <= thick; dx++){
                        const yy = y + dy, xx = x + dx; if (yy < 0 || yy >= H || xx < 0 || xx >= W) continue;
                        const q = (yy * W + xx) * 4; d[q] = 74; d[q+1] = 46; d[q+2] = 31;
                    }
                }
                ctx.putImageData(im, 0, 0);
                cv.toBlob(bl => bl ? resolve(bl) : reject(new Error('blob')), 'image/png');
            }catch(e){ reject(e); }
        };
        img.src = src;
    });
}
// 似た色どうしだけを混ぜるぼかし（バイラテラルフィルターの簡易版）。輪郭は残り、面はなめらかになる
function smoothKeepEdges(px, W, H, r, sigma){
    const out = new Float32Array(px.length), s2 = 2 * sigma * sigma;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++){
        const i = (y * W + x) * 3, R = px[i], G = px[i+1], B = px[i+2];
        let sr = 0, sg = 0, sb = 0, sw = 0;
        for (let dy = -r; dy <= r; dy += 1) for (let dx = -r; dx <= r; dx += 1){
            const yy = Math.min(H - 1, Math.max(0, y + dy)), xx = Math.min(W - 1, Math.max(0, x + dx)), j = (yy * W + xx) * 3;
            const dr = px[j] - R, dg = px[j+1] - G, db = px[j+2] - B;
            const w = Math.exp(-(dr*dr + dg*dg + db*db) / s2);
            sr += px[j] * w; sg += px[j+1] * w; sb += px[j+2] * w; sw += w;
        }
        out[i] = sr / sw; out[i+1] = sg / sw; out[i+2] = sb / sw;
    }
    return out;
}
function videoSearchUrl(r){ return 'https://www.youtube.com/results?search_query=' + encodeURIComponent((r.isTwist ? r.base.name : r.name).replace(/（.*?）/g,'') + (r.pack ? ' recipe' : ' 作り方')); }
function cssUrl(u){ return `url('${String(u).replace(/['"()\\\s]/g, c => encodeURIComponent(c))}')`; }
function imageSearchUrl(r){ return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(r.name.replace(/（.*?）/g,'') + (r.pack ? '' : ' 料理')); }
function photoNote(){
    let ai = false, anyGen = false;   // 数千件の GEN を配列にコピーしない
    for (const k in GEN){ anyGen = true; if (GEN[k].ai){ ai = true; break; } }
    const wiki = Object.keys(PHOTOS).some(k => !GEN[k]);
    if (ai || wiki) return [ai ? t('料理の絵の一部は ChatGPT（OpenAI の画像生成）で作成したイメージです。') : '', wiki ? t('一部は Wikipedia / Wikimedia Commons の写真をもとにイラスト化し、撮影者とライセンスを各料理の詳細に表示しています。') : ''].join('');

}

/* ---- 器のイラスト ---- */
function foodColor(r){
    if (!r) return '#a8652b';
    if (r.type === '汁物') return {'洋':'#b5503a','中':'#d9b95c','韓':'#b8452f','エスニック':'#c2703a'}[r.genre] || '#b48a55';
    return {'煮':'#8a5a2b','炒':'#6f8f3a','焼':'#a8652b','揚':'#c98f2e','和え':'#5f9b5a','炊':'#c9a877'}[r.method] || '#a8652b';
}
function vesselKind(r){
    if (!r) return 'plate';
    if (r.type === 'ごはん' || r.type === '麺') return 'donburi';
    if (r.type === '汁物') return 'wan';
    if (r.type === '副菜') return 'kobachi';
    return 'plate';
}
// 絵を読みこめなかったとき（電波がなく、まだ保存していない絵など）は、器ごと消えないよう線のイラストに切りかえる
const IMG_FAIL = new Set(), IMG_PROBED = new Set();
function probeImg(src){
    if (!src || IMG_PROBED.has(src)) return; IMG_PROBED.add(src);
    const im = new Image(); im.onerror = () => { IMG_FAIL.add(src); scheduleRender(); }; im.src = src;
}
function vesselHtml(kind, r, still=false, anim=true){
    const extra = kind === 'chawan' ? 'rice' : kind === 'konomono' ? 'konomono' : null;
    let ph = r ? photoOf(r) : extra ? (GEN[extra] || sketchOf(PHOTOS[extra])) : null;
    if (ph){ probeImg(ph.src); if (IMG_FAIL.has(ph.src)) ph = null; }
    const style = `--food:${foodColor(r)}` + (ph ? `;--img:${cssUrl(ph.src)}` : '');
    const food = ph ? '<span class="food photo"></span>' : extra || (r && r.staple) ? '<span class="food"></span>' : `<span class="food svg">${dishSvg(r)}</span>`;
    const cls = `vessel v-${kind}${kind === 'donburi' && r && r.type === '麺' ? ' noodle' : ''}${ph && ph.gen ? ' gen' : ''}${anim ? ' rise-in' : ''}`;
    if (!r || still) return `<div class="${cls}" style="${esc(style)}" aria-hidden="true">${food}</div>`;
    return `<button class="${cls}" style="${esc(style)}" data-act="open" data-id="${esc(r.id)}" aria-label="${esc(t('{name}の作り方を見る', {name:r.name}))}">${food}</button>`;
}
function thumbHtml(r){
    let ph = photoOf(r);
    if (ph){ const src = ph.thumb || ph.src; probeImg(src); if (IMG_FAIL.has(src)) ph = null; }
    // <img> にして、絵の展開を裏で行う（decoding="async"）。loading="lazy" は iPhone のアプリ内の表示で読みこまれないことがあるので使わない
    return ph ? `<span class="thumb pic${ph.gen ? ' gen' : ''}" role="img" aria-label="${esc(t('{name}の写真', {name:r.name}))}"><img src="${esc(ph.thumb || ph.src)}" alt="" decoding="async"></span>`
              : `<span class="thumb svg" aria-hidden="true">${dishSvg(r)}</span>`;
}

/* ---- 料理のイラスト（SVG・真上から見た盛りつけ） ----
   材料の名前から具材の絵を選び、料理IDを種にして毎回同じ配置に並べる。

function seeded(str){
    let h = 2166136261;
    for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}

function dishSvg(r, opts={}){
    if (!r) return '';
    const rng = seeded(String(r.id));
    const R = 34, cx = 50, cy = 50;
    const layers = [];
    const place = (item) => {
        const [g, c, c2, s, n, rot0, ox, oy] = item;
        let out = '';
        for (let k = 0; k < n; k++){
            let x, y, tries = 0;
            do { const a = rng()*Math.PI*2, d = Math.sqrt(rng()) * (R - s*.55); x = cx + ox + Math.cos(a)*d; y = cy + oy + Math.sin(a)*d; tries++; }
            while (tries < 6 && Math.hypot(x-cx, y-cy) > R - s*.4);
            const rot = rot0 + (n > 1 ? (rng()-.5)*140 : 0);
            out += G[g](x, y, s, rot, c, c2 || c);
        }
        return out;
    };
    let base, items;
    const art = r.isTwist ? null : DISH_ART[r.id];
    if (art){ base = art.base; items = art.items.map(i => ({z: i[0]==='dot' && i[3] > 20 ? 0 : 2, item:i})); }
    else {
        base = baseColor(r);
        items = [];
        const seen = new Set();
        r.items.forEach(i => {
            const a = ING_ART[i.key] || ING_ART[i.label]; if (!a || seen.has(i.key)) return; seen.add(i.key);
            const n = i.opt ? Math.max(1, Math.round(a.n*.6)) : a.n;
            items.push({z:a.z, item:[a.g, a.c, a.c2, a.s, n, 0, 0, 0]});
        });
        if (!items.length) items.push({z:2, item:['chunk', '#b57a52', '#e9c4a4', 12, 4, 0, 0, 0]});
    }
    // かたちのアレンジ: ご飯・麺・パン・卵・チーズなどを足す
    let under = '', over = '';
    const fo = r.isTwist ? String(r.id).split('~')[3] : '';
    const fl = r.isTwist ? String(r.id).split('~')[2] : '';
    const riceUnder = `<circle cx="50" cy="50" r="${R}" fill="#f7f3e8"/>${Array.from({length:26},()=>{const a=rng()*6.28,d=Math.sqrt(rng())*30;return `<ellipse cx="${(50+Math.cos(a)*d).toFixed(1)}" cy="${(50+Math.sin(a)*d).toFixed(1)}" rx="2.2" ry="1.3" transform="rotate(${(rng()*180).toFixed(0)} ${(50+Math.cos(a)*d).toFixed(1)} ${(50+Math.sin(a)*d).toFixed(1)})" fill="#ffffff" stroke="#e3dccb" stroke-width=".4"/>`;}).join('')}`;
    const isRiceDish = !art && (r.type === 'ごはん');
    const isNoodle = !art && (r.type === '麺');
    if (fo === 'don' || isRiceDish || (art && art.rice)){ under = riceUnder; }
    if (art && art.roux){ under += `<path d="M46,14 C70,10 90,30 86,56 C82,78 62,88 44,84 C60,70 62,30 46,14 Z" fill="#8a5a2b"/>`; }
    if (fo === 'pasta' || isNoodle){ under = `<circle cx="50" cy="50" r="${R}" fill="#f1e6c2"/>` + Array.from({length:12},()=>G.strand(50+(rng()-.5)*40, 50+(rng()-.5)*40, 22, rng()*180, '#f1de9a')).join(''); }
    if (fo === 'sand'){ under = `<rect x="14" y="14" width="72" height="72" rx="6" fill="#e8c98f"/><rect x="18" y="18" width="64" height="64" rx="4" fill="#f5e6c8"/>`; }
    if (fo === 'omelet'){ over = `<path d="M22,58 Q20,30 50,28 Q80,30 78,58 Q50,70 22,58 Z" fill="#f7cf3f" opacity=".92"/><path d="M30,56 Q50,64 70,56" stroke="#e9b62a" stroke-width="1.4" fill="none"/>`; }
    if (fo === 'gratin' || fo === 'cheese' || fl === 'it'){ over += Array.from({length: fo ? 7 : 4},()=>G.dot(50+(rng()-.5)*44, 50+(rng()-.5)*44, 7+rng()*5, 0, '#f6d76a')).join('') + (fo ? Array.from({length:5},()=>G.dot(50+(rng()-.5)*40, 50+(rng()-.5)*40, 4, 0, '#b96b2a')).join('') : ''); }
    if (fo === 'harumaki'){ over = Array.from({length:3},(_,k)=>G.roll(50, 36+k*14, 40, -12, '#e0a85a', '#f3d4a0')).join(''); }
    if (fo === 'onigiri'){ under = `<circle cx="50" cy="50" r="${R}" fill="#f0e8d4"/>`; over = G.tri(38,52,26,0,'#f7f3e8','#2a2f2a') + G.tri(64,48,26,0,'#f7f3e8','#2a2f2a'); }
    if (fo === 'nabe'){ under = `<circle cx="50" cy="50" r="${R}" fill="#d9c9a6"/>` + G.leaf(30,40,14,20,'#dbe6b7','#f5f8e6') + G.leaf(66,62,14,-30,'#dbe6b7','#f5f8e6') + G.cube(60,36,10,10,'#faf7ef','#fff') + G.cube(36,64,10,-8,'#faf7ef','#fff'); }
    const tint = {kr:'rgba(200,50,30,.28)', curry:'rgba(230,170,30,.35)', cn:'rgba(120,60,20,.18)', et:'rgba(240,120,40,.2)', misobutter:'rgba(150,100,40,.25)', wa:'rgba(90,60,30,.12)', garlic:'rgba(250,220,120,.25)', ume:'rgba(200,40,60,.15)'}[fl] || '';
    const garnish = {kr:Array.from({length:12},()=>G.dot(50+(rng()-.5)*50, 50+(rng()-.5)*50, 1.6, 0, '#f6efd8')).join('') + G.strand(60,40,10,20,'#c8323c'),
        et:G.leaf(62,36,8,20,'#3f8a45','#a8d69d')+G.leaf(36,62,8,-40,'#3f8a45','#a8d69d')+G.wedge(70,66,8,0,'#f6e05a','#fbf2a8'),
        wa:G.dot(62,38,10,0,'#f7f3ea')+G.leaf(36,60,8,-30,'#3f8a45','#a8d69d'),
        ume:G.round(60,38,6,0,'#c8323c','#e8848c')+G.leaf(38,60,9,-30,'#3f8a45','#a8d69d'),
        garlic:G.crescent(62,38,6,20,'#f6f0dc','#d9cfa8')+G.crescent(38,62,6,-50,'#f6f0dc','#d9cfa8')+G.dot(50,50,2,0,'#2a2a2a'),
        misobutter:G.cube(58,42,7,10,'#f8e58a','#fdf6c6'),
        cn:Array.from({length:5},()=>G.ring(50+(rng()-.5)*44, 50+(rng()-.5)*44, 3.4, 0, '#5e9a4f','#eef7e6')).join(''),
        it:G.leaf(62,36,8,20,'#2f7a3a','#7fbb75')+Array.from({length:10},()=>G.dot(50+(rng()-.5)*50, 50+(rng()-.5)*50, 1.8, 0, '#f8efc8')).join(''),
        curry:''}[fl] || '';
    items.sort((a,b) => a.z - b.z);
    const body = items.map(x => place(x.item)).join('');
    const plated = !art && !under && r.type === '主菜' && (r.method === '焼' || r.method === '揚');   // 焼き物・揚げ物は白い皿にキャベツを添えて盛る
    const baseOp = art ? .95 : plated ? 0 : ({'煮':.95,'炒':.8,'和え':.6,'炊':.9,'汁':1}[r.method] || .7);
    const baseShape = under || (opts.plain ? '' : `<path opacity="${baseOp}" d="M50,${cy-R} C${cx+R*.9},${cy-R*.9} ${cx+R*1.05},${cy+R*.5} ${cx+R*.55},${cy+R*.85} C${cx-R*.2},${cy+R*1.1} ${cx-R*1.05},${cy+R*.4} ${cx-R*.95},${cy-R*.3} C${cx-R*.85},${cy-R*.95} ${cx-R*.2},${cy-R*1.05} 50,${cy-R} Z" fill="${base}"/>`);
    const tintShape = tint ? `<circle cx="50" cy="50" r="${R}" fill="${tint}"/>` : '';
    // 仕上げ: 太い輪郭（ぬりの下に引くので、重なった具材の線は隠れる）＋鮮やかなぬり＋つや＋影で、ポップなイラストに
    const side = plated ? sideGarnish(rng) : '';
    const shapes = (under || baseShape) + side + body + over + garnish;
    // 輪郭は「ぬりのある形」だけ（線だけの飾りや細部はなぞらない）
    const asLines = t => t.replace(/<(path|line)\b[^>]*fill="none"[^>]*\/>/g, '').replace(/<line\b[^>]*\/>/g, '')
        .replace(/fill="(?!none)[^"]*"/g, 'fill="none"').replace(/stroke="[^"]*"/g, '').replace(/stroke-width="[^"]*"/g, '').replace(/opacity="[^"]*"/g, '');
    const shine = `<ellipse cx="38" cy="32" rx="9" ry="4.5" fill="#fff" opacity=".35" transform="rotate(-30 38 32)"/><circle cx="31" cy="38" r="1.6" fill="#fff" opacity=".5"/>`;
    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="dish" aria-hidden="true">
        <g filter="url(#pop-shadow)">
            <g fill="none" stroke="#4a2e1f" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">${asLines(shapes)}</g>
            <g filter="url(#pop-fill)">${shapes}${tintShape}</g>
        </g>
        ${under ? '' : shine}
    </svg>`;
}
function sideGarnish(rng){
    let out = '';
    for (let k = 0; k < 22; k++){ const x = 66 + (rng()-.5)*20, y = 64 + (rng()-.5)*16; out += `<path d="M${x.toFixed(1)},${y.toFixed(1)} q${(4+rng()*4).toFixed(1)},${(-2+rng()*4).toFixed(1)} ${(9+rng()*5).toFixed(1)},${(-1+rng()*2).toFixed(1)}" stroke="${rng() < .5 ? '#d9eab0' : '#bcd98a'}" stroke-width="1.3" fill="none" stroke-linecap="round" transform="rotate(${(-30+rng()*60).toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`; }
    return `<g>${out}</g><circle cx="76" cy="48" r="4.6" fill="#e2412f"/><circle cx="74.8" cy="46.6" r="1.3" fill="#fff" opacity=".6"/><path d="M76,43.6 l1.2,-1.4 M76,43.6 l-1.4,-.9" stroke="#3f7a35" stroke-width=".9" stroke-linecap="round"/>`;
}

const STAPLE_QUICK = ['卵','玉ねぎ','にんじん','じゃがいも','長ねぎ','豆腐','キャベツ','ベーコン','ハム','ウインナー','しめじ','ツナ','コーン','わかめ','油揚げ','チーズ','キムチ','うどん','スパゲッティ','牛乳'];
// 買い足すとレパートリーが広がる食材: その1品を足すと「今すぐ作れる」に変わる料理を数える
function shoppingHints(have, limit=3){
    const gain = {};
    RECIPES.forEach(r => {
        if (S.hidden.includes(r.id) || isAvoided(r)) return;
        const m = matchRecipe(swappedRecipe(r), have);   // 苦手な食材は買い足す候補にしない（置き換えた食材で数える）
        if (m.miss.length === 1 && (m.got.length + m.subs.length) >= 1){
            const k = m.miss[0].key, lbl = m.miss[0].label;
            (gain[k] = gain[k] || {label:lbl, names:[]}).names.push(r.name);
        }
    });
    return Object.entries(gain).map(([k,v]) => ({key:k, label:v.label, n:v.names.length, names:v.names.slice(0,3)}))
        .sort((a,b) => b.n - a.n).slice(0, limit);
}

function upgradeOf(r){
    const base = r.isTwist ? r.base : r;
    return base.tip || UPGRADES[base.id] || upgradeByMethod(base.method);
}
function skillDone(r){ const base = r.isTwist ? r.base : r; return S.skills.some(s => s.id === base.id); }
function upgradeHtml(r, compact=false){
    const u = upgradeOf(r); if (!u) return '';
    const done = skillDone(r);
    const base = r.isTwist ? r.base : r;
    return `<div class="card skill${done?' done':''}">
            <div class="eyebrow">${esc(t('ひと手間'))}${done ? esc(t('・習得済み')) : ''}</div>
            <div class="add"><span class="plus">${PLUS()}</span>${esc(u.add)}</div>
            <div class="why">${esc(u.why)}</div>
            <div class="how"><b>${esc(u.skill)}</b>${GAP()}${esc(u.how)}</div>
            ${compact ? '' : `<div class="row">${done
                ? `<span class="badge fav">${esc(t('習得済み'))}</span><span class="small muted">${esc(t('「{skill}」はもう身についています', {skill:u.skill}))}</span>`
                : hasPro()
                ? `<button class="btn sm primary" data-act="skill-done" data-id="${esc(base.id)}">${esc(t('やってみた'))}</button><span class="small muted">${esc(t('できたら押してください。記録に残ります'))}</span>`
                : `<button class="btn sm" data-act="paywall-skill">${esc(t('やってみた'))}<span class="plus-mark">${esc(t('プラス'))}</span></button><span class="small muted">${esc(t('記録と腕前の称号はプラスで使えます'))}</span>`}</div>`}
    </div>`;
}

/* =========================================================
   励まし（あいさつ・ねぎらい・ふりかえり・称号）
   ========================================================= */
function recordedDays(){ return [...new Set(S.history.map(h => h.d))].sort().reverse(); }
function streak(){
    const days = new Set(S.history.map(h => h.d));
    let n = 0, d = TODAY;
    if (!days.has(d)) d = addDays(d, -1);
    while (days.has(d)){ n++; d = addDays(d, -1); }
    return n;
}
function weekStart(d=TODAY){ const dt = parseYmd(d); const wd = (dt.getDay() + 6) % 7; return addDays(d, -wd); }   // 月曜はじまり
function weekStats(){
    const from = weekStart();
    const hs = S.history.filter(h => h.d >= from && h.d <= TODAY);
    const days = new Set(hs.map(h => h.d)).size;
    const firstOf = {};
    S.history.forEach(h => { if (!firstOf[h.id] || h.d < firstOf[h.id]) firstOf[h.id] = h.d; });   // 料理ごとの初めて作った日（並べ替えずに最小の日付を取る）
    const fresh = [...new Set(hs.map(h => h.id))].filter(id => firstOf[id] >= from);
    const skills = S.skills.filter(s => s.d >= from).length;
    const genres = new Set(hs.map(h => { const r = byId(h.id); return r && r.genre; }).filter(Boolean)).size;
    return {days, dishes:hs.length, fresh, skills, genres};
}
function greeting(){
    const h = new Date().getHours();
    const hello = h < 5 ? t('こんばんは。遅くまでおつかれさまです') : h < 11 ? t('おはようございます') : h < 17 ? t('こんにちは') : t('こんばんは');
    const todayDone = S.history.some(x => x.d === TODAY);
    const st = streak();
    const ws = weekStats();
    let line;
    if (!S.history.length) line = t('まずは今日の献立を決めるところから。決めるだけでも、立派なひと仕事です。');
    else if (todayDone && st >= 3) line = t('{n}日続けて献立が決まっています。この調子は、ちゃんとすごいことです。', {n:st});
    else if (todayDone) line = t('今日の献立は決まっています。あとは作るだけ。');
    else if (st >= 3) line = t('{n}日続いています。今日の分を決めれば{m}日目です。', {n:st, m:st+1});
    else if (ws.days) line = t('今週は{n}日分、{d}品を記録しています。今日はどうしましょう。', {n:ws.days, d:ws.dishes});
    else line = t('きのうまでのごはん、おつかれさまでした。今日の分をいっしょに考えましょう。');
    return {hello, line};
}
function praiseList(){ return [t('今日もおつかれさまです。'), t('献立が決まれば、半分は終わったようなものです。'), t('毎日のごはんが、ちゃんと回っています。'), t('記録しました。いつかの自分を助けます。'), t('今日の分、決まりました。あとは作るだけ。')]; }
function praiseFor(ids, before){
    const st = streak();

function addMonthsClamp(d, n){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return d; }
function introEndYmd(){ const o = introOffer || {unit:'month', n:1}; const d = parseYmd(TODAY); if (o.unit === 'day') d.setDate(d.getDate() + o.n); else addMonthsClamp(d, o.n); return ymd(d); }
// 解約の期限: お試しが終わる時刻の24時間前（自動更新は24時間前までの解約が必要）。日付と時刻で出す
function introCancelBy(){
    const o = introOffer || {unit:'month', n:1}, d = new Date(); if (o.unit === 'day') d.setDate(d.getDate() + o.n); else addMonthsClamp(d, o.n);
    d.setTime(d.getTime() - 24 * 3600000);   // 夏時間の切り替え日でも、ちょうど24時間前（壁時計の時刻ではなく経過時間）
    let tz = ''; try{ const p = new Intl.DateTimeFormat(LANG, {timeZoneName:'short'}).formatToParts(d).find(x => x.type === 'timeZoneName'); tz = p ? p.value : ''; }catch(e){}   // 端末のタイムゾーン略称（JST・PST など）。取れなければ付けない
    return jpDate(ymd(d)) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + (tz ? ' ' + tz : '');

async function purchase(productId){

        const P = await ready;
        const offs = await P.getOfferings();
        const pkgs = (offs && offs.current && offs.current.availablePackages) || [];
        const pkg = pkgs.find(p => p.product && p.product.identifier === productId) || pkgs[0];
        if (!pkg) throw new Error('no package');

        if (applyCustomerInfo(res && res.customerInfo)){ closeSheet(); toast(t('{plan}を始めました。ありがとうございます', {plan:PLAN.name}), true); }
    }catch(e){ if (!(e && e.userCancelled)) toast(t('購入を完了できませんでした。通信環境を確認して、もう一度お試しください')); }
}

/* ---- 下から出る画面のフォーカス（開いたら中へ移し、Tab は中だけを回り、閉じたら開いたボタンへ戻す） ---- */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
const dlgRet = {}, dlgLast = {};   // 開く前にフォーカスがあったもの／中で最後にフォーカスしたもの（描き直しても戻せるよう data-* で覚える）
function focusKey(el){
    if (!el || el === document.body) return '';
    if (el.dataset && el.dataset.act) return ['act', 'id', 'v', 'k', 'cc', 'slot', 'd', 'i'].map(k => el.dataset[k] || '').join('|');
    if (el.id) return '#' + el.id;
    if (el.matches && el.matches('summary') && el.parentElement) return 'sum|' + el.parentElement.className;   // 「条件を変える」などの開閉
    return '';
}
function findByKey(scope, key){
    if (!key) return null; if (key[0] === '#') return scope.querySelector(key);
    if (key.startsWith('sum|')) return [...scope.querySelectorAll('summary')].find(x => 'sum|' + x.parentElement.className === key) || null;
    return [...scope.querySelectorAll('[data-act]')].find(x => focusKey(x) === key) || null;
}
// キーボードで操作しているか（:focus-visible）。文字入力欄は常に true。タップ・クリックで当たったボタンは false
// 直前の操作がキーボードか（指・マウスで触れたあとの 600ms は false）
let ptrAt = -1e9, keyAt = -1e9;
['pointerdown', 'touchstart', 'mousedown'].forEach(ev => document.addEventListener(ev, () => { ptrAt = performance.now(); }, {capture:true, passive:true}));
document.addEventListener('keydown', e => { if (e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt' && e.key !== 'Meta') keyAt = performance.now(); }, true);
function kbNav(){ return keyAt > ptrAt || performance.now() - ptrAt > 600; }
function kbFocused(el){ try{ return el.matches(':focus-visible'); }catch(e){ return true; } }
function topDialog(){ return $('#sheet-root [role="dialog"]') || $('#modal-root [role="dialog"]'); }
function dlgOpened(rootId){   // renderModal / renderSheet のあとに呼ぶ
    const root = document.getElementById(rootId), d = root.querySelector('[role="dialog"]'); if (!d) return;
    const h = d.querySelector('h2, h3');
    if (h && !d.hasAttribute('aria-label')){ h.id = h.id || rootId + '-title'; d.setAttribute('aria-labelledby', h.id); }
    const a = document.activeElement;
    if (!(rootId in dlgRet)){ dlgRet[rootId] = {el: a && a !== document.body ? a : null, key: focusKey(a)}; dlgLast[rootId] = ''; }
    else if (a && a !== document.body && document.contains(a)) return;   // 描き直してもフォーカスが残っている
    if (!kbNav()) return;   // タップで開いたときは、フォーカスを動かさない（動かすと強制レイアウトが走る）
    const back = findByKey(root, dlgLast[rootId]);
    if (back){ back.focus({preventScroll:true}); return; }
    const first = h || d.querySelector('[data-act="close"], [data-act="sheet-close"]') || d;
    if (!first.matches(FOCUSABLE)) first.setAttribute('tabindex', '-1');
    first.focus({preventScroll:true});
}
function dlgClosed(rootId){
    if (!(rootId in dlgRet)) return;
    const r = dlgRet[rootId]; delete dlgRet[rootId]; delete dlgLast[rootId];
    if (topDialog() && topDialog().contains(document.activeElement)) return;
    if (!kbNav()) return;
    const el = r.el && document.contains(r.el) ? r.el : findByKey(document, r.key);
    if (el) el.focus({preventScroll:true});
}
document.addEventListener('focusin', e => { for (const id of ['modal-root', 'sheet-root']){ const root = document.getElementById(id); if (root && root.contains(e.target)) dlgLast[id] = focusKey(e.target); } });
function trapTab(e){
    const d = topDialog(); if (!d) return;
    const els = [...d.querySelectorAll(FOCUSABLE)].filter(x => x.getClientRects().length && !x.closest('[hidden]'));
    if (!els.length){ e.preventDefault(); return; }
    const first = els[0], last = els[els.length - 1], a = document.activeElement;
    if (!d.contains(a)){ e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && (a === first || !els.includes(a) && a.compareDocumentPosition(first) & Node.DOCUMENT_POSITION_FOLLOWING)){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && a === last){ e.preventDefault(); first.focus(); }
}

function suggestFor(slot, items, main){
    if (!main) return null;
    const used = items.map(x => x.r && x.r.id).filter(Boolean);
    const others = items.map(x => x.r).filter(r => r && r !== main);
    const ctx = {main, others, fridge: session.useFridge ? fridgeKeys() : null};
    if (slot === '汁物'){
        if (main.id === 'nikuudon' || main.type === '汁物') return null;
        const ps = poolFor('汁物').filter(r => r.type === '汁物' && !used.includes(r.id));

    }
    if (slot === '副菜'){
        const ps = poolFor('副菜').filter(r => r.type === '副菜' && !used.includes(r.id));
        return pick(easyPool('副菜', ps), ctx) || (session.mood === 'easy' || session.mood === 'bento' ? pick(ps, ctx) : null);

    const mainProteins = new Set(main.items.filter(i => !i.opt && FAMILY[i.key]).map(i => i.key));
    const free = r => r.id !== main.id && !used.includes(r.id) && !isAvoided(r);
    const diff = r => r.family !== main.family && !r.items.some(i => !i.opt && mainProteins.has(i.key));
    const tiers = [
        r => r.type === '主菜' && diff(r) && r.min <= 30,
        r => r.type === '主菜' && diff(r) && r.min <= 50,
        r => r.type === '主菜' && diff(r),
        r => r.type === '主菜' && r.family !== main.family,
        r => r.main && diff(r),
        r => r.main,
    ];
    // 最近作った料理は、どの段階にも作っていない主菜がないときだけ使う（段階の中でゆるめると、まだある主菜より先に最近の料理が出てしまう）
    for (const strict of [true, false]) for (const ok of tiers){
        const pool = easyPool('主菜', poolFor('主菜').filter(r => free(r) && ok(r)));
        const r = pool.length ? pick(pool, Object.assign({}, ctx, {strict})) : null; if (r) return r;
    }
    return null;
}

function unitSing(u){ return String(u).replace(/^(\s*)(\S+)/, (m, sp, w) => { const p = UNIT_PAIRS.find(x => x.indexOf(w) > 0); return sp + (p ? p[0] : w); }); }
function unitForm(u, v){
    return String(u).replace(/^(\s*)(\S+)/, (m, sp, w) => { const p = UNIT_PAIRS.find(x => x[0] === w); if (!p) return m;
        if (p.length > 2){ let c = 'other'; try{ c = new Intl.PluralRules('pl').select(v); }catch(e){} return sp + (c === 'one' ? p[0] : c === 'few' ? p[1] : c === 'many' ? p[2] : p[3]); }

function sumQty(list){
    const groups = new Map(), rest = [];
    list.forEach(q => {
        // 「2 cups (480 ml)」のように、うしろのかっこに重さ・かさがあるときは、かっこの中も足す（同じ単位のものだけ）
        const pm = String(q).match(/^(.*?\S)\s*[（(]\s*(\d+(?:\.\d+)?)\s*(g|kg|ml|l|cl|dl)\s*[)）]\s*$/);
        const body = pm ? pm[1] : q;
        const m = String(body).match(/^(\D*?)(?:(\d+)[と ])?(\d+(?:\.\d+)?)(?:\/(\d+))?(\D*)$/);
        if (!m){ rest.push(q); return; }
        const v = (m[2] ? Number(m[2]) : 0) + (m[4] ? Number(m[3]) / Number(m[4]) : Number(m[3]));
        // 単位（前後の言葉）がちがうものは足さない。「400 g」と「400g」は同じ単位とみなす

        const u = unitSing(m[5]), key = m[1].trim() + '|' + u.trim() + '|' + (pm ? pm[3] : ''), g = groups.get(key) || {pre:m[1], unit:u, v:0, pu:pm ? pm[3] : '', pv:0};
        g.v += v; if (pm) g.pv += Number(pm[2]); groups.set(key, g);
    });
    const out = [...groups.values()].map(({pre, unit, v, pu, pv}) => { const f = fmtAmount(v, unit.trim()); return pre + (f === '1/8' ? t('少々') : f) + unitForm(unit, v) + (pu ? ' (' + fmtAmount(pv, pu) + ' ' + pu + ')' : ''); });
    return [...out, ...rest];
}

function cardData(kind){

        const days = visiblePlanDaysAll().map(x => ({d:x.d, r:byId(x.id), skip:!!x.skip})).filter(x => x.r).slice(0, 7);
        // 1日分だけのとき（無料版）は、ほぼ空白の「週」カードにせず、その日の献立カードにする（作らない日だけのときは週カードのまま）

            const x = visiblePlanDays().find(y => y.d === days[0].d), rs = dayDishes(x);
            const dishes = rs.map(r => ({r, name:r.name, slot:slotLabel(slotOf(r)), min:r.min || 0}));
            return dishes.length ? {kind:'menu', dishes, date:days[0].d, line: days[0].d === TODAY ? t('今日のごはんです') : t('今週の献立です'), min:dishes.reduce((a, y) => a + y.min, 0), sv:Number(S.settings.servings) || 2} : null;
        }

    }
    const cook = kind === 'cook', m = cook ? (S.cook ? {items: cookItems()} : null) : session.menu, d = cook && S.cook ? S.cook.d : TODAY;
    if (!m || !m.items.length) return null;
    const dishes = m.items.filter(x => x.r).map(x => ({r:x.r, name:x.r.name, slot:slotLabel(x.slot || slotOf(x.r)), min:x.r.min || 0}));

    return dishes.length ? {kind, dishes, date:d, line: cook ? t('今日はこれを作ります') : t('今日のごはんです'), min:dishes.reduce((a, x) => a + x.min, 0), sv:Number(S.settings.servings) || 2} : null;
}
function cardLoadImg(r, staple){
    return new Promise(res => {
        let ph = null; try{ ph = r ? photoOf(r) : staple ? (GEN.rice || sketchOf(PHOTOS.rice)) : null; }catch(e){}
        if (!ph || !ph.src) return res(null);
        const im = new Image(), to = setTimeout(() => res(null), 5000);
        im.onload = () => { clearTimeout(to); res(im.naturalWidth ? im : null); };

// 文字を幅に合わせて折り返す（単語の切れ目で。切れ目のない長い文字は文字ごとに）。入りきらないときは「…」
function cardWrap(ctx, text, maxW, maxLines){

    const lines = []; let cur = '';

}

function cardChip(ctx, text, cx, cy, size){

function cardBackdrop(ctx, rtl, big, sub){

// 食べられないものの共有カード（1080×1350）。登録した内容と「必ずご自身で確かめてください」の注意だけを描く
async function needsCardCanvas(arg){

    const secs = [];
