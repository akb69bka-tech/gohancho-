function suggestFor(slot, items, main){
    if (!main) return null;
    const used = items.map(x => x.r && x.r.id).filter(Boolean);
    const others = items.map(x => x.r).filter(r => r && r !== main);
    const ctx = {main, others, fridge: session.useFridge ? fridgeKeys() : null};
    if (slot === '汁物'){
        if (main.id === 'nikuudon' || main.type === '汁物') return null;
        return pick(poolFor('汁物').filter(r => r.type === '汁物' && !used.includes(r.id)), ctx);
    }
    if (slot === '副菜') return pick(poolFor('副菜').filter(r => r.type === '副菜' && !used.includes(r.id)), ctx);
    // 2品目の主菜: 1品目と違う肉・魚で、手のかからないもの。
    // 国によっては30分以内の主菜が少ないので、条件を少しずつゆるめて必ず1品えらぶ（空のお皿を出さない）
    const mainProteins = new Set(main.items.filter(i => !i.opt && FAMILY[i.key]).map(i => i.key));
    const free = r => r.id !== main.id && !used.includes(r.id) && !isAvoided(r);
    const diff = r => r.family !== main.family && !r.items.some(i => !i.opt && mainProteins.has(i.key));
    const tiers = [
        r => r.type === '主菜' && diff(r) && r.min <= 30,
        r => r.type === '主菜' && diff(r) && r.min <= 50,
        r => r.type === '主菜' && diff(r),
        r => r.type === '主菜' && r.family !== main.family,
        r => r.main && diff(r),
        r => r.main,
    ];
    // 最近作った料理は、どの段階にも作っていない主菜がないときだけ使う（段階の中でゆるめると、まだある主菜より先に最近の料理が出てしまう）
    for (const strict of [true, false]) for (const ok of tiers){
        const pool = poolFor('主菜').filter(r => free(r) && ok(r));
        const r = pool.length ? pick(pool, Object.assign({}, ctx, {strict})) : null; if (r) return r;
    }
    return null;
}

/* =========================================================
   人数に合わせて分量を変える（レシピは2人分で書いてある）
   ========================================================= */
const FRAC = {0.25:'1/4', 0.5:'1/2', 0.75:'3/4'};
function fmtAmount(v, unit){
    if (unit === 'g' || unit === 'ml'){
        const step = v >= 100 ? 10 : 5;
        return String(Math.max(step, Math.round(v / step) * step));
    }
    const and = LANG === 'ja' ? 'と' : ' ';   // 帯分数のつなぎ（1と1/2 / 1 1/2）
    if (v >= 3){ const h = Math.round(v * 2) / 2; return Number.isInteger(h) ? String(h) : `${Math.floor(h)}${and}1/2`; }
    const t3 = Math.round(v * 3);   // 1/3・2/3 はそのまま表す（レシピに多い）
    if (t3 % 3 !== 0 && Math.abs(v * 3 - t3) < 0.06){ const w3 = Math.floor(t3 / 3), r3 = t3 % 3; return (w3 ? `${w3}${and}` : '') + `${r3}/3`; }
    const q = Math.round(v * 4) / 4;
    if (q === 0) return '1/8';
    const w = Math.floor(q), f = +(q - w).toFixed(2);
    if (!f) return String(w);
    return w ? `${w}${and}${FRAC[f]}` : FRAC[f];
}
function scaleText(str, factor){
    if (!str || factor === 1) return str;
    // かっこの中の分量も同じ倍率にする（2 large (350 g) → 4 large (700 g)）。大きさ（10 cm・20cmの鍋）や温度はそのまま
    // 帯分数（1 1/2）はひとつの数として扱う
    return String(str).replace(/(（[^）]*）|\([^)]*\))|(?:(\d+)(?:\s+|と)(?=\d+\/\d+))?(\d+(?:\.\d+)?)(?:\/(\d+))?(\s*(?:cm|mm|inch(?:es)?|in\.|°[CF]?)(?![a-z])|倍|℃|%|枚切り|cm|mm|g|ml)?/g, (m, paren, w, a, b, unit) => {
        if (paren) return /\beach\b|\bper\b|ずつ|あたり|^.1(缶|個|本|枚|袋|パック|玉|尾|切れ)|\bcada\b|chacun|ciascun|\bje\b|każd|개당|mỗi|masing/i.test(paren) ? paren   // 1個あたりの重さはそのまま
            : paren.slice(0, 1) + scaleText(paren.slice(1, -1), factor) + paren.slice(-1);
        if (unit && !['g','ml'].includes(unit)) return m;
        const v = ((w ? Number(w) : 0) + (b ? Number(a) / Number(b) : Number(a))) * factor;
        return fmtAmount(v, unit) + (unit || '');
    });
}

// 苦手の一覧の1件（'@pork' のようななかまの印、または食材の名前）が、なかま全部を避けるものなら、そのなかまを返す
function avoidFamOf(x){

}
function inFam(f, i){ const d = AVOID_FAM[f]; return d.jp.includes(i.key) || d.re.test((i.key + '|' + (i.en || '')).toLowerCase()); }
// いまの国の料理に出てくるなかまだけをチップにする

function avoidFamLabel(f){

}

function avoidName(x){ const f = avoidFamOf(x); return f ? avoidFamLabel(f) : String(x); }
// 苦手のチップ: なかまのチップ（いまの国の料理に出てくるものだけ）と、なかまで足りない個別の食材

function avoidKeys(){ return new Set((S.settings.avoid || []).filter(x => String(x)[0] !== '@').map(keyOf)); }

function avoidCtx(){
    const av = S.settings.avoid || [], sig = JSON.stringify(av);
    if (avoidCtx.c && avoidCtx.c.sig === sig) return avoidCtx.c;
    const free = av.filter(x => String(x)[0] !== '@' && !canonOf(x)).map(x => { const raw = String(x).normalize('NFKC').toLowerCase().trim(); return {x, re: LATIN_RE.test(raw) ? wordRe(raw) : null}; });
    return avoidCtx.c = {sig, any: av.length > 0, ks: avoidKeys(), fams: [...new Set(av.map(avoidFamOf).filter(Boolean))], free};

function itemAvoided(i, c){
    c = c || avoidCtx(); if (!c.any) return false;
    if (c.ks.has(i.key) || c.fams.some(f => inFam(f, i))) return true;
    if (i.en && i.label && c.ks.has(keyOf(i.label))) return true;   // ほかの国の料理も、画面の名前（ピーマンなど）で見分ける
    return c.free.some(({x, re}) => re ? re.test(wnorm(i.label + ' ' + i.name)) : norm(i.label + i.name).includes(norm(x)));
}
// 苦手な食材を使う料理か（置き換えて作れる料理は、置き換えて出すので苦手にしない）
// 調味料の欄の食材（天ぷらの衣の小麦粉・卵、ムニエルのバターなど）。元の言葉の文から取り出す（日本は日本語、各国は英語）
function seasItems(r){
    if (r._seas) return r._seas;
    const src = String(r.seasBase != null ? r.seasBase : (r.seas || ''));
    const out = r.pack ? src.split(/\s*[·•;]\s*|,\s+/).map(x => x.trim()).filter(Boolean).map(x => { const l = x.toLowerCase(); return {name:x, label:x, key:l, en:l, qty:'', opt:false}; })
        : src.split(/[・、]/).map(x => x.trim()).filter(Boolean).map(x => parseIng(x));

// 調味料の欄の苦手な食材のうち、置き換えて出せるもの（鶏ガラスープの素など。seasFor で替える）
function seasSwappable(r, i){ return swapOn() && !r.pack && !r.trLang ? SEAS_SWAP.some(([f, re]) => { re.lastIndex = 0; return re.test(i.name); }) : false; }
function seasAvoided(r, c){ return seasItems(r).some(i => itemAvoided(i, c) && !seasSwappable(r, i)); }

    if (!r || !r.items || !(S.settings.avoid || []).length) return false;
    const c = avoidCtx();

    if (!r.items.some(i => !i.opt && itemAvoided(i, c))) return false;

/* ---- 苦手な食材の置き換え ---- */
// 苦手な食材を使う料理も、ほかの食材で作れるなら置き換えて出す（設定でオフにできる）。
// 代わりの食材は、いまの国のレシピによく出てくる食材から選ぶ（その国で手に入りやすく、名前もその国の言葉で出せる）。
// 卵・乳製品・ナッツ・小麦や、ハム・だしの素のような加工品は置き換えない（その料理は今までどおり出さない）
const SWAP_TXT = i => (i.key + '|' + (i.en || '') + '|' + i.label).toLowerCase();
const SWAP_BAD = /stock|broth|soup|condensed|\beggs?\b|\bhead\b|\bwhole\b|poussin|tripe|mondongo|offal|kidney|tongue|oxtail|\bsalt(ed)? (cod|fish|herring|mackerel|pork|beef)|bacalhau|matj|charqui|carne seca|bouillon|powder|cube|granule|seasoning|sauce|paste|\bfat\b|lard|skin|bones?\b|liver|gizzard|heart|feet|trotter|canned|tinned|\bcan\b|dried|smoked|cured|ガラ|スープの素|だし|ルウ|ソース|缶/;
const SWAP_PROC = /\bham\b|bacon|sausage|salami|chorizo|pancetta|prosciutto|guanciale|\bspam\b|wiener|hot ?dog|frankfurter|wurst|corned|pastrami|bresaola|sucuk|ハム|ベーコン|ウインナー|ソーセージ|ツナ|かまぼこ|ちくわ|かに風味|ちりめん|surimi|anchov|\btuna\b|bonito|katsuobushi|fish ball|fish ?cakes?|eomuk|\bballs?\b|morcilla|blood|black pudding|haggis|gammon|moo yor|pork roll|meatball|nugget|dumpling|wonton|wrapper|mandu|餃子|しゅうまい|\bpie\b|pastry|patt(y|ies)|burger|leftover|cooked|shredded/;

const SWAP_CUT = /ribs?\b|belly|shoulder|\bbutt\b|hock|knuckle|shank|whole|bone-in|on the bone|with bone|wings?\b|drumstick|\blegs?\b|carcass|骨付き|手羽|スペアリブ|豚バラ|ซี่โครง|ปีก|น่อง/;
const swapBody = f => i => inFam(f, i) && !SWAP_BAD.test(SWAP_TXT(i)) && !SWAP_PROC.test(SWAP_TXT(i));
const swapSlice = f => i => swapBody(f)(i) && !swapMince(i);

    {is: swapSlice('pork'), to: [[swapCut('chicken'), 'chicken'], [swapTofu, 'tofu']]},
    {is: swapSlice('beef'), to: [[swapCut('pork'), 'pork'], [swapCut('chicken'), 'chicken']]},
    {is: swapSlice('chicken'), to: [[swapCut('pork'), 'pork'], [swapTofu, 'tofu']]},
    {is: swapBody('fish'), to: [[swapBody('fish'), 'fish'], [swapCut('chicken'), 'chicken']]},

    {is: swapVeg(/ピーマン|パプリカ|bell pepper|capsicum|green pepper|sweet pepper|\bpimiento|paprika\|/), to: [[swapVeg(/ピーマン|パプリカ|bell pepper|capsicum|sweet pepper/), ''], [swapVeg(/ズッキーニ|zucchini|courgette/), '']]},
    {is: swapVeg(/なす|eggplant|aubergine|brinjal|\bterong\b/), to: [[swapVeg(/ズッキーニ|zucchini|courgette/), ''], [swapVeg(/ピーマン|パプリカ|bell pepper/), '']]},
    {is: swapVeg(/ゴーヤ|bitter (gourd|melon)|ampalaya|karela/), to: [[swapVeg(/ピーマン|bell pepper|green pepper/), ''], [swapVeg(/ズッキーニ|zucchini/), '']]},
    {is: swapVeg(/しいたけ|しめじ|まいたけ|えのき|エリンギ|mushroom|shiitake|champignon/), to: [[swapVeg(/しいたけ|しめじ|まいたけ|えのき|エリンギ|mushroom|shiitake|champignon/), '']]},
    {is: swapVeg(/パクチー|cilantro|coriander (leaves|leaf)|^coriander\||fresh coriander/), to: [[swapVeg(/三つ葉|小ねぎ|parsley|spring onion|green onion|scallion/), '']]},
    {is: swapVeg(/セロリ|celery/), to: [[swapVeg(/玉ねぎ|^onion\||\byellow onion|white onion/), '']]},
    {is: swapVeg(/ほうれん草|小松菜|spinach/), to: [[swapVeg(/ほうれん草|小松菜|spinach|kale|chard|bok choy|pak choi/), '']]},
    {is: swapVeg(/キャベツ|白菜|cabbage/), to: [[swapVeg(/キャベツ|白菜|cabbage/), '']]},
    {is: swapVeg(/玉ねぎ|長ねぎ|^onion\||\bleeks?\b/), to: [[swapVeg(/玉ねぎ|長ねぎ|^onion\||\bleeks?\b|shallot/), '']]},

// いまの国の材料（名前ごとに、よく出てくる順）。苦手の設定と国・言語が変わったら作り直す
function swapPool(){
    const sig = currentCountry() + '|' + LANG + '|' + RECIPES.length;
    if (swapPool.c && swapPool.c.sig === sig) return swapPool.c.list;
    // よく出てくる食材のキーの順。同じキーでも部位や名前がちがうもの（fish の切り身と頭など）は別々に並べる
    const keyN = new Map(), m = new Map();
    RECIPES.forEach(r => (r.items || []).forEach(i => { if (i.opt) return; keyN.set(i.key, (keyN.get(i.key) || 0) + 1);
        const k = SWAP_TXT(i), e = m.get(k); if (e) e.n++; else m.set(k, {i, n: 1}); }));
    const list = [...m.values()].sort((a, b) => keyN.get(b.i.key) - keyN.get(a.i.key) || b.n - a.n).map(e => e.i);
    swapPool.c = {sig, list}; return list;
}
// 1つの材料の代わり（なければ null）
function swapFor(i){
    const c = avoidCtx(), sig = c.sig + '|' + currentCountry() + '|' + LANG;
    if (!swapFor.c || swapFor.c.sig !== sig) swapFor.c = {sig, m: new Map()};
    const ck = SWAP_TXT(i);   // 各国のパックは同じキー（fish など）で別の部位があるので、名前ごとに覚える
    if (swapFor.c.m.has(ck)) return swapFor.c.m.get(ck);
    let hit = null;
    const rule = SWAP_RULES.find(x => x.is(i));
    if (rule) for (const [ok, tip] of rule.to){
        const j = swapPool().find(x => SWAP_TXT(x) !== SWAP_TXT(i) && ok(x) && !itemAvoided(x, c));
        if (j){ hit = {i: j, tip}; break; }
    }
    swapFor.c.m.set(ck, hit); return hit;
}
function swapOn(){ return S.settings.avoidSwap !== false; }
// 料理の置き換え: {swaps:[{from, to, tip}], omit:[なくても作れる苦手な材料]}。置き換えられない材料があれば null
function recipeSwaps(r){
    if (!swapOn() || !r || !r.items) return null;
    const c = avoidCtx(), swaps = [], omit = [];
    for (const i of r.items){
        if (!itemAvoided(i, c)) continue;
        if (i.opt){ omit.push(i); continue; }
        const w = swapFor(i);
        if (!w || r.items.some(x => x !== i && x.key === w.i.key)) return null;   // 代わりがない・同じ食材がもう入っている
        if ([i.label, i.name].some(n => n && n.length >= 2 && String(r.name).includes(n))) return null;   // 料理の名前の食材（ピーマンの肉詰めのピーマンなど）は置き換えない
        if (nameHasFam(r, i)) return null;   // 料理の名前が主役の肉・魚を表す（鶏の唐揚げ・豚汁・Chicken parm など）料理も置き換えない
        swaps.push({from: i, to: w.i, tip: w.tip});
    }
    return {swaps, omit};
}
// 画面に出すレシピ（苦手な食材を置き換えたもの）。いまの国の料理だけ（ほかの国の料理は、その国の材料がわからないので置き換えない）
function swappedRecipe(r){
    if (!r || !r.items || !(S.settings.avoid || []).length || r.swapped) return r;
    if (!RECIPES.includes(r)) return r;
    const w = recipeSwaps(r); if (!w || (!w.swaps.length && !w.omit.length)) return r;
    const by = new Map(w.swaps.map(x => [x.from, x])), seen = new Set();
    // 分量は代わりの食材のふだんの分量（尾・杯・本のような数え方がそのまま残らないように）。同じ食材への置き換えが2つあれば1行にまとめる
    const items = r.items.filter(i => !w.omit.includes(i)).map(i => { const x = by.get(i); if (!x) return i;
        if (seen.has(x.to.key)) return null; seen.add(x.to.key);
        return Object.assign({}, i, {name: x.to.name, label: x.to.label, key: x.to.key, en: x.to.en, qty: x.to.qty || i.qty, changed: true, from: i.name}); }).filter(Boolean);
    // 肉・魚の種類も置き換えた主役に合わせる
    const pw = w.swaps.find(x => x.from.key === r.protein), famOf = {chicken:'鶏', pork:'豚', tofu:'大豆', fish:'魚'};
    const fam = pw ? (FAMILY[pw.to.key] || famOf[pw.tip] || (/ground|mince/.test(SWAP_TXT(pw.to)) ? 'ひき肉' : r.family)) : r.family;
    const esc_ = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const repl = txt => w.swaps.reduce((s, x) => {

        const fam = currentCountry() === 'JP' && !r.trLang ? FAMILY_RE[FAMILY[x.from.key]] : null;
        if (fam && /[ぁ-ん一-龠]/.test(x.to.name)) s = s.replace(fam, x.to.name);
        return [...new Set([x.from.name, x.from.label])].filter(n => n && n.length > 1).sort((a, b) => b.length - a.length)

const REMOTE_URL = 'https://raw.githubusercontent.com/akb69bka-tech/gohancho-/main/gohancho/remote.json';
let REMOTE = {};
function applyRemote(j){
    if (!j || typeof j !== 'object') return;
    REMOTE = j;
    const pl = j.plan && typeof j.plan === 'object' ? j.plan : {};
    if (pl.trialMode === 'app' || pl.trialMode === 'store') PLAN.trialMode = pl.trialMode;
    if (Number(pl.trialDays) > 0) PLAN.trialDays = Number(pl.trialDays);
    if (Number(pl.loyaltyMonths) > 0) PLAN.loyalty.months = Number(pl.loyaltyMonths);
    if (pl.campaign && typeof pl.campaign === 'object') Object.assign(PLAN.campaign, pl.campaign);
}
async function loadRemote(){
    try{ const c = JSON.parse(localStorage.getItem('gohancho.remote') || 'null'); if (c) applyRemote(c); }catch(e){}
    if (!/^https?:$/.test(location.protocol) && !isNative()) return;
    try{
        const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 6000);
        const res = await fetch(REMOTE_URL + '?t=' + Math.floor(Date.now() / 3600000), {cache:'no-store', signal: ctrl.signal});
        if (!res.ok) return;
        const j = await res.json(); if (!j || typeof j !== 'object') return;
        try{ localStorage.setItem('gohancho.remote', JSON.stringify(j)); }catch(e){}
        applyRemote(j); render();
    }catch(e){}
}

function shopBase(label){
    let s = String(label).normalize('NFKC').toLowerCase().replace(/[（(][^）)]*[）)]/g, ' ').split(/[,，、]/)[0].trim();
    if (/[\u0E00-\u0E7F]/.test(s)) s = s.split(/\s+/)[0];
    return s.split(/\s+/).map(w => /^[a-zà-ɏ'’-]+$/.test(w) ? w.replace(/(?<=..)s$/, '') : w).join(' ');
}
// 買い物メモの売り場: veg（野菜）・meat（肉・魚）・dairy（乳製品・卵）・other（その他）
const SHOP_OTHER_JP = ['こんにゃく','シチュールウ','カレールウ','ハヤシルウ','パン粉','豆腐','厚揚げ','油揚げ','おから','大豆','餃子の皮','わんたんの皮','春雨','キムチ','マカロニ','スパゲッティ','焼きそば麺','うどん','天かす','ご飯','ひじき','わかめ','昆布','塩昆布','刻みのり','トマト缶','梅干し','切り干し大根','酒粕','小麦粉','切り餅','赤わいん','紅しょうが','かつお節'];
function shopSec(i){
    const w = (i.key + '|' + (i.en || '')).toLowerCase();
    if (['pork','chicken','beef','fish','shellfish'].some(f => inFam(f, i)) || /\b(lamb|mutton|goat|duck|liver|meat|mince|keema|sausage)\b/.test(w) || i.key === 'たらこ') return 'meat';
    if ((inFam('egg', i) || inFam('dairy', i)) && !/noodle|pasta|soup|condensed/.test(w)) return 'dairy';   // 卵麺・クリームスープの缶は乳製品・卵の売り場に入れない
    if (/\b(green|long|wing|string|runner|broad|fava)\s+beans?\b|bean sprouts?|snow peas|^peas\|/.test(w)) return 'veg';
    if (SHOP_OTHER_JP.includes(i.key) || inFam('wheat', i) || inFam('nuts', i)

    return 'veg';

function shoppingList(){
    const have = fridgeKeys(), fac = servingFactor(), map = new Map(), first = new Map();
    visiblePlanDays().forEach(x => {
        const r = swappedRecipe(byId(x.id)); if (!r) return;
        r.items.forEach(i => {
            if (i.opt || PANTRY.has(i.key) || have.has(i.key)) return;
            const b = shopBase(i.label); if (!first.has(i.key)) first.set(i.key, b);
            const id = first.get(i.key) === b ? i.key : i.key + '|' + b;   // チェックの記録と合うよう、最初の名前はキーのまま
            const e = map.get(id) || {key:id, label:i.label, qty:[], dishes:[], sec:shopSec(i)};
            if (i.label.length < e.label.length) e.label = i.label;          // まとめた行は、いちばん短い名前で出す
            if (i.qty) e.qty.push(scaleText(i.qty, fac));

// 同じ単位の分量は足し合わせる（例: 1/3本＋1/3本 → 2/3本、150g＋200g → 350g）
// 数え方の単数・複数（買い物メモで足すときに同じ単位とみなし、足したあとの数に合う形で出す）
const UNIT_PAIRS = [['clove','cloves'],['can','cans'],['tin','tins'],['slice','slices'],['piece','pieces'],['head','heads'],['bunch','bunches'],['stalk','stalks'],['sprig','sprigs'],['rasher','rashers'],['fillet','fillets'],['sheet','sheets'],
    ['tranche','tranches'],['gousse','gousses'],['boîte','boîtes'],['diente','dientes'],['lata','latas'],['rebanada','rebanadas'],['dente','dentes'],['fatia','fatias'],['spicchio','spicchi'],['fetta','fette'],['Zehe','Zehen'],['Dose','Dosen'],['Scheibe','Scheiben'],
    ['ząbek','ząbki'],['plaster','plastry'],['حبة','حبات'],['فص','فصوص'],['رأس','رؤوس']];

        const v = (m[2] ? Number(m[2]) : 0) + (m[4] ? Number(m[3]) / Number(m[4]) : Number(m[3]));

        const perm = await P.requestPermissions();
        if (perm && perm.display && perm.display !== 'granted'){ toast(t('通知が許可されていません。iPhone の「設定」→「ご飯帖」→「通知」で許可してください')); return; }
        await P.schedule({notifications:[{id: NOTIFY_ID, title:t('今日の献立を決めましょう'), body:t('おまかせで、主菜・副菜・汁ものをすぐに提案します。'), schedule:{on:{hour, minute:0}, allowWhileIdle:true}}]});

// 今日「この献立に決定」した献立があれば、アプリを開き直しても同じ献立を出す
function restoreDecided(){
    const c = S.cook; if (!c || c.d !== TODAY) return false;
    const items = c.ids.map((id, i) => ({slot: (c.slots || [])[i] || slotOf(byId(id) || {}), r: byId(id)}));
    if (!items.length || items.some(x => !x.r) || items[0].slot !== '主菜') return false;
    const n = items.length;
    if ((S.settings.dishCount !== 'auto' && n !== menuCount()) || !COMPOSE[n] || COMPOSE[n].slots.join() !== items.map(x => x.slot).join()) return false;   // 品数を変えたら新しく作る（おまかせは日によって品数が変わるので、決めた献立をそのまま出す）
    session.menu = {n, items}; return true;
}
// まだ決めていない今日の案も、その日のうちは同じものを出す（iPhone はアプリを裏で閉じることが多いので、開き直すたびに変わらないよう S.draft に残す）
let draftTried = false;
function restoreDraft(){
    if (draftTried) return false; draftTried = true;   // アプリを開いたときだけ。設定を変えて作り直すときは新しく作る
    const c = S.draft; if (!c || c.d !== TODAY || c.cc !== currentCountry()) return false;
    const n = c.n, items = (c.ids || []).map((id, i) => ({slot: c.slots[i], r: id ? byId(id) : null}));
    // おまかせの品数は気分と「まるごと入れ替え」の回数で決まるので、先に戻してから品数を照らし合わせる
    const prevMood = session.mood, prevSalt = session.countSalt; session.mood = c.mood || 'all'; session.countSalt = c.salt || 0;
    if (n !== menuCount() || !COMPOSE[n]){ session.mood = prevMood; session.countSalt = prevSalt; return false; }
    if (n !== menuCount() || !COMPOSE[n] || COMPOSE[n].slots.join() !== items.map(x => x.slot).join() || items.some((x, i) => c.ids[i] && !x.r)) return false;
    session.menu = {n, items}; session.mood = c.mood || 'all'; session.useFridge = !!c.useFridge;
    session.twist = PACK ? null : suggestTwist();
    return true;
}
function keepDraft(){
    const m = session.menu; if (!m) return;
    const d = {d: TODAY, cc: currentCountry(), n: m.n, slots: m.items.map(x => x.slot), ids: m.items.map(x => x.r ? x.r.id : null), mood: session.mood, useFridge: !!session.useFridge, salt: session.countSalt || 0};
    if (JSON.stringify(d) !== JSON.stringify(S.draft)){ S.draft = d; save(); }
}

/* 料理名・材料名での検索（冷蔵庫に登録しなくても、その食材を使う料理が出る） */
// 検索のことば: 区切り記号で分け、ラテン文字の言葉（pad thai・ground beef）は空白で分けずにひとかたまりで使う
function searchTerms(q){
    return String(q || '').split(/[、,，。・\/\n]+/).map(x => x.trim()).filter(Boolean).flatMap(seg => isLatinText(seg) ? [seg] : seg.split(/\s+/)).filter(Boolean);
}
// 料理名に当たるか: 表示の名前・元の名前（英語・その国の言葉・訳）・日本のレシピのよみ（ひらがな）のどれかに含まれれば当たり。
// 「しょうが焼き」のようにかなと漢字がまざる言葉は、かなの部分はよみ、漢字の部分は料理名に含まれれば当たり
function nameHit(r, tm){
    // id もローマ字の料理名なので当てる（kr_bibimbap・nikujaga）
    const hay = [r.name, r.nameEn, ...(r.alt || [])].filter(Boolean).map(norm).join('|') + '|' + (YOMI[r.id] || '') + '|' + String(r.id).replace(/^[a-z]{2}_/, '').replace(/_/g, '');
    if (hay.includes(tm)) return true;
    const runs = tm.match(/[ぁ-ゖー]+|[^ぁ-ゖー]+/g) || [];
    return runs.length > 1 && /[ぁ-ゖ]/.test(tm) && runs.every(x => hay.includes(x));
}
function searchRecipes(q){
    const raw = searchTerms(q);
    if (!raw.length) return {terms:[], hits:[]};
    const keys = extractIngredients(q).map(keyOf);
    const terms = raw.map(norm).filter(Boolean);
    const score = r => {
        let sc = 0;
        terms.forEach(tm => { if (nameHit(r, tm)) sc += 3; });
        keys.forEach(k => { if (r.items.some(i => i.key === k)) sc += i_main(r, k) ? 2 : 1; });
        terms.forEach(tm => { if (r.items.some(i => norm(i.label).includes(tm) || i.key.includes(tm))) sc += 1; });
        return sc;
    };
    const i_main = (r, k) => r.items.findIndex(i => i.key === k) < 3;
    const hits = RECIPES.filter(r => !isAvoided(r)).map(r => ({r, sc:score(r)})).filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc).map(x => x.r);
    return {terms:raw, hits};
}
function searchResultsHtml(q){
    if (!String(q || '').trim()) return '';
    const {terms, hits} = searchRecipes(q);
    // 料理名（肉じゃが・ハンバーグ・麻婆）だけを入れたときは、それを食材として冷蔵庫に入れる案は出さない
    const ings = extractIngredients(q).filter(x => !S.fridge.some(f => keyOf(f) === keyOf(x)))
        .filter(x => canonOf(x) || !RECIPES.some(r => nameHit(r, norm(x))));
    const addBtn = ings.length ? `<div class="row"><button class="btn sm" data-act="search-to-fridge" data-v="${esc(ings.join('、'))}">${esc(t('{list} を冷蔵庫の材料に追加', {list:joinNames(ings)}))}</button></div>` : '';
    if (!hits.length) return `<div class="list"><div class="empty">${esc(t('見つかりませんでした。別の言い方や、食材の名前だけで試してください'))}</div></div>${addBtn}`;
    const shown = hits.slice(0, 30);
    return `<div class="sec-head"><h3>${esc(t('「{q}」の料理', {q:terms.join(LANG === 'ja' ? '、' : ', ')}))}</h3><span class="hint">${esc(t('{n}品', {n:hits.length}))}</span></div>
    <div class="list">${shown.map(r => `<div class="match">
        <span data-act="open" data-id="${esc(r.id)}">${thumbHtml(r)}</span>
        <div class="info">
            <div class="head" data-act="open" data-id="${esc(r.id)}"><span class="name">${esc(r.name)}</span></div>
            <div class="ings">${swappedRecipe(r).items.slice(0, 6).map(i => esc(i.label)).join(t('・'))}${r.items.length > 6 ? esc(t(' など')) : ''}</div>
            <div class="small muted">${esc(metaLine(r))} ${badges(r)}${swapLineHtml(r)}</div>
        </div></div>`).join('')}</div>${hits.length > shown.length ? `<p class="foot">${esc(t('上位{n}品を表示しています。食材を足すと絞りこめます', {n:shown.length}))}</p>` : ''}${addBtn}`;
}

function matchRow(m){

function histCountry(id){ const m = /^([a-z]{2})_/.exec(id); return m && COUNTRIES.some(c => c.cc === m[1].toUpperCase()) ? m[1].toUpperCase() : 'JP'; }

// アメリカの料理・アメリカで使うときは、オーブンの温度に華氏を添える（190°C → 190°C (375°F)）
function withF(txt, r){ return r && (r.pack === 'US' || currentCountry() === 'US') ? String(txt).replace(/(\d{2,3})\s*°C(?!\s*\()/g, (m, c) => `${m} (${Math.round((c * 9 / 5 + 32) / 5) * 5}°F)`) : txt; }

/* ---- 作り方タブのタイマー（手順の「8分」などをタップすると数えはじめる。音や振動は出さず、0になったら目で分かるように） ---- */
const TIMER_RE = /(\d+(?:[.,]\d+)?)(?:\s*(?:[〜~～\-–]|to|à|a|bis|al|do|ila|đến|hingga|sampai|hanggang)\s*\d+(?:[.,]\d+)?)?\s*(分钟|分鐘|分(?!の)|時間|秒|시간|분|초|นาที|ชั่วโมง|วินาที|मिनट|घंटे|घंटा|सेकंड|دقائق|دقيقة|ساعات|ساعة|ثوان|ثانية|(?:minutes?|minutos?|minuti|minuten?|minuty|minutę|minut|mins?|dakika|menit|phút|hours?|heures?|horas?|ore|ora|stunden?|godzin[ya]?|saat|jam|giờ|seconds?|secondes?|segundos?|secondi|sekunden?|sekundy?|saniye|detik|giây)(?!\p{L}))/giu;
function timerSecs(num, unit){
    const u = unit.toLowerCase(), v = parseFloat(num.replace(',', '.'));
    const f = /^(秒|초|วินาที|सेकंड|ثوان|ثانية|sec|seg|sek|saniye|detik|giây)/.test(u) ? 1 : /^(時間|시간|ชั่วโมง|घंट|ساع|hour|heure|hora|ore|ora|stund|godzin|saat|jam|giờ)/.test(u) ? 3600 : 60;
    const sec = Math.round(v * f); return sec > 0 && sec <= 12 * 3600 ? sec : 0;
}
function timerStepHtml(text, name){
    let out = '', last = 0;
    String(text).replace(TIMER_RE, (m, num, unit, off) => {
        const sec = timerSecs(num, unit); if (!sec) return m;
        out += esc(text.slice(last, off)) + `<button type="button" class="timer-chip" data-act="timer" data-s="${sec}" data-name="${esc(name)}" data-label="${esc(m)}" aria-label="${esc(t('タイマーを始める'))}: ${esc(m)}">${esc(m)}</button>`;
        last = off + m.length; return m;
    });
    return out + esc(String(text).slice(last));
}
// タイマーは端末に残す（iPhone はアプリを裏で閉じることがあるので、開き直しても続きから数える。終わって10分たったものは消す）
let TIMERS = (() => { try{ return (JSON.parse(localStorage.getItem('gohancho.timers') || '[]') || []).filter(x => x && x.end > Date.now() - 600000); }catch(e){ return []; } })(), timerTick = 0;
function saveTimers(){ try{ localStorage.setItem('gohancho.timers', JSON.stringify(TIMERS)); }catch(e){} }
if (TIMERS.length) setTimeout(() => { timerTick = setInterval(tickTimers, 1000); }, 0);
function fmtLeft(s){ s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
function timersHtml(){
    return TIMERS.map(x => { const left = (x.end - Date.now()) / 1000;
        return `<div class="timer${left <= 0 ? ' ring' : ''}" data-tid="${x.id}" role="timer"><span class="tm">${esc(left <= 0 ? t('時間です') : fmtLeft(left))}</span><span class="tn">${esc(x.name)}${GAP()}${esc(x.label)}</span><button type="button" class="x" data-act="timer-stop" data-tid="${x.id}" aria-label="${esc(t('タイマーを止める'))}">×</button></div>`; }).join('');
}
function startTimer(sec, name, label){
    TIMERS.push({id: Date.now() + Math.random().toString(36).slice(2, 6), end: Date.now() + sec * 1000, name, label, rang: false});
    if (TIMERS.length > 5) TIMERS.shift();
    saveTimers(); clearInterval(timerTick); timerTick = setInterval(tickTimers, 1000);
    const box = $('#cook-timers'); if (box) box.innerHTML = timersHtml();
}
function tickTimers(){
    floatTimer();
    if (!TIMERS.length){ clearInterval(timerTick); return; }
    TIMERS.forEach(x => {
        const left = (x.end - Date.now()) / 1000;
        if (left <= 0 && !x.rang){ x.rang = true; saveTimers(); toast(t('{name}のタイマーが終わりました', {name:x.name})); }
        const el = document.querySelector(`.timer[data-tid="${x.id}"]`);
        if (el){ el.classList.toggle('ring', left <= 0); el.querySelector('.tm').textContent = left <= 0 ? t('時間です') : fmtLeft(left); }
    });
}
// 作り方タブの外にいるときも、動いているタイマーを下に小さく出す（押すと作り方タブへ）
function floatTimer(){
    const box = $('#timer-float'); if (!box) return;
    const x = tab === 'cook' ? null : TIMERS.slice().sort((a, b) => a.end - b.end)[0];
    if (!x){ if (box.innerHTML) box.innerHTML = ''; return; }
    const left = (x.end - Date.now()) / 1000;
    box.innerHTML = `<button type="button" class="timer-float${left <= 0 ? ' ring' : ''}" data-act="goto-cook">⏱ ${esc(left <= 0 ? t('時間です') : fmtLeft(left))}${GAP()}${esc(x.name)}${TIMERS.length > 1 ? ` (+${TIMERS.length - 1})` : ''}</button>`;
}

function addIngredients(text){
    const found = extractIngredients(text);
    let added = 0;
    found.forEach(f => { if (!S.fridge.some(x => keyOf(x) === keyOf(f))){ S.fridge.push(f); added++; } });
    save();
    if (found.length) toast(added ? t('{list} を追加しました', {list:joinNames(found)}) : t('すでに登録されています'));
    else toast(t('食材の名前が読み取れませんでした'));

    const cc = currentCountry(), loc = SPEECH_CC[cc];

function startMic(targetId){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ toast(t('この端末では声の入力が使えません。文字で入力してください')); return; }
    // 聞いているボタンをもう一度押すと止める。もう一方のボタンを押したら、そちらの入力欄に切りかえて聞きなおす
    if (recog){ const same = recogTarget === (targetId || 'ing-input'); recog.switched = !same; stopMic(); if (same) return; }
    recogTarget = targetId || 'ing-input';
    const inp = document.getElementById(recogTarget);
    // すでに入力してある文字は消さず、聞き取った言葉をうしろに足す
    const before = inp ? inp.value.trim() : '', joinTo = x => before && x ? before + (LANG === 'ja' ? '、' : ', ') + x : (before || x);

        let finalText = '', gotResult = false, heard = '';

function refCountries(){

        ...((S.week && S.week.days) || []).map(x => x.id), ...((S.draft && S.draft.ids) || []), ...((S.cook && S.cook.ids) || [])].filter(Boolean).map(String));
    const out = new Set(), home = currentCountry();
    ids.forEach(id => {

    const cur = S.settings.country || guessCountry();
    const subOf = c => c.nameLocal === countryLabel(c) ? '' : countryLabel(c);
    return `<h2>${esc(t('国・地域を選んでください'))}</h2>
        <p class="muted small">${esc(t('選んだ国の家庭料理で、毎日の献立を提案します。あとから設定で変えられます。'))}</p>
        <div class="country-list">${COUNTRIES.map(c => `<button class="country${c.cc === cur ? ' on' : ''}" data-act="pick-country" data-cc="${c.cc}" ${c.cc === cur ? 'aria-current="true"' : ''}>
            <span class="fl" aria-hidden="true">${c.flag}</span><span class="nm" lang="${esc(c.lang)}">${esc(c.nameLocal)}</span><span class="sub">${esc(subOf(c))}</span></button>`).join('')}</div>
        ${S.settings.country ? `<button class="btn ghost" data-act="sheet-close">${esc(t('閉じる'))}</button>` : ''}`;
}
// 言語を切りかえたとき、作ってある案（ひとひねりの「変えたところ」など）を新しい言語で作り直す
function relocalize(){
    const re = r => r && r.isTwist ? buildTwist(r.id) : r;
    if (twistState.results) twistState.results = twistState.results.map(re).filter(Boolean);
    if (session.twist) session.twist = re(session.twist);
    if (session.menu) session.menu.items.forEach(x => { x.r = re(x.r); });
    if (modalId) renderModal();
}
function openCountrySheet(){ sheet = {kind:'country'}; renderSheet(); }
// ボタンでない要素（料理の行・名前など）に data-act があるときは、キーボードと読み上げでも押せるようにする（見た目は変えない）
function a11yActs(){
    document.querySelectorAll('[data-act]:not(button):not(a):not(input):not(select):not(textarea):not(label):not([role]):not(.modal)').forEach(el => {
        // 行の絵は同じ行の名前と同じ料理を開くので、Tab で二度止まらないよう読み上げとキーボードからは外す
        if (el.tagName === 'SPAN' && el.dataset.act === 'open' && el.parentElement && el.parentElement.querySelector(':scope > .info [data-act="open"]')){ el.setAttribute('role', 'presentation'); el.setAttribute('aria-hidden', 'true'); return; }
        el.setAttribute('role', 'button'); el.tabIndex = 0;
    });
}
new MutationObserver(a11yActs).observe(document.body, {childList:true, subtree:true});
document.addEventListener('keydown', e => { if (e.key === 'Tab'){ trapTab(e); return; } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]:not(button):not(a)')){ e.preventDefault(); e.target.click(); return; } if (e.key !== 'Escape') return; if (sheet && sheet.kind !== 'onboard' && !(sheet.kind === 'country' && !S.settings.country)) closeSheet(); else if (modalId) closeModal(); });
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
if (!S.settings.country && S.onboarded) S.settings.country = 'JP';   // 以前から使っている人は日本
// 「自動（国に合わせる）」だった人は、いま表示している言語に決める。これからは国を変えても言語は変わらない
if (S.settings.country && (S.settings.uiLang || 'auto') === 'auto'){ S.settings.uiLang = wantLang(); save(); }
(async () => {
    const cc = S.settings.country;
    if (cc && cc !== 'JP'){ try{ await loadPack(cc); }catch(e){ packFail = cc; S.settings.country = 'JP'; setTimeout(() => toast(t('この国のデータを読みこめませんでした。電波のあるところでもう一度開いてください')), 1500); } }
    await setLang(wantLang());
    await ensureTr(currentCountry());
    applyCountry(currentCountry());
    scheduleTrialReminder();
    loadRemote();
    setTab(tab);
    if (!S.settings.country) openCountrySheet();
    else if (!S.onboarded) startOnboard();
})();
if (!(S.usedDays || []).includes(TODAY)){ S.usedDays = [...(S.usedDays || []), TODAY].slice(-400); save(); }
// アプリを開いたまま日付をまたいだとき（画面に戻ってきたとき）に、今日の日付と献立を新しくする
function refreshToday(){
    const d = ymd(); if (d === TODAY) return;
    TODAY = d;
    if (!(S.usedDays || []).includes(TODAY)){ S.usedDays = [...(S.usedDays || []), TODAY].slice(-400); save(); }
    session.menu = null; session.countSalt = 0; session.rejected.clear();
    render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshToday(); });
window.addEventListener('focus', refreshToday);
(() => { const A = nativePlugin('App'); if (A && A.addListener) try{ A.addListener('resume', refreshToday); }catch(e){} })();
(() => { const r = rcInit(); if (r) r.then(P => P.getCustomerInfo()).then(res => applyCustomerInfo(res && res.customerInfo)).catch(() => {}); })();
if (PLAN.billingEnabled && !isSubscribed()) loadStorePrices();   // お試しの長さ・価格を、はじめの案内より先に読んでおく
loadGenerated().then(loadPhotos);
loadMine();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && document.querySelector('link[rel="manifest"]')){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
</script>
</body>
