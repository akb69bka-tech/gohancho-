// ---- 1週間プランをカレンダーに取りこむ .ics（RFC 5545。https://www.rfc-editor.org/rfc/rfc5545）----
// 作る日ごとに終日の予定を1つ（浮動時間や VTIMEZONE を使わない日付だけの予定）。作らない日・無料版で見えない日は出さない。UID は日付から決めるので、書き出し直して取りこんでも重ならず上書きされる
function icsEsc(s){ return String(s == null ? '' : s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r\n|\r|\n/g, '\\n'); }
// 75 オクテット（UTF-8）で折り返す。文字（サロゲートペア含む）の途中では切らない。続きの行は空白1つで始める
function icsFold(line){
    const enc = new TextEncoder(), out = []; let cur = '', n = 0, lim = 75;
    for (const ch of line){ const b = enc.encode(ch).length; if (n + b > lim){ out.push(cur); cur = ' '; n = 1; lim = 75; } cur += ch; n += b; }
    out.push(cur); return out.join('\r\n');
}
function icsStamp(d){ return d.toISOString().replace(/[-:]|\.\d{3}/g, ''); }
function weekIcs(now){
    const days = visiblePlanDays().filter(x => byId(x.id)); if (!days.length) return '';
    if (weekSidesOn()) ensureWeekExtras();
    const stamp = icsStamp(now || new Date()), dt = s => s.replace(/-/g, '');
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Gohancho//Week plan//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEsc(t('わが家のご飯帖'))];
    days.forEach(x => {
        const r = byId(x.id), one = (e, slot) => t('{slot}：{name}', {slot:slotLabel(slot), name:e.name + swapShare(e)}) + GAP() + t('{n}分', {n:(swappedRecipe(e) || e).min});
        const desc = [one(r, '主菜')];
        if (weekSidesOn() && x.extra) [['side', '副菜'], ['soup', '汁物']].forEach(([k, slot]) => { const e = byId(x.extra[k]); if (e) desc.push(one(e, slot)); });
        if (x.who) desc.push(t('担当：{name}', {name:x.who}));
        L.push('BEGIN:VEVENT', 'UID:gohancho-' + dt(x.d) + '@gohancho.app', 'DTSTAMP:' + stamp, 'DTSTART;VALUE=DATE:' + dt(x.d), 'DTEND;VALUE=DATE:' + dt(addDays(x.d, 1)),
            'SUMMARY:' + icsEsc(r.name), 'DESCRIPTION:' + icsEsc(desc.join('\n')), 'TRANSP:TRANSPARENT', 'END:VEVENT');
    });
    L.push('END:VCALENDAR');
    return L.map(icsFold).join('\r\n') + '\r\n';
}

/* =========================================================
   毎日のお知らせ（iPhone アプリ版のみ。端末の通知で献立を決める時間を知らせる）
   ========================================================= */
const NOTIFY_ID = 1001;          // 1週間プランがないときの、毎日くり返すお知らせ
const NOTIFY_DAY_ID = 1100;      // 1100〜1113: 今日から14日先までの、日ごとのお知らせ（プランの日は「今日は○○」）
const NOTIFY_DAYS = 14;
const NOTIFY_SHOP_ID = 1200;     // 1200〜1201: 買い物の前日のお知らせ（次の2回分）
const NOTIFY_TEST_ID = 1003;     // テスト通知
const NOTIFY_ALL = [NOTIFY_ID, ...Array.from({length:NOTIFY_DAYS}, (_, i) => NOTIFY_DAY_ID + i), NOTIFY_SHOP_ID, NOTIFY_SHOP_ID + 1];   // 合計17件（iOS の予約は最大64件）
var notifPerm = null, notifBusy = Promise.resolve(), notifSig = '', notifTimer = null;
// 通知に出す「主な材料」（調味料・常備品は除く）
function notifIngs(r){
    const out = [];
    (r.items || []).forEach(i => { if (i.opt || PANTRY.has(i.key)) return; const l = (/[\u0E00-\u0E7F]/.test(i.label) ? i.label.split(/\s+/)[0] : i.label.replace(/[（(][^）)]*[）)]/g, '')).trim(); if (l && !out.includes(l)) out.push(l); });
    return out.slice(0, 3);
}
// いま予約しておくべきお知らせの一覧（今日の献立をもう決めていたら、今日の分は出さない）
function notifBuild(now){
    const out = [], hour = S.settings.remind, days = visiblePlanDays().filter(x => byId(x.id));
    const at = (d, h) => { const x = parseYmd(d); x.setHours(h, 0, 0, 0); return x; };
    if (hour != null){
        const decidedToday = !!(S.cook && S.cook.d === TODAY);   // 今日はもう決めた日: くり返しをやめ、あしたからの分だけ個別に予約する
        const skipDays = new Set(S.week && S.week.days ? S.week.days.filter(y => y.skip).map(y => y.d) : []);
        const anySkip = [...skipDays].some(d => d >= TODAY && d <= addDays(TODAY, NOTIFY_DAYS - 1));
        // 献立を決めた日・「作らない」日がある間は、くり返し（毎日）にせず、決める日だけ個別に予約する（作らない日に「献立を決めましょう」が鳴らない）
        if (!days.length && (decidedToday || anySkip)){ for (let i = decidedToday ? 1 : 0; i < NOTIFY_DAYS; i++){ const d = addDays(TODAY, i), when = at(d, hour); if (when > now && !skipDays.has(d)) out.push({id:NOTIFY_DAY_ID + i, title:t('今日の献立を決めましょう'), body:t('おまかせで、主菜・副菜・汁ものをすぐに提案します。'), schedule:{at:when, allowWhileIdle:true}}); } }
        else if (!days.length) out.push({id:NOTIFY_ID, title:t('今日の献立を決めましょう'), body:t('おまかせで、主菜・副菜・汁ものをすぐに提案します。'), schedule:{on:{hour, minute:0}, allowWhileIdle:true}});
        else for (let i = 0; i < NOTIFY_DAYS; i++){
            const d = addDays(TODAY, i), when = at(d, hour);
            if (when <= now || (i === 0 && S.cook && S.cook.d === TODAY)) continue;
            if (S.week && S.week.days.some(y => y.d === d && y.skip)) continue;   // 作らない日は「献立を決めましょう」も出さない
            const x = days.find(y => y.d === d), r = x && byId(x.id);
            if (!r){ out.push({id:NOTIFY_DAY_ID + i, title:t('今日の献立を決めましょう'), body:t('おまかせで、主菜・副菜・汁ものをすぐに提案します。'), schedule:{at:when, allowWhileIdle:true}}); continue; }
            const min = dayDishes(x).reduce((a, y) => a + (Number(y.min) || 0), 0), ings = notifIngs(r);
            out.push({id:NOTIFY_DAY_ID + i, title:t('今日は{name}', {name:r.name}), body:[min ? t('{n}分', {n:min}) : '', ings.length ? t('材料チェック：{items}', {items:joinNames(ings)}) : ''].filter(Boolean).join(SLASH()) || t('おまかせで、主菜・副菜・汁ものをすぐに提案します。'), schedule:{at:when, allowWhileIdle:true}});
        }
    }
    const wd = S.settings.shopRemind;
    if (typeof wd === 'number' && wd >= 0 && wd <= 6){
        const last = days.length ? days[days.length - 1].d : '', todo = days.length ? shoppingList().filter(e => !shopDoneSet().has(e.key)) : [], n = todo.length;
        // 主な3品（いくつの料理に使うかの多い順）。かっこの中は省く。長い名前（文字数が多い・「AまたはB」）は途中で切らず、次の品に回す。なければ品名は出さない
        const top = []; todo.forEach(e => { const l = String(e.label).replace(/[（(][^）)]*[）)]/g, '').trim(), wide = /[\u1100-\u11ff\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/.test(l); if (l && Array.from(l).length <= (wide ? 8 : 14) && !SHOP_ALT.test(l) && !top.includes(l) && top.length < 3) top.push(l); });
        for (let k = 1, j = 0; k <= 21 && j < 2; k++){
            const shopDay = addDays(TODAY, k); if (parseYmd(shopDay).getDay() !== wd) continue;
            const when = at(addDays(shopDay, -1), 18); if (when <= now) continue;
            const has = n > 0 && shopDay <= last;
            out.push({id:NOTIFY_SHOP_ID + j++, title:t('明日は買い物の日です'), body:has ? [t('明日の分の買い物リストがあります（{n}品）', {n}), top.length ? t('主なもの：{items}', {items:joinNames(top)}) : ''].filter(Boolean).join(SLASH()) : t('1週間プランを作っておくと、買うものがまとまります。'), schedule:{at:when, allowWhileIdle:true}});
        }
    }
    return out;
}
// お知らせを予約しなおす（プラン・設定・時間が変わったとき、アプリを開いたとき・戻ったときに呼ぶ。前の予約は全部消してから入れる）
function syncNotifs(force){
    const P = nativePlugin('LocalNotifications'); if (!P) return Promise.resolve();
    return notifBusy = notifBusy.then(async () => {
        try{
            const perm = await P.checkPermissions(), prev = notifPerm; notifPerm = perm && perm.display;
            const list = notifPerm === 'granted' ? notifBuild(new Date()) : [];
            const sig = JSON.stringify(list.map(n => [n.id, n.title, n.body, n.schedule.at ? +n.schedule.at : n.schedule.on]));
            if (prev !== notifPerm && typeof tab !== 'undefined' && tab === 'settings') render();
            if (!force && sig === notifSig) return;
            await P.cancel({notifications: NOTIFY_ALL.map(id => ({id}))});
            if (list.length) await P.schedule({notifications: list});
            notifSig = sig;
        }catch(e){}
    });
}

}

    if (!items.length || items.some(x => !x.r) || items[0].slot !== '主菜') return false;
    const n = items.length, prevMood = session.mood;
    if (n >= 3 && n <= 4 && items.every(x => x.slot !== '汁物')) session.mood = 'bento';   // 汁ものなしの献立は「お弁当」の献立
    if ((S.settings.dishCount !== 'auto' && n !== menuCount() && !c.adj) || !composeOf(n) || composeOf(n).slots.join() !== items.map(x => x.slot).join()){ session.mood = prevMood; return false; }   // 品数を変えたら新しく作る（おまかせは日によって品数が変わるので、決めた献立をそのまま出す）

function onePseudo(text){

}
function oneSuggest(main, seen){
    const bento = session.mood === 'bento', kinds = main.type === '汁物' || bento ? ['副菜', '副菜', '副菜'] : ['副菜', '汁物', '副菜'];
    const fam = main.family && main.family !== '野菜' ? main.family : '';
    const inMenu = new Set(menuIds()), base = [{r: main}, ...seen.map(id => ({r: RECIPES.find(r => r.id === id) || byId(id)})).filter(x => x.r)];
    const out = [];

        const tried = []; let r = null;
        for (let k = 0; k < 6 && !r; k++){

}

// 「あと1品」で選んだ料理が、今日の献立のどこに入るか: fill = 空いた枠に入れる、add = 品数を1つ増やして入れる、replace = これ以上増やせないので、同じ種類の最後の料理とかえる
function oneWhere(r){

    const slot = slotOf(r) === '汁物' ? '汁物' : '副菜';
    const maxN = session.mood === 'bento' ? 4 : 5, lim = hasPro() ? 6 : PLAN.freeLimits.dishes;
    const empty = m.items.find(x => x.slot === slot && !x.r);
    if (empty) return {mode: 'fill', slot, empty};
    if (m.n < maxN && m.n + 1 <= lim && !(slot === '汁物' && m.items.some(x => x.slot === '汁物'))) return {mode: 'add', slot};
    let at = -1; m.items.forEach((x, i) => { if (x.slot === slot) at = i; });

    else if (w.mode === 'add'){
        // 空いた枠がない: 今日の献立だけ品数を1つ増やす（副菜は最後の副菜の次、汁ものは最後）。ほかの料理はそのまま・設定の品数（ふだんの品数）は変えない

function soonKeys(){ return new Set(S.fridge.filter(f => S.fridgeMeta[f] && S.fridgeMeta[f].soon).map(keyOf)); }

    const soon = soonKeys(), soonFirst = (a, b) => (soon.has(b) ? 1 : 0) - (soon.has(a) ? 1 : 0);

/* ---- 作り方（「この献立に決定」した料理の作り方を、料理ごとのタブで見る） ---- */
function cookItems(){
    const c = S.cook; if (!c || !c.ids) return [];
    return c.ids.map((id, i) => ({r: byId(id), slot: (c.slots || [])[i]})).filter(x => x.r);
}
// 決めた献立に、いまの食べる人（アレルギー・苦手な食材・辛いのが苦手）に合わない料理が残っているときの知らせ。
// 食べる人や苦手な食材を変えたあとも、決めた献立の中身は黙って変えない。知らせて、取り消して選び直せるようにする
function cookWarnHtml(){
    const c = S.cook; if (!c || c.d !== TODAY) return '';
    const bad = cookItems().filter(x => isAvoidedCore(x.r));
    if (!bad.length) return '';
    return `<div class="note warn cook-warn" role="alert"><span>${esc(t('決めた献立の「{names}」は、いま食べる人のアレルギー・苦手な食材・辛さに合いません。作る前に確かめるか、取り消して選び直してください。', {names: joinNames(bad.map(x => x.r.name))}))}</span><button class="btn sm" data-act="undo-decide">${esc(t('決めた献立を取り消す'))}</button></div>`;
}
/* ---- 食べる時刻から逆算（作り方の画面） ----
   食べたい時刻を入れると、決めた献立の「各料理に書かれた所要時間」だけから、作り始める目安を出す。
   確かに言えるのは 2 つの範囲だけ: 1品ずつ順に作れば合計（上限）／同時に進めても、いちばん時間のかかる1品の時間（下限）。
   待ち時間の中身や段取りは、料理の文章からは決めつけない。時刻は端末の中にだけ残る（S.settings.dinnerAt = 'HH:MM'） */
function clockText(d){
    try{ return new Intl.DateTimeFormat(dateLoc() + '-u-nu-latn', {hour:'numeric', minute:'2-digit'}).format(d); }catch(e){ return `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`; }
}
function eatPlanHtml(items){
    const rs = items.map(x => x.r);
    if (!rs.length || rs.some(r => !(Number(r.min) > 0))) return '';   // 時間がわからない料理があるときは、時間のことは言わない
    const at = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(S.settings.dinnerAt || '');
    const mins = rs.map(r => Number(r.min)), total = mins.reduce((a, b) => a + b, 0), mx = Math.max(...mins), longest = rs[mins.indexOf(mx)];
    const MIN = 60000, now = new Date();
    let eat = at ? new Date(now.getFullYear(), now.getMonth(), now.getDate(), +at[1], +at[2]) : null;
    if (eat && eat <= now && +at[1] < 4) eat = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, +at[1], +at[2]);   // 0時〜3時台の指定は、もう過ぎているなら「あすの未明」（夜の食事のあとの時刻）とみなす
    const end1 = new Date(now.getTime() + total * MIN), end2 = new Date(now.getTime() + mx * MIN), c = clockText;
    const lines = []; let nowLine = '';
    if (eat){
        const startBy = n => c(new Date(eat.getTime() - n * MIN));
        if (eat <= now) nowLine = t('いま{now}に始めると、1品ずつ順に作って{t1}ごろに終わります。同時に進めても{t2}より早くはなりません', {now:c(now), t1:c(end1), t2:c(end2)});
        else if (end1 <= eat){
            lines.push(t('{time}までに始めれば、1品ずつ順に作っても{eat}に間に合います（合計{n}分）', {time:startBy(total), eat:c(eat), n:total}));
            if (rs.length > 1) lines.push(t('同時に進めるなら、いちばん時間のかかる「{name}」が{n}分なので、{time}までには始めたいです', {name:longest.name, n:mx, time:startBy(mx)}));
        } else if (end2 <= eat){
            lines.push(t('1品ずつ順に作ると{time}ごろまでかかり、{eat}を過ぎます', {time:c(end1), eat:c(eat)}));
            lines.push(t('同時に進めるなら、いちばん時間のかかる「{name}」が{n}分なので、{time}までには始めたいです', {name:longest.name, n:mx, time:startBy(mx)}));
        } else lines.push(t('いま始めても、いちばん時間のかかる「{name}」が{n}分なので、{eat}には間に合いません（{time}ごろ）', {name:longest.name, n:mx, eat:c(eat), time:c(end2)}));
        if (rs.length > 1 && mins.some(m => m !== mx)){
            const order = items.map((x, i) => ({r:x.r, i})).sort((a, b) => (b.r.min - a.r.min) || (a.i - b.i)).map(x => x.r.name);
            lines.push(t('時間のかかる料理から始める順：{list}', {list:joinNames(order)}));
        }
    }
    if (!nowLine) nowLine = t('いま{now}に始めると、1品ずつ順に作って{t1}ごろに終わります。同時に進めても{t2}より早くはなりません', {now:c(now), t1:c(end1), t2:c(end2)});   // 食べる時刻を入れなくても、いま始めたらいつ終わるかは出す
    lines.push(nowLine);
    return `<details class="card eat-plan" ${(session.eatOpen === undefined ? at : session.eatOpen) ? 'open' : ''}><summary class="eat-sum"><span>${esc(t('食べる時刻から逆算'))}</span><span class="small muted">${esc(eat ? c(eat) : '')}</span></summary>
        <div class="row eat-row"><label class="small" for="eat-at">${esc(t('食べる時刻'))}</label><input type="time" id="eat-at" value="${at ? esc(at[0]) : ''}">${at ? `<button class="btn sm ghost" data-act="eat-clear">${esc(t('時刻を消す'))}</button>` : ''}</div>
        ${lines.map(l => `<p class="eat-line">${esc(l)}</p>`).join('')}${eat ? '' : `<p class="small muted">${esc(t('食べたい時刻を入れると、作り始める目安の時刻を出します。時間は、各料理に書かれた所要時間から数えています。'))}</p>`}
        ${lines.length ? `<p class="foot">${esc(t('料理ごとの所要時間の目安から数えています。実際の手順や待ち時間までは見ていません。'))}</p>` : ''}
    </details>`;
}

            ${thumbHtml(x.r)}<span class="ct-slot">${esc(slotLabel(x.slot || slotOf(x.r)))}</span><span class="ct-name">${esc(x.r.name)}</span>${(((S.cook.done || {})[x.r.id]) || []).length >= x.r.steps.length ? `<span class="ct-ok" aria-label="${esc(t('完了'))}">✓</span>` : ''}</button>`).join('')}</div>

/* 料理名・材料名での検索（冷蔵庫に登録しなくても、その食材を使う料理が出る） */
// 検索のことば: 区切り記号で分け、ラテン文字の言葉（pad thai・ground beef）は空白で分けずにひとかたまりで使う
function searchTerms(q){
    return String(q || '').split(/[、,，。・\/\n]+/).map(x => x.trim()).filter(Boolean).flatMap(seg => isLatinText(seg) ? [seg] : seg.split(/\s+/)).filter(Boolean);
}
// 料理名に当たるか: 表示の名前・元の名前（英語・その国の言葉・訳）・日本のレシピのよみ（ひらがな）のどれかに含まれれば当たり。
// 「しょうが焼き」のようにかなと漢字がまざる言葉は、かなの部分はよみ、漢字の部分は料理名に含まれれば当たり
// 料理ごとに、正規化した名前・材料名を1回だけ作っておく（検索のたびに数百品ぶんを norm し直さない）。名前・材料・よみが変わったら作り直す
const SEARCH_IDX = new WeakMap();
function searchIdx(r){
    const yomi = YOMI[r.id] || '';
    let e = SEARCH_IDX.get(r);
    if (!e || e.name !== r.name || e.en !== r.nameEn || e.alt !== r.alt || e.items !== r.items || e.n !== r.items.length || e.yomi !== yomi){
        // id もローマ字の料理名なので当てる（kr_bibimbap・nikujaga）
        const hay = [r.name, r.nameEn, ...(r.alt || [])].filter(Boolean).map(norm).join('|') + '|' + yomi + '|' + String(r.id).replace(/^[a-z]{2}_/, '').replace(/_/g, '');
        e = {name: r.name, en: r.nameEn, alt: r.alt, items: r.items, n: r.items.length, yomi, hay, labs: r.items.map(i => norm(i.label))};
        SEARCH_IDX.set(r, e);
    }
    return e;
}
function nameHit(r, tm){
    const hay = searchIdx(r).hay;
    if (hay.includes(tm)) return true;
    const runs = tm.match(/[ぁ-ゖー]+|[^ぁ-ゖー]+/g) || [];
    return runs.length > 1 && /[ぁ-ゖ]/.test(tm) && runs.every(x => hay.includes(x));
}
function searchRecipes(q){
    const raw = searchTerms(q);
    if (!raw.length) return {terms:[], hits:[]};
    const keys = extractIngredients(q).map(keyOf);
    const terms = raw.map(norm).filter(Boolean);
    const score = r => {
        let sc = 0;
        terms.forEach(tm => { if (nameHit(r, tm)) sc += 3; });
        keys.forEach(k => { if (r.items.some(i => i.key === k)) sc += i_main(r, k) ? 2 : 1; });
        const labs = searchIdx(r).labs;
        terms.forEach(tm => { if (r.items.some((i, ix) => labs[ix].includes(tm) || i.key.includes(tm))) sc += 1; });
        return sc;
    };
    const i_main = (r, k) => r.items.findIndex(i => i.key === k) < 3;
    const hits = RECIPES.filter(r => !isAvoided(r)).map(r => ({r, sc:score(r)})).filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc).map(x => x.r);
    return {terms:raw, hits};
}
function searchResultsHtml(q){
    if (!String(q || '').trim()) return '';
    const {terms, hits} = searchRecipes(q);
    // 料理名（肉じゃが・ハンバーグ・麻婆）だけを入れたときは、それを食材として冷蔵庫に入れる案は出さない
    const ings = extractIngredients(q).filter(x => !S.fridge.some(f => keyOf(f) === keyOf(x)))
        .filter(x => canonOf(x) || !RECIPES.some(r => nameHit(r, norm(x))));
    const addBtn = ings.length ? `<div class="row"><button class="btn sm" data-act="search-to-fridge" data-v="${esc(ings.join('、'))}">${esc(t('{list} を冷蔵庫の材料に追加', {list:joinNames(ings)}))}</button></div>` : '';
    if (!hits.length) return `<div class="list"><div class="empty">${esc(t('見つかりませんでした。別の言い方や、食材の名前だけで試してください'))}</div></div>${addBtn}`;
    const shown = hits.slice(0, 30);
    return `<div class="sec-head"><h3>${esc(t('「{q}」の料理', {q:terms.join(LANG === 'ja' ? '、' : ', ')}))}</h3><span class="hint">${esc(t('{n}品', {n:hits.length}))}</span></div>
    <div class="list">${shown.map(r => `<div class="match">
        <span data-act="open" data-id="${esc(r.id)}">${thumbHtml(r)}</span>

            <div class="head" data-act="open" data-id="${esc(r.id)}"><span class="name">${esc(r.name)}</span></div>
            <div class="ings">${swappedRecipe(r).items.slice(0, 6).map(i => esc(i.label)).join(t('・'))}${r.items.length > 6 ? esc(t(' など')) : ''}</div>
            <div class="small muted">${esc(metaLine(r))} ${badges(r)}${swapLineHtml(r)}</div>
        </div></div>`).join('')}</div>${hits.length > shown.length ? `<p class="foot">${esc(t('上位{n}品を表示しています。食材を足すと絞りこめます', {n:shown.length}))}</p>` : ''}${addBtn}`;
}

    text = String(text); if (!lang) return esc(text);

    termFind(text, lang).forEach(h => {

// タイマーは端末に残す（iPhone はアプリを裏で閉じることがあるので、開き直しても続きから数える。終わって10分たったものは消す）
let TIMERS = (() => { try{ return (JSON.parse(localStorage.getItem('gohancho.timers') || '[]') || []).filter(x => x && x.end > Date.now() - 600000); }catch(e){ return []; } })(), timerTick = 0;
function saveTimers(){ try{ localStorage.setItem('gohancho.timers', JSON.stringify(TIMERS)); }catch(e){} }
if (TIMERS.length) setTimeout(() => { timerTick = setInterval(tickTimers, 1000); }, 0);
function fmtLeft(s){ s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
const TIMER_FOLD = 3;   // 3つ以上動いているときは「⏱ ×3」にまとめる（タップで開く）
function timerItemHtml(x){
    const left = (x.end - Date.now()) / 1000;
    return `<div class="timer${left <= 0 ? ' ring' : ''}" data-tid="${x.id}" role="timer"><span class="tm">${esc(left <= 0 ? t('時間です') : fmtLeft(left))}</span><span class="tn">${esc(x.name)}${GAP()}${esc(x.label)}</span><button type="button" class="x" data-act="timer-stop" data-tid="${x.id}" aria-label="${esc(t('タイマーを止める'))}">×</button></div>`;
}
function timerSoonest(){ return TIMERS.reduce((a, x) => !a || x.end < a.end ? x : a, null); }
function timersHtml(){
    if (TIMERS.length < TIMER_FOLD) return TIMERS.map(timerItemHtml).join('');
    const open = !!session.timersOpen, n = TIMERS.length, nx = timerSoonest(), left = nx ? (nx.end - Date.now()) / 1000 : 0;
    const head = `<button type="button" class="timer-sum${TIMERS.some(x => x.end <= Date.now()) ? ' ring' : ''}" data-act="timers-toggle" aria-expanded="${open}" aria-label="${esc(t('タイマー{n}つ', {n}))}">⏱ ×${n}<span class="tm">${esc(left <= 0 ? t('時間です') : fmtLeft(left))}</span><span class="tg" aria-hidden="true">${open ? '▲' : '▼'}</span></button>`;

// iPhone アプリが裏にあるときも終わりを知らせるため、端末の通知を終了時刻に予約する（ID は 2000〜2009）
let timerPermAsked = false;
async function timerNotifyPerm(P){
    try{
        let perm = await P.checkPermissions();
        if (perm && (perm.display === 'prompt' || perm.display === 'prompt-with-rationale')) perm = await P.requestPermissions();
        if (perm && perm.display === 'granted') return true;
    }catch(e){}
    if (!timerPermAsked){ timerPermAsked = true; toast(t('通知が許可されていません。iPhone の「設定」→「ご飯帖」→「通知」で許可してください')); }
    return false;
}
async function scheduleTimerNotify(x){
    const P = nativePlugin('LocalNotifications'); if (!P || !x.nid) return;
    try{
        if (!(await timerNotifyPerm(P))) return;
        await P.schedule({notifications:[{id: x.nid, title: t('{name}のタイマーが終わりました', {name:x.name}), body: x.label, schedule:{at: new Date(x.end), allowWhileIdle:true}}]});
    }catch(e){}
}
function cancelTimerNotify(x){
    const P = nativePlugin('LocalNotifications'); if (!P || !x || !x.nid) return;
    try{ Promise.resolve(P.cancel({notifications:[{id: x.nid}]})).catch(() => {}); }catch(e){}
}
function startTimer(sec, name, label, rid, k){
    // 同じ手順の同じ時間のボタンをもう一度押したら、増やさずに今のタイマーをやり直す
    const dup = TIMERS.find(x => x.sec === sec && (rid ? x.rid === rid && x.k === k : !x.rid && x.name === name && x.label === label));
    if (dup){
        cancelTimerNotify(dup); dup.end = Date.now() + sec * 1000; dup.rang = false;
        saveTimers(); clearInterval(timerTick); timerTick = setInterval(tickTimers, 1000);
        const box = $('#cook-timers'); if (box) box.innerHTML = timersHtml();
        floatTimer(); scheduleTimerNotify(dup); toast(t('タイマーをやり直しました')); return;
    }
    const used = new Set(TIMERS.map(x => x.nid));
    let nid = 2000; while (used.has(nid)) nid++;
    const x = {id: Date.now() + Math.random().toString(36).slice(2, 6), end: Date.now() + sec * 1000, sec, name, label, rid: rid || '', k: k == null ? -1 : k, rang: false, nid};
    TIMERS.push(x);
    if (TIMERS.length > 5) cancelTimerNotify(TIMERS.shift());
    saveTimers(); clearInterval(timerTick); timerTick = setInterval(tickTimers, 1000);
    const box = $('#cook-timers'); if (box) box.innerHTML = timersHtml();
    scheduleTimerNotify(x);
}
function stopTimer(id){
    cancelTimerNotify(TIMERS.find(x => x.id === id));
    TIMERS = TIMERS.filter(x => x.id !== id); saveTimers();
    const box = $('#cook-timers'); if (box) box.innerHTML = timersHtml();
    floatTimer();
}
// 文字の中身だけ書きかえる（要素を作り直さない・MutationObserver を起こさない）
function setText(el, s){ const n = el.firstChild; if (n && n.nodeType === 3 && !n.nextSibling){ if (n.data !== s) n.data = s; } else el.textContent = s; }
function tickTimers(){
    floatTimer();
    if (!TIMERS.length){ clearInterval(timerTick); timerTick = 0; return; }
    let live = false;   // まだ鳴っていないタイマーがあるか。全部鳴り終わったら、毎秒の更新をやめる
    TIMERS.forEach(x => {
        const left = (x.end - Date.now()) / 1000;
        if (left > 0) live = true;
        if (left <= 0 && !x.rang){ x.rang = true; saveTimers(); toast(t('{name}のタイマーが終わりました', {name:x.name})); if (hf.on){ hfListenStop(); voiceSay(t('{name}のタイマーが終わりました', {name:x.name}), hfListen); } try{ if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 400]); }catch(e){} }
        const el = document.querySelector(`.timer[data-tid="${x.id}"]`);
        if (el){ el.classList.toggle('ring', left <= 0); setText(el.querySelector('.tm'), left <= 0 ? t('時間です') : fmtLeft(left)); }
    });
    const sum = document.querySelector('.timer-sum');
    if (sum){ const nx = timerSoonest(), lf = nx ? (nx.end - Date.now()) / 1000 : 0; sum.classList.toggle('ring', TIMERS.some(x => x.end <= Date.now())); setText(sum.querySelector('.tm'), lf <= 0 ? t('時間です') : fmtLeft(lf)); }
    if (!live){ clearInterval(timerTick); timerTick = 0; floatTimer(); }
}

// 作り方タブの外にいるときも、動いているタイマーを下に小さく出す（押すと作り方タブへ）
function floatTimer(){
    const box = $('#timer-float'); if (!box) return;
    const x = tab === 'cook' ? null : TIMERS.slice().sort((a, b) => a.end - b.end)[0];
    if (!x){ if (box.innerHTML) box.innerHTML = ''; box._k = ''; return; }
    const left = (x.end - Date.now()) / 1000;
    const txt = left <= 0 ? t('時間です') : fmtLeft(left);
    // 毎秒 innerHTML を作り直さない。タイマーの組み合わせが同じなら、秒数の文字だけ書きかえる
    const k = [x.id, x.name, TIMERS.length, left <= 0, LANG].join('|');
    const sp = box._k === k && box.firstElementChild ? box.querySelector('.tf-t') : null;
    if (sp){ setText(sp, txt); return; }
    box._k = k;
    box.innerHTML = `<button type="button" class="timer-float${left <= 0 ? ' ring' : ''}" data-act="goto-cook" data-id="${esc(x.rid || '')}" data-name="${esc(x.name)}">⏱ <span class="tf-t">${esc(txt)}</span>${GAP()}${esc(x.name)}${TIMERS.length > 1 ? ` (+${TIMERS.length - 1})` : ''}</button>`;
}

    found.forEach(f => { if (!S.fridge.some(x => keyOf(x) === keyOf(f))){ S.fridge.push(f); added++; } });

}

    KR:'ko-KR', TH:'th-TH', VN:'vi-VN', ID:'id-ID', PH:'fil-PH', MX:'es-MX', BR:'pt-BR', PE:'es-PE'};
function speechLocale(){
    if (PACK && PACK.speechLang) return PACK.speechLang;
    // 国の言葉で話すときは、その国の言い方（メキシコ・ペルーのスペイン語、エジプトのアラビア語など）で聞き取る
    const cc = currentCountry(), loc = SPEECH_CC[cc];
    if (loc && loc.split('-')[0] === LANG.split('-')[0]) return loc;
    if (LANG === 'en' && ['US', 'GB', 'IN', 'PH'].includes(cc)) return 'en-' + cc;
    const m = {ja:'ja-JP', en:'en-US', fr:'fr-FR', de:'de-DE', it:'it-IT', es:'es-ES', 'pt-BR':'pt-BR', pl:'pl-PL', tr:'tr-TR', ar:'ar-SA', hi:'hi-IN', id:'id-ID', fil:'fil-PH', th:'th-TH', 'zh-Hans':'zh-CN', 'zh-Hant':'zh-TW', ko:'ko-KR', vi:'vi-VN'};
    return m[LANG] || navigator.language || 'en-US';
}
function micButtons(){ return [...document.querySelectorAll('[data-act="mic"]')]; }
function micIdle(){
    clearTimeout(recogTimer); recogTimer = 0;
    micButtons().forEach(b => { b.textContent = t('声で入力'); b.classList.remove('listening'); b.setAttribute('aria-pressed', 'false'); });
    recog = null;
}
function stopMic(){ if (recog){ try{ recog.stop(); }catch(e){} } micIdle(); }
// 声で入力: 聞き取った文字を入力欄に入れ、食材が読み取れたら追加（材料欄）または検索（検索欄）。
// 直した点: 入力欄の文字を消さない（画面全体を描き直さない）、聞き取りが複数に分かれても全部つなぐ、
//           途中経過を入力欄に見せる、終了イベントが来ない端末でも12秒で止める、言語は画面の言語に合わせる。
function startMic(targetId){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){ toast(t('この端末では声の入力が使えません。文字で入力してください')); return; }
    // 聞いているボタンをもう一度押すと止める。もう一方のボタンを押したら、そちらの入力欄に切りかえて聞きなおす
    if (recog){ const same = recogTarget === (targetId || 'ing-input'); recog.switched = !same; stopMic(); if (same) return; }
    recogTarget = targetId || 'ing-input';
    const inp = document.getElementById(recogTarget);
    // すでに入力してある文字は消さず、聞き取った言葉をうしろに足す
    const before = inp ? inp.value.trim() : '', joinTo = x => before && x ? before + (LANG === 'ja' ? '、' : ', ') + x : (before || x);
    try{
        const me = recog = new SR(); recog.lang = speechLocale(); recog.interimResults = true; recog.maxAlternatives = 1; recog.continuous = false;
        let finalText = '', gotResult = false, heard = '';
        micButtons().forEach(b => { if (b.dataset.target === recogTarget){ b.textContent = t('聞いています…（タップで止める）'); b.classList.add('listening'); b.setAttribute('aria-pressed', 'true'); } });
        recog.onresult = e => {
            if (me.switched) return;
            let interim = ''; finalText = '';
            for (let i = 0; i < e.results.length; i++){ const r = e.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
            heard = (finalText + interim).replace(/[。．.]+$/g, '').trim();
            if (inp) inp.value = joinTo(heard);
            if (finalText){ gotResult = true; commitSpeech(joinTo(finalText.replace(/[。．.]+$/g, '').trim())); }
        };
        recog.onerror = e => {
            if (e.error === 'aborted' || me.switched) return;
            toast(e.error === 'not-allowed' || e.error === 'service-not-allowed' ? t('マイクが使えませんでした。文字で入力してください') : t('聞き取れませんでした。もう一度どうぞ'));
        };
        recog.onend = () => { if (me.switched) return; if (!gotResult && heard) commitSpeech(joinTo(heard)); if (recog === me) micIdle(); };
        recog.start();
        recogTimer = setTimeout(() => { if (recog === me) stopMic(); }, 12000);
    }catch(e){ console.warn('mic', e); micIdle(); toast(t('マイクが使えませんでした。文字で入力してください')); }
}
function commitSpeech(text){
    text = String(text).replace(/[。．.]+$/g, '').trim(); if (!text) return;
    const inp = document.getElementById(recogTarget);
    if (recogTarget === 'search-input'){ if (inp) inp.value = text; runSearch(text); return; }
    const found = extractIngredients(text);
    if (!found.length){ if (inp) inp.value = text; toast(t('食材の名前が読み取れませんでした。文字を直して「追加」を押してください')); return; }
    addIngredients(text);
    const keep = $('#search-input') ? $('#search-input').value : '';
    render();
    const si = $('#search-input'); if (si && keep){ si.value = keep; runSearch(keep); }
}

const BACKUP_VER = 1, BACKUP_MAX = 12e6, UNDO_KEY = 'gohancho.undo';
// 文字を読んで、ご飯帖のデータか確かめる。{ok, d, newer} か {ok:false, reason: 'empty'|'big'|'broken'|'notmine'}
function parseBackup(txt){
    if (typeof txt !== 'string') return {ok:false, reason:'broken'};
    txt = txt.replace(/^﻿/, '').trim();
    if (!txt) return {ok:false, reason:'broken'};
    if (txt.length > BACKUP_MAX) return {ok:false, reason:'big'};
    let d; try{ d = JSON.parse(txt, (k, v) => k === '__proto__' ? undefined : v); }catch(e){ return {ok:false, reason:'broken'}; }
    if (!d || typeof d !== 'object' || Array.isArray(d)) return {ok:false, reason:'notmine'};
    // ご飯帖のデータの目印: 記録・お気に入りなどの配列、または設定（古い版は history だけでなく項目が少ない）
    const A = ['history','favs','fridge','savedMenus','custom','family','staples','leftovers','spend','hidden','usedDays'];
    const known = A.some(k => Array.isArray(d[k])) || (d.settings && typeof d.settings === 'object' && !Array.isArray(d.settings) && Object.keys(d.settings).length > 0) || (d.week && typeof d.week === 'object' && Array.isArray(d.week.days));
    if (!known) return {ok:false, reason:'notmine'};
    const v = d._gohancho && Number(d._gohancho.v);
    return {ok:true, d, newer: Number.isFinite(v) && v > BACKUP_VER};
}
function importErrMsg(from){
    return importErr === 'notmine' ? t('ご飯帖のデータではないようです') : importErr === 'big' ? t('ファイルが大きすぎて読み込めません')
        : from === 'file' ? t('ファイルが壊れているか、空のようです。書き出したときのファイルをそのまま選んでください') : t('読み込めませんでした。コピーした文字をそのまま貼りつけてください');
}
// 読みこむ前に中身を確かめて、置き換えの確認を出す（貼りつけ・ファイル共通）。読めないときは false（理由は importErr）
function askImport(txt, from){
    const r = parseBackup(txt); importErr = r.ok ? '' : r.reason; if (!r.ok) return false;
    pendingConfirm = 'import'; importBuffer = txt; importFrom = from; render(); keepDetailsOpen(); return true;
}
// 読みこんだデータをこの端末の状態にする。購入の状態・無料期間の始まり・バックアップの日付は、この端末のものを残す（古いバックアップで購入が消えたり、貼った文字で開いたりしないように）
function applyImported(d){
    const keep = {pro: S.pro, firstUse: S.firstUse, monitor: S.monitor, trialKept: S.trialKept, lastBackup: S.lastBackup, backupSnooze: S.backupSnooze};
    Object.keys(keep).forEach(k => { if (keep[k] === undefined) delete keep[k]; });
    const st = Object.assign(normalizeState(d), keep);
    if (!st.settings.country && st.onboarded) st.settings.country = 'JP';   // 国を選ぶ前の版のデータは日本
    for (let i = RECIPES.length-1; i >= 0; i--) if (isCustomId(RECIPES[i].id)) RECIPES.splice(i,1);
    st.custom.forEach(r => { try{ if (!RECIPES.find(x => x.id === r.id)) RECIPES.push(prepCustom(r)); }catch(e){} });
    return st;
}
// 読み込む前の状態を1世代だけ控える（端末の空きがなければ控えられない。そのときは何も言わず、読み込みは続ける）
function saveUndo(){ try{ localStorage.setItem(UNDO_KEY, JSON.stringify({t: Date.now(), d: TODAY, data: S})); }catch(e){} }
function loadUndo(){ try{ const u = JSON.parse(localStorage.getItem(UNDO_KEY) || 'null'); return u && u.data && typeof u.data === 'object' && !Array.isArray(u.data) ? u : null; }catch(e){ return null; } }
// データの中身（件数）の要約。読みこむデータにも、いまのデータにも使う
function stateSummary(d){
    const c = countryOf(d.settings.country || 'JP'), wk = d.week ? d.week.days : [], skip = wk.filter(x => x.skip).length, who = wk.filter(x => x.who).length;
    const a = [t('記録{n}件', {n: d.history.length}), t('お気に入り{n}件', {n: d.favs.length}), t('自作レシピ{n}件', {n: d.custom.length}), t('保存した献立{n}件', {n: d.savedMenus.length})];
    if (d.family.length) a.push(t('家族{n}人', {n: d.family.length}));
    if (d.fridge.length) a.push(t('冷蔵庫の食材{n}品', {n: d.fridge.length}));
    if (d.leftovers.length) a.push(t('作り置きメモ{n}件', {n: d.leftovers.length}));
    if (d.spend.length) a.push(t('食費メモ{n}件', {n: d.spend.length}));
    if (wk.length) a.push(t('1週間の予定{n}日分', {n: wk.length}) + (skip ? t('（作らない日{n}日）', {n: skip}) : '') + (who ? t('（担当を決めた日{n}日）', {n: who}) : ''));
    a.push(c.flag + ' ' + countryLabel(c));
    return a.join(t('・'));
}
function importSummary(){ try{ const r = parseBackup(importBuffer); return r.ok ? stateSummary(normalizeState(r.d)) : ''; }catch(err){ return ''; } }
function importNewer(){ try{ const r = parseBackup(importBuffer); return r.ok && r.newer; }catch(err){ return false; } }
// バックアップのお知らせ: 記録などがあるのに、最後の書き出し（なければ使いはじめ）から30日以上たち、「あとで」も押していないとき
function backupDue(){
    const has = S.history.length >= 3 || S.favs.length || S.custom.length || S.savedMenus.length || S.family.length;
    if (!has) return false;
    const base = S.lastBackup || S.firstUse; if (!base) return false;
    if (daysBetween(base, TODAY) < 30) return false;   // 端末の日付を過去に戻されたとき: 書き出した日が「未来」になるが、日付が直れば普通に数える
    const sn = S.backupSnooze;
    return !(sn && daysBetween(sn, TODAY) < 14 && sn <= TODAY);   // 「あとで」の日が未来（日付を戻された）なら、その分は無視して出す
}
function backupNoteHtml(){
    if (!backupDue()) return '';
    const msg = S.lastBackup ? t('最後に書き出してから{n}日たちました。機種変更や削除に備えて、ファイルに書き出しておくと安心です。', {n: daysBetween(S.lastBackup, TODAY)}) : t('記録はこの端末の中だけにあります。機種変更や削除に備えて、ファイルに書き出しておくと安心です。');
    return `<div class="note trial-note" role="note"><span dir="auto">${esc(msg)}</span><button class="btn sm" data-act="export-file">${esc(t('ファイルで書き出す'))}</button><button class="btn sm ghost" data-act="backup-snooze">${esc(t('あとで'))}</button></div>`;
}

function countryOf(cc){ return COUNTRIES.find(c => c.cc === cc) || COUNTRIES[0]; }
// 国の名前を画面の言語で（日本語は nameJa、その国の言葉なら nameLocal、ほかは端末の Intl。使えなければ英語名）
const REGION_NAMES = {};   // 言語 → Intl.DisplayNames（使い回す）
function countryLabel(c){
    if (LANG === 'ja') return c.nameJa;
    if (c.lang === LANG) return c.nameLocal;
    try{ const dn = REGION_NAMES[LANG] || (REGION_NAMES[LANG] = new Intl.DisplayNames([LANG], {type:'region'})); const n = dn.of(c.cc); if (n && n !== c.cc) return n; }catch(e){}
    return c.name;
}
function currentCountry(){ return S.settings.country || 'JP'; }
function guessCountry(){
    try{
        const langs = navigator.languages || [navigator.language];
        for (const l of langs){
            const m = String(l).match(/-([A-Z]{2})\b/i); if (m && COUNTRIES.some(c => c.cc === m[1].toUpperCase())) return m[1].toUpperCase();
            const base = String(l).split('-')[0].toLowerCase();
            const hit = COUNTRIES.find(c => c.lang.split('-')[0] === base); if (hit) return hit.cc;
        }
    }catch(e){}
    return 'JP';
}
function loadPack(cc){
    if (cc === 'JP' || PACKS[cc]) return Promise.resolve(PACKS[cc] || null);
    return loadScript(assetUrl(`packs/${cc.toLowerCase()}.js`), () => PACKS[cc]).then(good => { if (good) return PACKS[cc]; throw new Error('pack'); });
}

function packRecipe(pk, x, tr){

    const jv = [];

    jv.sort((a, b) => b.v.length - a.v.length || a.o - b.o);

    Object.keys(aliases).forEach(k => {
        const n = norm(names[k] || ''); if (!n || /[a-z]/.test(n)) return;
        const hit = jv.find(x => n.includes(x.v)); if (!hit) return;
        const sc = jv.some(x => x.c === hit.c && x.v === n) ? 0 : n.length;
        if (!best[hit.c] || sc < best[hit.c].sc) best[hit.c] = {k, sc};

    JP_DATA.canon.forEach(([c, vs]) => { const b = best[c]; if (b) aliases[b.k] = [...aliases[b.k], c, ...vs]; });

    const old = currentCountry();

    try{ await loadPack(cc); }catch(e){ toast(t('この国のデータを読みこめませんでした')); return false; }
    packFail = null;
    if (old !== cc){
        S.countryData = S.countryData || {};
        S.countryData[old] = {fridge: S.fridge, fridgeMeta: S.fridgeMeta, staples: S.staples, avoid: S.settings.avoid, scarce: scarceList()};
        const d = S.countryData[cc] || {};
        S.fridge = d.fridge || []; S.fridgeMeta = d.fridgeMeta || {}; S.staples = d.staples || []; S.settings.avoid = d.avoid || []; S.settings.scarce = d.scarce || [];
        S.week = null;
    }
    S.settings.country = cc;
    // 表示する言語は、はじめに国を選んだときに決めて、あとで国を変えてもそのままにする（ほかの国の料理も、この言語の訳があれば訳して出す）
    if (first && (S.settings.uiLang || 'auto') === 'auto') S.settings.uiLang = cc === 'JP' ? (deviceLang() || 'ja') : wantLang();   // 日本を選んでも、端末が日本語でなければ端末の言語のまま（日本の料理には英語の訳がある）
    save();
    await setLang(wantLang());
    await ensureTr(cc);
    applyCountry(cc);
    // はじめて選ぶ国では、その国の家庭にふつうある食材（卵・玉ねぎ・米など）を「いつも家にある」に入れておく（はじめての設定ですべて表示して外せる）
    if (PACK && fresh && !S.staples.length){ S.staples = STAPLE_QUICK.slice(); save(); }
    if (first){ if (!S.trialKept) S.firstUse = TODAY; delete S.trialKept; save(); }   // 無料期間は国を選んで使いはじめた日から（データを消してやり直したときは、はじめの日のまま）
    return true;
}
/* ---- 主食（国ごとに選べる。最初の項目がその国のふだんの主食。なしも選べる） ----

    GB: [{k:'bread', img:'gb_staple', en:'Bread and butter', local:'Bread and butter', ja:'パンとバター'}, {k:'potatoes', img:'st_potatoes', en:'Boiled new potatoes', local:'Boiled new potatoes', ja:'ゆでた新じゃが'}, {k:'rice', img:'br_staple', en:'White rice', local:'White rice', ja:'白ご飯'}],
    FR: [{k:'default'}, {k:'potatoes', img:'st_potatoes', en:'Steamed potatoes', local:'Pommes de terre vapeur', ja:'蒸しじゃがいも'}, {k:'rice', img:'br_staple', en:'White rice', local:'Riz blanc', ja:'白ご飯'}],
    DE: [{k:'default'}, {k:'rolls', img:'st_rolls', en:'Bread rolls', local:'Brötchen', ja:'ブレートヒェン（小型パン）'}, {k:'potatoes', img:'st_potatoes', en:'Boiled potatoes', local:'Salzkartoffeln', ja:'ゆでじゃがいも'}],
    IT: [{k:'default'}, {k:'polenta', img:'st_polenta', en:'Polenta', local:'Polenta', ja:'ポレンタ'}],
    ES: [{k:'default'}, {k:'rice', img:'br_staple', en:'White rice', local:'Arroz blanco', ja:'白ご飯'}, {k:'potatoes', img:'st_potatoes', en:'Boiled potatoes', local:'Patatas cocidas', ja:'ゆでじゃがいも'}],
    PL: [{k:'default'}, {k:'potatoes', img:'st_potatoes', en:'Boiled potatoes', local:'Ziemniaki z wody', ja:'ゆでじゃがいも'}, {k:'kasza', img:'st_kasza', en:'Buckwheat groats', local:'Kasza gryczana', ja:'そばの実のカーシャ'}],

    CN: [{k:'default'}, {k:'mantou', img:'st_mantou', en:'Mantou (steamed buns)', local:'馒头', ja:'マントウ（蒸しパン）'}],
    TW: [{k:'default'}, {k:'mantou', img:'st_mantou', en:'Mantou (steamed buns)', local:'饅頭', ja:'マントウ（蒸しパン）'}],
    KR: [{k:'default'}, {k:'japgok', img:'st_japgok', en:'Multigrain rice', local:'잡곡밥', ja:'雑穀ご飯（チャプコッパプ）'}],
    TH: [{k:'default'}, {k:'sticky', img:'st_sticky', en:'Sticky rice', local:'ข้าวเหนียว', ja:'もち米（カオニャオ）'}],
    VN: [{k:'default'}, {k:'banhmi', img:'st_banhmi', en:'Bánh mì (baguette)', local:'Bánh mì', ja:'バインミー（パン）'}],
    ID: [{k:'default'}, {k:'merah', img:'st_genmai', en:'Red rice', local:'Nasi merah', ja:'赤米ご飯'}],
    PH: [{k:'default'}, {k:'sinangag', img:'st_garlicrice', en:'Garlic fried rice', local:'Sinangag', ja:'ガーリックライス'}, {k:'pandesal', img:'st_pandesal', en:'Pandesal (bread rolls)', local:'Pandesal', ja:'パンデサル（丸パン）'}],
    MX: [{k:'default'}, {k:'flour', img:'st_flourtort', en:'Flour tortillas', local:'Tortillas de harina', ja:'小麦粉のトルティーヤ'}, {k:'bolillo', img:'st_bolillo', en:'Bolillo rolls', local:'Bolillos', ja:'ボリーリョ（小型パン）'}],
    BR: [{k:'default'}, {k:'feijao', img:'st_ricebeans', en:'Rice and beans', local:'Arroz e feijão', ja:'ご飯と豆の煮もの'}, {k:'pao', img:'st_rolls', en:'Bread rolls', local:'Pão francês', ja:'パン（パン・フランセス）'}],
    PE: [{k:'default'}, {k:'papas', img:'st_potatoes', en:'Boiled potatoes', local:'Papas sancochadas', ja:'ゆでじゃがいも'}],

// アメリカ・イギリスは、主菜にじゃがいもやパンが添えてあることが多いので、はじめは「なし」
const STAPLE_NONE_FIRST = ['US', 'GB'];
// 国の主食の選択肢（最後に「なし」）。default はその国のパックの主食（日本語の名前は翻訳パックにあればそれ）
function stapleOptions(cc = currentCountry()){
    const list = (STAPLE_CHOICES[cc] || []).map(o => {
        if (o.k !== 'default') return o;
        const st = PACK && PACK.country === cc ? PACK.staple : (PACKS[cc] && PACKS[cc].staple);
        if (!st) return null;
        const ja = (PACK_TR[cc + '.ja'] || {}).staple;
        return {k:'default', img: st.id, en: st.name, local: st.local || st.name, ja: ja || st.local || st.name};
    }).filter(Boolean);
    return list.concat([{k:'none'}]);
}
function stapleName(o){
    if (!o || o.k === 'none') return tc('staple', 'なし');
    if (o.key) return ({rice:t('白ご飯'), genmai:t('玄米ご飯'), zakkoku:t('雑穀ご飯'), toast:t('パン（トースト）')})[o.k] || o.key;
    const lang = PACK && PACK.lang;
    return LANG === 'ja' ? (o.ja || o.en) : LANG === lang ? (o.local || o.en) : o.en;
}
function currentStapleOpt(cc = currentCountry()){
    const opts = stapleOptions(cc), want = (S.settings.stapleBy || {})[cc] || (STAPLE_NONE_FIRST.includes(cc) ? 'none' : '');
    return opts.find(o => o.k === want) || opts[0];
}
function setStaple(k){
    const cc = currentCountry(); S.settings.stapleBy = Object.assign({}, S.settings.stapleBy, {[cc]: k}); save();
}
// お膳に出す主食（なしなら null）。{id: 絵の ID, name}
function stapleSpot(){
    const o = currentStapleOpt();
    return o && o.k !== 'none' ? {id: o.img, name: stapleName(o), k: o.k} : null;
}
function countrySheetHtml(){
    const cur = S.settings.country || guessCountry();
    const subOf = c => c.nameLocal === countryLabel(c) ? '' : countryLabel(c);
    return `<h2>${esc(t('国・地域を選んでください'))}</h2>
        <p class="muted small">${esc(t('選んだ国の家庭料理で、毎日の献立を提案します。あとから設定で変えられます。'))}</p>
        <div class="country-list">${(S.settings.country ? COUNTRIES : [...COUNTRIES].sort((a, b) => (b.cc === cur) - (a.cc === cur))).map(c => `<button class="country${c.cc === cur ? ' on' : ''}" data-act="pick-country" data-cc="${c.cc}" ${c.cc === cur ? 'aria-current="true"' : ''}>
            <span class="fl" aria-hidden="true">${c.flag}</span><span class="nm" lang="${esc(c.lang)}">${esc(c.nameLocal)}</span><span class="sub">${esc(subOf(c))}</span></button>`).join('')}</div>
        ${S.settings.country ? `<button class="btn ghost" data-act="sheet-close">${esc(t('閉じる'))}</button>` : ''}`;
}
// 言語を切りかえたとき、作ってある案（ひとひねりの「変えたところ」など）を新しい言語で作り直す
function relocalize(){
    const re = r => r && r.isTwist ? buildTwist(r.id) : r;
    if (twistState.results) twistState.results = twistState.results.map(re).filter(Boolean);
    if (session.twist) session.twist = re(session.twist);
    if (session.menu) session.menu.items.forEach(x => { x.r = re(x.r); });
    if (modalId) renderModal();
}
function openCountrySheet(){ sheet = {kind:'country'}; renderSheet(); }
// ボタンでない要素（料理の行・名前など）に data-act があるときは、キーボードと読み上げでも押せるようにする（見た目は変えない）
const A11Y_SEL = '[data-act]:not(button):not(a):not(input):not(select):not(textarea):not(label):not([role]):not(.modal)';
function a11yFix(el){
    // 行の絵は同じ行の名前と同じ料理を開くので、Tab で二度止まらないよう読み上げとキーボードからは外す
    if (el.tagName === 'SPAN' && el.dataset.act === 'open' && el.parentElement && el.parentElement.querySelector(':scope > .info [data-act="open"]')){ el.setAttribute('role', 'presentation'); el.setAttribute('aria-hidden', 'true'); return; }
    el.setAttribute('role', 'button'); el.tabIndex = 0;
}
function a11yActs(root=document){ root.querySelectorAll(A11Y_SEL).forEach(a11yFix); }
a11yActs();
// 足された要素の中だけ見る（描き直しのたびに全部を数え直して属性を書きかえない）
new MutationObserver(ms => { for (const m of ms) m.addedNodes.forEach(n => { if (n.nodeType !== 1 || !n.isConnected) return; if (n.matches(A11Y_SEL)) a11yFix(n); if (n.firstElementChild) a11yActs(n); }); }).observe(document.body, {childList:true, subtree:true});
document.addEventListener('keydown', e => { if (e.key === 'Tab'){ trapTab(e); return; } if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]:not(button):not(a)')){ e.preventDefault(); e.target.click(); return; } if (e.key !== 'Escape') return; if (sheet && sheet.kind !== 'onboard' && !(sheet.kind === 'country' && !S.settings.country)) closeSheet(); else if (modalId) closeModal(); });
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
if (!S.settings.country && S.onboarded) S.settings.country = 'JP';   // 以前から使っている人は日本
// 「自動（国に合わせる）」だった人は、いま表示している言語に決める。これからは国を変えても言語は変わらない
if (S.settings.country && (S.settings.uiLang || 'auto') === 'auto'){ S.settings.uiLang = wantLang(); save(); }
(async () => {
    const cc = S.settings.country;
    if (cc && cc !== 'JP'){ try{ await loadPack(cc); }catch(e){ packFail = cc; S.settings.country = 'JP'; setTimeout(() => toast(t('この国のデータを読みこめませんでした。電波のあるところでもう一度開いてください')), 1500); } }
    await setLang(wantLang());
    await ensureTr(currentCountry());
    applyCountry(currentCountry());
    scheduleTrialReminder();
    syncNotifs(true);
    loadRemote();
    setTab(tab);
    if (!S.settings.country) openCountrySheet();
    else if (!S.onboarded) startOnboard();
})();
if (!(S.usedDays || []).includes(TODAY)){ S.usedDays = [...(S.usedDays || []), TODAY].slice(-400); save(); }
// アプリを開いたまま日付をまたいだとき（画面に戻ってきたとき）に、今日の日付と献立を新しくする
function refreshToday(){
    const d = ymd(); if (d === TODAY) return;
    TODAY = d;
    if (!(S.usedDays || []).includes(TODAY)){ S.usedDays = [...(S.usedDays || []), TODAY].slice(-400); save(); }
    session.menu = null; session.countSalt = 0; session.rejected.clear();
    render(); syncNotifs(true);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ refreshToday(); syncNotifs(); } });
// 開いたまま0時を過ぎたとき（戻ってくる操作がなくても）日付を新しくする。入力中は邪魔しない。端末の日付・時間帯が変わったときも、30秒以内に気づく
setInterval(() => { const a = document.activeElement; if (!document.hidden && ymd() !== TODAY && !(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) refreshToday(); }, 30000);
window.addEventListener('focus', refreshToday);
// 画面の向き・キーボード・分割表示で大きさが変わったとき（状態は作り直さず、見た目だけ合わせる）
(() => {
    const root = document.documentElement, vv = window.visualViewport; let full = 0, lastW = 0, timer = 0;
    const editing = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && !/^(checkbox|radio|button|submit|range|file|color)$/.test(a.type)) || a.isContentEditable); };
    function sync(){
        const h = vv ? vv.height : window.innerHeight, top = vv ? vv.offsetTop : 0;
        if (innerWidth !== lastW){ lastW = innerWidth; full = 0; }   // 向き・分割の幅が変わったら、「キーボードなし」の高さを測り直す
        full = Math.max(full, window.innerHeight);
        const overlap = Math.max(0, Math.round(window.innerHeight - h - top));   // キーボードが重なる端末（visualViewport だけ縮む）
        const on = editing() && (overlap > 80 || full - window.innerHeight > 80);   // 画面ごと縮む端末（innerHeight が減る）
        document.body.classList.toggle('kb', on);
        root.style.setProperty('--vvh', Math.round(h) + 'px');
        root.style.setProperty('--kb', (on ? overlap : 0) + 'px');
        const nv = document.querySelector('nav.tabs'); if (nv && !on && nv.offsetHeight) root.style.setProperty('--nav-h', nv.offsetHeight + 'px');
        return on;
    }
    function reveal(){ clearTimeout(timer); timer = setTimeout(() => { const on = sync(), a = document.activeElement; if (on && a.scrollIntoView) try{ a.scrollIntoView({block:'center', inline:'nearest'}); const r = a.getBoundingClientRect(), vh = vv ? vv.height : innerHeight; if (!a.closest('.sheet') && (r.bottom > vh - 8 || r.top < 0)) scrollBy(0, r.top + r.height / 2 - vh / 2); }catch(e){} }, 320); }   // キーボードに重なる端末では、見える部分（visualViewport）の中央に   // キーボードが出きってから、入力欄を見える位置に
    if (vv){ vv.addEventListener('resize', () => { sync(); reveal(); }); vv.addEventListener('scroll', sync); }
    addEventListener('resize', () => { sync(); reveal(); });
    addEventListener('orientationchange', () => setTimeout(sync, 250));
    document.addEventListener('focusin', () => { sync(); reveal(); });
    document.addEventListener('focusout', () => setTimeout(sync, 60));
    sync();
})();
(() => { const A = nativePlugin('App'); if (A && A.addListener) try{ A.addListener('resume', () => { refreshToday(); syncNotifs(); }); }catch(e){} })();
(() => { const r = rcInit(); if (r) r.then(P => P.getCustomerInfo()).then(res => applyCustomerInfo(res && res.customerInfo)).catch(() => {}); })();
if (PLAN.billingEnabled && !isSubscribed()) loadStorePrices();   // お試しの長さ・価格を、はじめの案内より先に読んでおく
loadGenerated().then(loadPhotos);
loadMine();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1') && document.querySelector('link[rel="manifest"]')){
    navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
    // 新しい版が入った（前の版で開いたまま／保存した画面で開いた）ときは、アプリに戻ってきたときに読み直す（開いている途中の画面は触らない）
    let swNew = false;
    navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'gohancho-updated') swNew = true; });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden || !swNew) return;
        try{
            const n = Number(sessionStorage.getItem('gohanReload') || 0); if (n >= 3) return;   // 読み直しが続かないように
            if (document.querySelector('#modal-root [role="dialog"], .sheet.open') || (typeof hf !== 'undefined' && hf.on)) return;
            sessionStorage.setItem('gohanReload', String(n + 1)); history.replaceState(null, '', '#' + tab); location.reload();
        }catch(e){}
    });
}
try{ sessionStorage.removeItem('gohanHeal'); }catch(e){}
window.__gohanOK = 1;   // ここまで動いた印（下の保存の立て直しが見る）
