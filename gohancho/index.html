<style>
/* レイアウト: 1カラムの献立帳。主役は「お膳」を真上から見た図（奥左=副菜・奥右=主菜・手前左=ご飯・手前右=汁もの）。
   色: 操作はすべて藍の1色。山吹は「変えたところ・プラス」の目印だけ。器は染付・漆・青磁。書体: 見出しは明朝（品書き）、本文は角ゴシック
   形: 白いカード（.card）1種類・角丸16px・見出しは「章（h2）」と「カードの小見出し（.eyebrow）」の2段だけ */
:root{
    --bg:#eef1f4;
    --surface:#ffffff;
    --surface-2:#e4e9ef;
    --sheet-bg:var(--bg);       /* 下から出るシート。ライトはページと同じ、ダークは一段明るくして浮かせる */
    --sheet-edge:transparent;
    --ink:#172033;
    --muted:#5b6679;
    --line:#d4dbe4;
    --accent:#22406b;          /* 藍 */
    --accent-ink:#ffffff;
    --accent-soft:#dde6f2;
    --yolk:#c98e0c;            /* 山吹: 変えたところ・プラスの目印だけ */
    --yolk-soft:#f6ecd2;
    --yolk-ink:#5b3f00;
    --danger:#b23a2a;
    --sun:#b23a2a; --sat:#2d5b9a;
    /* 器と膳（イラスト。どちらのテーマでも同じ色） */
    --tray:#2b211d; --tray-2:#3a2b25; --tray-edge:#7d2a1f; --tray-ink:#f5eee3; --tray-muted:#c9b9a6;
    --porcelain:#fbfaf6; --rim:#2c4c7c; --lacquer:#8f2b1f; --lacquer-dark:#1c1210; --celadon:#a4c3b2; --celadon-dark:#7e9f8d; --rice:#f6f3ea;
    --shadow:0 1px 2px rgba(23,32,51,.06),0 8px 24px rgba(23,32,51,.08);
    --font-display:'Hiragino Mincho ProN','Hiragino Mincho Pro','Yu Mincho','YuMincho','Noto Serif JP','Noto Serif CJK JP','Noto Serif',ui-serif,'Times New Roman',serif;   /* 外部フォントは読まない（端末の書体のみ） */
    --font-body:'Hiragino Kaku Gothic ProN','Hiragino Sans',-apple-system,BlinkMacSystemFont,system-ui,'PingFang TC','PingFang SC','Apple SD Gothic Neo','Yu Gothic','Noto Sans JP','Noto Sans KR','Noto Sans SC','Noto Sans Arabic','Noto Sans Thai','Noto Sans Devanagari','Segoe UI',Roboto,sans-serif;
    --r:16px;
}
@media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
        --bg:#10151d;--surface:#18202b;--surface-2:#212b38;--sheet-bg:#1a2330;--sheet-edge:#33404f;--ink:#e6eaf0;--muted:#94a1b3;--line:#2c3746;
        --accent:#9dbbe6;--accent-ink:#0c1522;--accent-soft:#1f2d42;
        --yolk:#e9b53c;--yolk-soft:#33290f;--yolk-ink:#f6e0a6;--danger:#ef8b7a;--sun:#ef8b7a;--sat:#9dbbe6;
        --tray:#231a17;--tray-2:#30241f;--seal:#e8806f;

    }
}
:root[data-theme="dark"]{
    --bg:#10151d;--surface:#18202b;--surface-2:#212b38;--sheet-bg:#1a2330;--sheet-edge:#33404f;--ink:#e6eaf0;--muted:#94a1b3;--line:#2c3746;
    --accent:#9dbbe6;--accent-ink:#0c1522;--accent-soft:#1f2d42;
    --yolk:#e9b53c;--yolk-soft:#33290f;--yolk-ink:#f6e0a6;--danger:#ef8b7a;--sun:#ef8b7a;--sat:#9dbbe6;
    --tray:#231a17;--tray-2:#30241f;--seal:#e8806f;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
html{font-size:calc(100% * var(--ts,1))}html[data-ts="1"]{--ts:1.15}html[data-ts="2"]{--ts:1.3}   /* アプリ内の文字の大きさ（3段階）。端末の文字サイズの設定（ブラウザの基準 100%）にそのまま掛けるので、両方が効く */
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:.9375rem;line-height:1.7;-webkit-font-smoothing:antialiased;padding-inline:max(16px,env(safe-area-inset-left,0px),env(safe-area-inset-right,0px))}   /* 横向きのノッチ・角の丸みに本文がかからない */
.wrap{max-width:680px;margin:0 auto;padding-block:18px 124px;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.35;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ヘッダー: 品書きの題字＋落款 */
.top{display:flex;align-items:center;gap:12px}
.seal{width:40px;height:40px;flex-shrink:0;border:2px solid var(--seal,var(--lacquer));color:var(--seal,var(--lacquer));border-radius:6px;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:1.25rem;line-height:1;transform:rotate(-4deg)}
.top h1{font-size:1.45rem}
.top .date{font-size:.8rem;color:var(--muted);letter-spacing:.12em}

/* 見出し */
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-direction:column;gap:2px}
.sec-head h2{font-size:1.3rem;padding-inline-start:12px;border-inline-start:4px solid var(--accent)}
.sec-head h3{font-size:1rem;margin-top:8px}
.sec-head .hint{font-size:.8rem;color:var(--muted)}
.sec-head h2+.hint{padding-inline-start:16px}
.sec-head .hint.hint2{line-height:1.5;min-height:3em}   /* 品数・理由の一文は1〜2行で変わる。2行ぶんの高さを取って、気分や品数を変えても、下のお膳が動かないように */
/* カード: 画面の中の囲みはすべてこれ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-size:.75rem;letter-spacing:.16em;color:var(--accent);font-weight:700}
.foot{font-size:.76rem;color:var(--muted);margin:0;line-height:1.7}
.sec-head.split{flex-direction:row;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.label{font-size:.75rem;letter-spacing:.16em;color:var(--accent);font-weight:700}

/* ボタン */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:.5rem 1rem;font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:.4rem;transition:background .15s,border-color .15s,transform .1s;min-height:44px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line)}
.btn.sm{min-height:44px;min-width:44px;padding:.25rem .75rem;font-size:.8rem}
.btn.danger{color:var(--danger)}
.btn.wide{flex:1 1 auto}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* チップ */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips:not(.scroll) .chip{white-space:normal;flex-shrink:1;max-width:100%;text-align:start}   /* 長い言葉のチップ（苦手な食材のなかまなど）は折り返して、画面からはみ出さない */
.chips.scroll{flex-wrap:wrap;padding-block:2px}   /* 以前は横スクロール。最後の項目が隠れるので折り返しに */
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.3rem .85rem;font-size:.84rem;display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:44px;min-width:44px;white-space:normal;overflow-wrap:anywhere;max-width:100%;flex-shrink:0}   /* 長い名前（国名など）でも画面の幅を超えない。収まるチップは今までどおり1行 */
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"]::before{content:"✓";content:"✓" / "";font-weight:700}   /* 色だけでなく、チェックの形でも「選んでいる」を示す */
.chip[aria-pressed="false"]::before{content:"✓";content:"✓" / "";font-weight:700;visibility:hidden}   /* 選んだ・選んでいないで幅が変わると、となりのチップが横にずれる。✓の分の幅を、選んでいないチップにも前もって取る */   /* 色だけでなく、チェックの形でも「選んでいる」を示す */
.chip[aria-pressed="true"] .muted{color:inherit}   /* 選んだチップの小さい補足（国名など）は、藍の地の上で読める色に */
.chip .x{border:0;background:transparent;padding:0 0 0 .1rem;font-size:1rem;line-height:1;color:inherit;opacity:.7}
.chip.have{background:var(--accent-soft);border-color:transparent}
.chip .lab{border:0;background:transparent;font:inherit;color:inherit;padding:0;min-height:44px;display:inline-flex;align-items:center;gap:.35rem;white-space:normal;text-align:start;min-width:0}.chip.have{white-space:normal;max-width:100%;min-width:0}.chip .chip-d{font-size:.72rem;opacity:.75}.chip.soon{border:1px solid var(--accent)}.chip .soon-tag{font-size:.72rem;font-weight:700}
.chip .lab[aria-pressed="true"]::before{content:none}
.chip.inc{background:var(--accent-soft);border-color:transparent;color:inherit;opacity:.85;cursor:default}   /* 選んだなかまに入っている食材（えび・かに…を選んだときのえびなど） */
.avoid-grp{display:flex;flex-direction:column;gap:4px;margin-top:4px}.avoid-more>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;font-size:.88rem;font-weight:600;color:var(--accent);list-style:none}.avoid-more>summary::-webkit-details-marker{display:none}.avoid-more>summary::after{content:'▾'}.avoid-more[open]>summary::after{content:'▴'}.avoid-sum{margin:6px 0 0;padding:6px 10px;border-radius:8px;background:var(--accent-soft)}
.badge{display:inline-block;font-size:.75rem;padding:.02rem .5rem;border-radius:999px;background:var(--surface-2);color:var(--muted);margin-inline-end:4px;vertical-align:1px;white-space:nowrap}
.badge.fav{background:var(--yolk-soft);color:var(--yolk-ink)}
.badge.new{background:var(--accent-soft);color:var(--accent)}

/* お膳 */
.tray{
    background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%);
    border-radius:var(--r);padding:18px 14px 16px;box-shadow:inset 0 0 0 2px var(--tray-edge),inset 0 0 0 7px var(--tray),inset 0 0 0 8px rgba(255,255,255,.06),0 14px 30px rgba(20,12,8,.25);
    display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"side main" "rice soup";gap:14px 10px;color:var(--tray-ink)
}
.spot{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;text-align:center}
.vessel{position:relative;aspect-ratio:1;border-radius:50%;border:0;padding:0;background:var(--porcelain);transition:transform .2s ease;max-width:100%}
.vessel:hover{transform:translateY(-2px) scale(1.02)}
.vessel .food{position:absolute;border-radius:47% 53% 50% 50%/55% 45% 55% 45%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.4),transparent 42%),var(--food,#a8652b);background-size:cover;background-position:center}
.vessel .food.photo{border-radius:50%;background-image:var(--img);background-size:cover;background-position:center;background-repeat:no-repeat}
/* ChatGPT で作った絵: 器ごと描いてあるので、アプリの器は消して絵だけを出す */
.vessel.gen,.vessel.gen:hover{background:none;box-shadow:none}
.vessel.gen::before{display:none}
.vessel.gen .food.photo,.v-plate.gen .food.photo,.v-kobachi.gen .food.photo{inset:-4%;border-radius:0;background-color:transparent;background-size:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.thumb.gen{background-color:var(--porcelain);background-size:112%}
.hero.gen{background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%)}
.hero.gen img{object-fit:contain;padding:10px 0 26px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.v-plate{width:92%;box-shadow:inset 0 0 0 6px var(--porcelain),inset 0 0 0 8px var(--rim),inset 0 -8px 18px rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.45)}
.v-plate .food{inset:20%}.v-plate .food.photo{inset:11%}

.v-donburi::before{content:"";position:absolute;inset:7%;border-radius:50%;background:var(--porcelain)}
.v-donburi .food{inset:14%}
.v-donburi.noodle .food:not(.photo){background:repeating-linear-gradient(35deg,rgba(255,255,255,.45) 0 2px,transparent 2px 6px),var(--food)}

.v-kobachi .food{inset:22%}.v-kobachi .food.photo{inset:14%}
.v-wan{width:72%;background:var(--lacquer);box-shadow:inset 0 0 0 5px var(--lacquer-dark),0 6px 12px rgba(0,0,0,.5)}

.v-chawan{width:62%;box-shadow:inset 0 0 0 4px var(--porcelain),inset 0 0 0 6px var(--rim),inset 0 0 0 9px var(--porcelain),inset 0 0 0 10px var(--rim),0 6px 12px rgba(0,0,0,.45)}
.v-chawan .food{inset:17%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff 0 1.5px,transparent 2px) 0 0/7px 7px,radial-gradient(circle at 70% 60%,#e9e3d3 0 1.5px,transparent 2px) 0 0/9px 9px,var(--rice)}
.v-konomono{width:50%;border-radius:14%;box-shadow:inset 0 0 0 3px var(--porcelain),inset 0 0 0 4px var(--rim),0 5px 10px rgba(0,0,0,.45)}
.v-konomono .food.photo{inset:12%;border-radius:8%}
.v-konomono .food{inset:26%;border-radius:4px;background:repeating-linear-gradient(90deg,#e7c34a 0 7px,#d9af2a 7px 8px)}
.spot-label{display:flex;flex-direction:column;gap:0;min-width:0;max-width:100%}
.spot-label .slot{font-size:.75rem;letter-spacing:.2em;color:var(--tray-muted)}
.spot-label .nm{font-family:var(--font-display);font-weight:700;font-size:.98rem;line-height:1.35;overflow-wrap:anywhere}
.spot-label .mt{font-size:.75rem;color:var(--tray-muted)}
.spot-label .last{font-size:.75rem;color:#f0c874}
.credit{font-size:.75rem;color:var(--muted)}

/* ひとひねり */
.tw-item{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:start;padding-block:12px;border-top:1px solid var(--line)}
.tw-item:first-of-type,.eyebrow+.tw-item{border-top:0;padding-top:0}
.thumb{display:block;width:64px;height:64px;border-radius:50%;background:var(--surface-2);background-size:cover;background-position:center;box-shadow:inset 0 0 0 3px var(--porcelain),0 2px 6px rgba(0,0,0,.15);flex-shrink:0;position:relative}
.thumb.pic{overflow:hidden}
.thumb.pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb.pic.gen>img{inset:-6%;width:112%;height:112%}
.thumb.pic::after{content:'';position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px var(--porcelain);pointer-events:none}
.thumb.none{background:radial-gradient(circle,var(--food,#a8652b) 0 36%,var(--porcelain) 37%)}
.tw-name{font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.4;cursor:pointer;color:var(--ink);min-height:44px;display:flex;align-items:center}
.from{font-size:.78rem;color:var(--muted)}
.changes{display:flex;flex-wrap:wrap;gap:4px;margin:0;padding:0;list-style:none}
.changes li{font-size:.75rem;background:var(--yolk-soft);border-radius:999px;padding:.05rem .55rem;color:var(--yolk-ink)}

/* リスト */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .t{font-weight:500;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.spot-label .nm,.tw-name,.match .name,.cook-head h3,.modal h2{overflow-wrap:anywhere}
.item .t:hover{color:var(--accent)}
.item .s{font-size:.76rem;color:var(--muted);font-weight:400}
.item .s.ex{margin-top:2px;cursor:pointer}
.empty{padding:18px 14px;color:var(--muted);font-size:.88rem}
.mix{margin:.2rem 0 .4rem}.mix summary{cursor:pointer;font-size:.88rem;font-weight:600;padding:.3rem 0;min-height:44px;display:flex;align-items:center;gap:6px}.mix-rows{display:grid;gap:6px;margin:.3rem 0}.mix-row{display:grid;grid-template-columns:5.5em 1fr;align-items:center;gap:8px;font-size:.88rem}.mix-row select{min-width:0;width:100%;min-height:44px}
@media (max-width:400px){.mix-row{grid-template-columns:1fr;gap:2px}}   /* 狭い画面では見出しを上にして、国の名前が切れないように */
.tray :focus-visible{outline-color:var(--tray-ink)}
@media (max-width:360px){.actions{grid-template-columns:1fr}}
.pw-ready{background:var(--accent-soft);border-radius:12px;padding:.6rem .8rem;margin:.2rem 0;font-size:.9rem}.pw-offer{font-size:1.15rem;margin:.3rem 0}.pw-steps{list-style:none;margin:.2rem 0 .4rem;padding:0;display:grid;grid-template-columns:max-content 1fr;gap:4px 8px;font-size:.84rem}.pw-steps li{display:grid;grid-column:1/-1;grid-template-columns:subgrid;gap:8px;padding-inline-start:10px;border-inline-start:3px solid var(--accent)}.pw-price.cta{background:var(--accent);color:var(--accent-ink,#fff);border-color:var(--accent);grid-column:1/-1;align-items:center;text-align:center;min-height:64px}.pw-price.cta .l{color:inherit;font-size:.9rem;font-weight:600}.pw-price.cta .p{font-size:1.1rem;font-weight:700}   /* 請求額をいちばん目立たせる（App Store Review Guidelines 3.1.2）*/
.swap-note{display:block}.swap-line{color:var(--accent);font-weight:600}.swap-note ul{margin:.3rem 0;padding-inline-start:1.2em}
.tally{display:flex;flex-direction:column;gap:2px;font-size:.9rem;padding:.6rem .9rem;border:1px solid var(--line);border-radius:12px}
.note{font-size:.85rem;background:var(--accent-soft);border-radius:12px;padding:.7rem .9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cook-warn{margin:.6rem 0}

/* 入力 */
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:.8rem;color:var(--muted);font-weight:500}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .75rem;width:100%;min-height:44px}
textarea{min-height:90px;resize:vertical}
small{font-size:max(.75rem,.83em)}   /* <small> の既定は親の83%。12px を下回らないように */
::placeholder{color:var(--muted);opacity:1}   /* 入力例の文字も、薄すぎないように（ダークでも4.5:1以上） */
.field [aria-invalid=true]{border-color:var(--danger)}
.inputbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}
.inputbar input{min-width:0}
@media (max-width:420px){.inputbar{grid-template-columns:minmax(0,1fr) auto}.inputbar [data-act=mic]{grid-column:1/-1}}
.btn.listening{background:var(--accent);color:#fff;animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.btn.listening{animation:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.check{display:flex;gap:10px;align-items:center;min-height:44px;font-size:.82rem;color:var(--muted);cursor:pointer}
.check input{margin-top:.3rem;width:18px;height:18px;accent-color:var(--accent);flex-shrink:0}

/* 材料マッチ */
.match{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.match:first-child{border-top:0}
.match,.list>.item{content-visibility:auto;contain-intrinsic-size:auto 76px}   /* 画面の外の行は描かない（長い一覧が軽くなる） */
.match .thumb{width:52px;height:52px;cursor:pointer}
.match .info{min-width:0;display:flex;flex-direction:column;gap:4px}
.match .head{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.match .head .name{font-family:var(--font-display);font-weight:700;font-size:1rem}
.meter{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;width:64px;flex-shrink:0}
.meter i{display:block;height:100%;background:var(--accent)}
.ings{font-size:.8rem;color:var(--muted);line-height:1.8}
.ings b{color:var(--accent);font-weight:700}
.ings .miss{color:var(--danger);text-decoration:underline dotted;text-underline-offset:3px}   /* ないものは色だけでなく点線の下線でも示す */
.ings .sub{color:var(--yolk-ink);background:var(--yolk-soft);border-radius:4px;padding:0 .25rem}

/* 週プラン */
.week .item{grid-template-columns:48px minmax(0,1fr)}
.week .item .t .wnm{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;line-height:1.4;height:2.8em}   /* 1週間の行は高さを固定する（「別の案」で料理が変わっても、下の行が上下に動かないように） */
.week .item .t .wmeta{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--wm,1);line-clamp:var(--wm,1);overflow:hidden;line-height:1.4;height:calc(var(--wm,1) * 1.4em)}
.week .item .t .s.ex{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;height:1.4em}
.week>.item{content-visibility:visible}
.day{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.day .dd{font-family:var(--font-display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.day .wd{font-size:.75rem;color:var(--muted)}
.day.sun .wd,.day.sun .dd{color:var(--sun)}.day.sat .wd,.day.sat .dd{color:var(--sat)}
.day.today .dd{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,6.5rem),1fr));gap:8px}   /* 文字を大きくしたり長い言語のときは、3列から2列・1列に自動で折り返す */
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.stat .n{font-family:var(--font-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}

details.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:0 16px}
details.box>summary{padding:14px 0;cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
details.box>summary::-webkit-details-marker{display:none}
details.box>summary::after{content:'＋';color:var(--muted)}
details.box[open]>summary::after{content:'－'}
details.box .inner{padding-bottom:14px;display:flex;flex-direction:column;gap:12px}

/* タブ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
@media (min-width:700px){nav.tabs .in{max-width:680px}}   /* iPad など広い画面では、本文の幅にそろえる */
nav.tabs button{border:0;background:transparent;border-radius:12px;padding:.35rem 0;font-size:min(calc(.75rem / var(--ts,1)), 3.1vw);min-width:0;overflow-wrap:break-word;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
nav.tabs button[aria-selected="true"] svg{stroke-width:2}

/* 詳細シート */
.sheet [tabindex="-1"]:focus{outline:none}
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 env(safe-area-inset-right,0px) var(--kb,0px) env(safe-area-inset-left,0px)}   /* --kb: キーボードの高さ（下に隠れないよう、シートを持ち上げる） */
.sheet{background:var(--sheet-bg);box-shadow:0 0 0 1px var(--sheet-edge);width:100%;max-width:680px;max-height:94vh;max-height:min(94dvh,calc(var(--vvh,100vh) * .94));overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:20px;max-height:90vh;max-height:min(90dvh,calc(var(--vvh,100vh) * .9))}}
/* 横向き（高さが低い）: 下のタブを細くして本文を広く。シートの絵も画面を埋めないよう低く */
@media (max-height:500px) and (orientation:landscape){
    nav.tabs{padding-top:2px;padding-bottom:calc(2px + env(safe-area-inset-bottom,0px))}
    nav.tabs button{min-height:44px;padding-block:2px;gap:0}
    nav.tabs svg{width:20px;height:20px}
    .wrap{padding-block:12px 72px}
    .hero{aspect-ratio:auto;height:34vh;min-height:96px}
    .hero .noimg .vessel{width:90px}
    .toast{bottom:calc(56px + env(safe-area-inset-bottom,0px))}
    .timer-float{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
    .sheet{max-height:98vh;max-height:min(98dvh,calc(var(--vvh,100vh) * .98))}
}
/* キーボードが出ているあいだは、下のタブとふわふわの知らせを消して、入力欄を広く使う */
body.kb nav.tabs,body.kb .timer-float{display:none}
body.kb .toast{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
body.kb .wrap{padding-bottom:calc(24px + var(--kb,0px))}
.sheet>*{flex-shrink:0}
.hero{position:relative;background:var(--tray);min-height:120px;aspect-ratio:16/10}   /* 絵があってもなくても同じ高さ（あとから絵が届いても、下の文字が動かないように） */
.hero img{display:block;width:100%;height:100%;aspect-ratio:16/10;object-fit:cover}
.hero .noimg{display:grid;place-items:center;height:100%;padding:0}
.hero .noimg .vessel{width:150px}
.hero .close{position:absolute;top:12px;inset-inline-end:12px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;min-height:44px;padding:.2rem .9rem;font-size:.8rem}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 6px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.75rem;line-height:1.4}
.hero .cap a{color:#fff}
.sheet-body{padding:18px 16px 0;display:flex;flex-direction:column;gap:16px}
.sheet h2{font-size:1.5rem}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:.76rem;border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem;background:var(--surface)}
.recipe-ings{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.recipe-ings li{display:flex;justify-content:space-between;gap:10px;padding:.55rem .9rem;border-top:1px dashed var(--line);font-size:.92rem}
.recipe-ings li:first-child{border-top:0}
.recipe-ings li.add{background:var(--yolk-soft)}
.recipe-ings li .q{color:var(--muted);font-variant-numeric:tabular-nums;max-width:55%;text-align:end;overflow-wrap:anywhere}   /* 「2 Bund (ca. 250 g)」など長い分量が、画面の幅を超えないように（折り返す） */
.recipe-ings li .ok{color:var(--accent);font-weight:700;margin-inline-end:.3rem}
.seasoning{font-size:.86rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.7rem .9rem;box-shadow:var(--shadow)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:12px}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.9rem;margin-top:1px}
.steps li.add{background:var(--yolk-soft);border-radius:10px;padding:.35rem .5rem .35rem .35rem}
.steps li.add::before{background:var(--yolk);color:#231800}
.confirm{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:16px;right:16px;margin-inline:auto;width:max-content;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:.55rem 1.1rem;border-radius:999px;font-size:.86rem;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}   /* 左右を決めて中央に置く（left:50% だと幅が画面の半分に縮む） */
.toast .btn{margin-inline-start:8px;min-height:44px;vertical-align:middle}
.timer-float{position:fixed;inset-inline-end:12px;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:55;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:.5rem .9rem;min-height:44px;font-size:.85rem;font-weight:600;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.timer-float.ring{background:var(--yolk);color:#231800}
.muted{color:var(--muted)}
.small{font-size:.8rem}
/* 料理イラスト */
.vessel .food.svg{background:none;border-radius:0;overflow:visible}
.vessel .food.svg svg,.thumb svg,.hero .noimg svg{width:100%;height:100%;display:block}
.v-plate .food.svg{inset:9%}.v-donburi .food.svg{inset:10%}.v-kobachi .food.svg{inset:12%}.v-wan .food.svg{inset:11%}
.thumb.svg{background:var(--porcelain);overflow:hidden}
.thumb.svg svg{transform:scale(1.08)}
.hero.illust{background:radial-gradient(120% 90% at 30% 0%,var(--tray-2),var(--tray) 70%)}
/* あいさつ */
.greet{display:flex;flex-direction:column;gap:0;margin-top:-6px}
.greet:empty{display:none}
.greet .hello{font-family:var(--font-display);font-weight:700;font-size:1rem}
.greet .line{font-size:.84rem;color:var(--muted);line-height:1.6}
/* ひと手間 */
.skill{gap:6px}
.skill .add{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.skill .plus{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.9rem;margin-inline-end:6px;vertical-align:2px}
.skill .why{font-size:.86rem}
.skill .how{font-size:.82rem;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:.45rem .6rem}
.skill .how b{color:var(--ink)}
/* 買い足し提案 */
.hint-row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}   /* 食材の名前が長いときは、説明を下の行に回す */
.hint-row:first-child{border-top:0}
.hint-row .k{font-family:var(--font-display);font-weight:700;font-size:1rem;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:.15rem .6rem;max-width:100%;overflow-wrap:anywhere}
.hint-row .v{font-size:.8rem;color:var(--muted);flex:1 1 9rem;min-width:0}
.hint-row .v b{color:var(--ink)}
/* 家族の反応・今月の料理自慢 */
.react{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.react .chip{font-size:.8rem;padding:.2rem .75rem}
.award{border-inline-start:4px solid var(--yolk)}
.award-main{display:flex;gap:12px;align-items:center}
.award h3{font-size:1.15rem;margin:2px 0;cursor:pointer}
.btn.reacted{background:var(--yolk-soft);color:var(--yolk-ink);border-color:transparent}
.item .item-acts{display:flex;gap:4px;align-items:center}
@media (max-width:400px){.item:has(> .item-acts){grid-template-columns:1fr}.item > .item-acts{justify-content:flex-end}}   /* 狭い画面では料理名を1行目に広く、ボタンは下の段に */
.item.react-item{grid-template-columns:1fr;background:var(--surface-2)}
/* ふりかえり・称号 */
.review{gap:10px}
.review p{margin:0;font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.6}
.review p.foot{font-family:var(--font-body);font-weight:400;font-size:.76rem}
.titles{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.title-row{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.title-row:first-child{border-top:0}
.title-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.title-name{font-weight:700}
.title-lv{font-family:var(--font-display);font-weight:700;color:var(--accent)}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.title-foot{display:flex;justify-content:space-between;gap:8px;font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toast.praise{border-radius:14px;padding:.8rem 1.1rem;font-family:var(--font-display);font-weight:700;font-size:.95rem;line-height:1.5}

/* お膳: 品数に合わせて 奥(主菜)・中(副菜)・手前(ご飯と汁) の3段に並べる */
.tray{display:flex;flex-direction:column;gap:14px}
.tray-row{display:flex;justify-content:center;align-items:flex-start;gap:6px}
.tray .spot{width:var(--w,46%);flex:0 1 auto}
/* 5品以上: 3〜4列に詰めて、スクロールせずに全部の絵が見えるように */
/* お膳の真ん中の丸い「まるごと入れ替え」: 1段目と2段目のあいだに置き、絵を見ながら続けて押せる */
.tray-shuffle{display:flex;justify-content:center;align-items:center;margin:-6px 0;position:relative}
.tray-shuffle::before,.tray-shuffle::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14));margin:0 10px}
.tray-shuffle::after{background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)}
.shuffle{width:68px;height:68px;border-radius:50%;flex:0 0 auto;border:2px solid var(--tray-edge);background:radial-gradient(circle at 35% 30%,#fffaf0,var(--porcelain) 70%);color:#22406b;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px;cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 -2px 0 rgba(0,0,0,.08);font:inherit;font-size:.75rem;font-weight:700;line-height:1.1;text-align:center;transition:transform .15s ease}
.shuffle svg{width:24px;height:24px;flex:0 0 auto}
.shuffle span{max-width:58px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shuffle:hover{transform:scale(1.05)}
.shuffle:active{transform:scale(.94)}
.shuffle:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.shuffle.spin svg{animation:shufflespin .45s ease-out}
@keyframes shufflespin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.shuffle.spin svg{animation:none}.shuffle{transition:none}}
.tray.compact .tray-shuffle{margin:-4px 0}
.tray.compact .shuffle{width:62px;height:62px}
.tray.compact{gap:10px;padding:14px 10px 12px}
.tray.compact .tray-row{gap:4px;align-items:flex-start}
.tray.compact .spot{width:var(--w,31%)}
.tray.compact .spot .vessel,.tray.compact .spot.main .vessel,.tray.compact .spot.side .v-kobachi{width:88%}
.tray.compact .spot-label{gap:0}
.tray.compact .spot-label .slot{font-size:.75rem;letter-spacing:.12em}
.tray.compact .spot-label .nm{font-size:.82rem;line-height:1.3}
.tray.compact .spot-label .mt{display:none}
.tray.compact .spot-label .last{font-size:.75rem}
.tray.compact .swap{min-height:28px;font-size:.75rem;padding:.05rem .55rem}
.tray.compact .spot{gap:5px}
.spot.side .v-kobachi{width:78%}
.tray .spot.main .vessel{width:86%}
.swap{border:1px solid rgba(245,238,227,.28);background:transparent;color:var(--tray-ink);border-radius:999px;font-size:.75rem;padding:.1rem .7rem;min-height:30px;cursor:pointer}
.swap:hover{background:rgba(245,238,227,.1)}
.swap{position:relative}.swap::after{content:'';position:absolute;inset:-8px -4px}   /* 見た目はそのままで、押せる範囲を44px以上に */
.spot .swap-line{color:var(--tray-ink)}
.spice-tag{white-space:nowrap}.eaters-line{margin:2px 0 0;text-align:center}.fam-member{padding:0 12px}.fam-member > .field,.fam-member > .check,.fam-member > .row{margin-bottom:12px}.fam-member > summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:8px;font-weight:600}.fam-member .field{display:flex;flex-direction:column;gap:6px}.fam-name{min-height:44px}.chip.allergy{border-color:var(--danger);color:var(--danger)}
.tray-add{align-self:center;flex:0 0 auto;opacity:.85}
.spot.ghost .vessel{background:transparent;box-shadow:none;border:2px dashed rgba(245,238,227,.28);box-sizing:border-box;opacity:.8}
.vessel .food.svg{border-radius:50%;overflow:hidden}
/* ヘッダーの設定ボタン */

/* お膳の文字の欄は行数を固定する。料理の名前・説明の長さで高さが変わると、押していない段の絵まで上下に動くため。
   はみ出す分は … で切る（全文は絵のボタンの読み上げ名と、料理の詳細に出る）。行の高さは行ごとに決めて、言語や絵文字の大きさに左右されない */

.cook-steps li.now .now-tag{display:block;font-size:.75rem;font-weight:700;color:var(--accent);letter-spacing:.02em;margin-bottom:2px}
.cook-run{display:flex;flex-direction:column;gap:12px}   /* 「次の手順」は手順が見えているあいだだけ下に貼りつく */
.cook-ctl{position:sticky;bottom:calc(var(--nav-h,84px) + 8px);z-index:4;display:flex;gap:8px}
.cook-next{flex:2 1 0;min-width:0;min-height:56px;font-size:1.05rem;box-shadow:var(--shadow)}
.cook-prev{flex:1 1 0;min-width:0;min-height:56px;box-shadow:var(--shadow)}
.cook-steps li{scroll-margin-bottom:calc(var(--nav-h,84px) + 90px)}
body.on-cook .toast{bottom:calc(var(--nav-h,84px) + 76px)}
.cook-next[hidden]{display:none}
.wake-toggle{min-height:44px;align-self:flex-start}
.term-chip{background:none;border:0;border-bottom:2px dotted currentColor;border-radius:0;padding:.25em 0;margin:-.25em 0;font:inherit;color:inherit;cursor:pointer;line-height:inherit;-webkit-tap-highlight-color:transparent}
.term-w{margin:0}.term-def{margin:0;line-height:1.7}
.timer-chip{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 .6rem;font:inherit;font-weight:700;cursor:pointer;line-height:1.5;min-height:44px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.timers{position:sticky;top:8px;z-index:5;display:flex;flex-direction:column;gap:6px}
.timers:empty{display:none}
.timer-list{display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto}
.timer-sum{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.4rem .7rem;min-height:44px;font:inherit;font-weight:700;color:var(--ink);box-shadow:var(--shadow);cursor:pointer}
.timer-sum .tm{font-family:var(--font-display);font-variant-numeric:tabular-nums;color:var(--accent)}
.timer-sum .tg{margin-inline-start:auto;color:var(--muted);font-size:.8rem}
.timer-sum.ring{background:var(--yolk-soft);border-color:var(--yolk);animation:ring 1s ease-in-out infinite}
.timer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.4rem .7rem;box-shadow:var(--shadow);min-width:0}
.timer .tm{font-family:var(--font-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--accent);flex:0 0 auto}
.timer .tn{flex:1;min-width:0;font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer .x{border:0;background:transparent;font-size:1.2rem;line-height:1;color:var(--muted);min-width:44px;min-height:44px;cursor:pointer}
.timer.ring{background:var(--yolk-soft);border-color:var(--yolk);animation:ring 1s ease-in-out infinite}
.timer.ring .tm{color:var(--yolk-ink)}
@keyframes ring{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--yolk) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.timer.ring,.timer-sum.ring{animation:none}}
.cook-steps li:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 声で読む・ハンズフリー・大きく表示・できた！ */
.cook-tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.cook-tools .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hf-hint{margin:0;font-size:.82rem;color:var(--muted)}
.step-say{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;min-width:44px;min-height:44px;font:inherit;line-height:1;cursor:pointer;margin-inline-start:6px;vertical-align:middle}
.cook-card.big .cook-steps li{display:none;font-size:1.4rem;line-height:1.6}
.cook-card.big .cook-steps li.now,.cook-card.big .cook-steps li.nextp{display:grid}
.cook-card.big .cook-steps li.now{background:var(--ink);color:var(--bg);box-shadow:none;padding:.7rem .7rem .7rem .5rem}
.cook-card.big .cook-steps li.now .now-tag{color:var(--bg)}
.cook-card.big .cook-steps li.now .timer-chip{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.cook-card.big .cook-steps li.now .step-say{background:var(--bg);color:var(--ink)}
.cook-card.big .cook-steps li.nextp{font-size:1rem;opacity:.75}
.cook-card.big .cook-steps li.prevp{display:grid;font-size:1rem}
.cook-steps li .prev-tag{display:none}
.cook-card.big .cook-steps li.prevp .prev-tag{display:block;font-size:.75rem;font-weight:700;color:var(--muted)}
.cook-steps li .next-tag{display:none}
.cook-card.big .cook-steps li.nextp .next-tag{display:block;font-size:.75rem;font-weight:700;color:var(--muted)}
.celebrate{position:relative;overflow:hidden;text-align:center;padding:1rem .8rem;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent);display:flex;flex-direction:column;gap:8px;align-items:center}
.celebrate .cel-ico{font-size:2.6rem;line-height:1}
.celebrate .cel-t{font-family:var(--font-display);font-weight:700;font-size:1.5rem}
.celebrate p{margin:0}
.celebrate .cf{position:absolute;top:8px;font-size:1.2rem;pointer-events:none;opacity:0}
.celebrate.pop .cel-ico{animation:celPop .7s cubic-bezier(.3,1.6,.5,1) both}
.celebrate.pop .cf{animation:celFall 1.6s ease-out calc(var(--i)*.12s) both}
@keyframes celPop{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
@keyframes celFall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(120px) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.celebrate.pop .cel-ico,.celebrate.pop .cf{animation:none}}
.cook-nav{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}.cook-nav .btn{min-width:0;white-space:normal;text-wrap:balance;overflow-wrap:anywhere}   /* 文字を大きくした狭い画面でも「次の料理 →」が画面の外にはみ出さない */
/* わが家のアルバム */
.cal{display:flex;flex-direction:column;gap:10px;padding:12px;margin-bottom:10px}
.cal-week{margin:0;font-weight:700}
.cal-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-nav .btn{min-width:44px;min-height:44px}
[dir="rtl"] .cal-nav .btn span{display:inline-block;transform:scaleX(-1)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal-wd{font-size:.75rem;color:var(--muted);padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-d{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:2px 0;border:0;border-radius:10px;background:transparent;color:inherit;font:inherit;font-size:.85rem;cursor:pointer}
.cal-d.today span{font-weight:800;text-decoration:underline}
.cal-d.sel{background:var(--accent);color:var(--accent-ink)}
.cal-d i{width:6px;height:6px;border-radius:50%;background:transparent}
.cal-d i.on{background:var(--accent)}.cal-d.sel i.on{background:var(--accent-ink)}
.cal-day{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.cal-day .t{cursor:pointer;padding:4px 0}.cal-day .s{color:var(--muted);font-size:.8rem}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.album-item{margin:0;position:relative;display:flex;flex-direction:column;gap:4px;min-width:0}
.album-ph{aspect-ratio:1;width:100%;border:0;border-radius:12px;background-size:cover;background-position:center;background-color:var(--surface-2);cursor:pointer;padding:0}
.album-item figcaption{display:flex;flex-direction:column;font-size:.75rem;line-height:1.25;min-width:0}
.album-item .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.album-item .d{color:var(--muted);font-size:.75rem}
.album-rm{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:.9rem;line-height:1;cursor:pointer}
[dir="rtl"] .steps li,[dir="rtl"] .recipe-ings li,[dir="rtl"] .country{text-align:right}
</style>
</head>
<body>
<div class="wrap">
    <header class="top">
        <div class="seal" aria-hidden="true">膳</div>
        <div>
            <div class="date" id="today-label"></div>
            <h1>わが家のご飯帖</h1>
        </div>
        <button class="gear flagbtn" data-act="country" aria-label="国・地域を変える" id="flag-btn">🇯🇵</button>
        <button class="gear" data-act="settings" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<nav class="tabs" aria-label="画面の切りかえ">
    <div class="in" role="tablist">
        <button role="tab" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18a9 8 0 0 1-18 0z"/><path d="M9 20h6"/><path d="M8.5 4.5c-1 1.2 1 2.3 0 3.8M12 3.5c-1 1.2 1 2.3 0 3.8M15.5 4.5c-1 1.2 1 2.3 0 3.8"/></svg>今日の献立</button>
        <button role="tab" data-tab="cook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 10h2M20 10h2M9 6.5c-.8 1 .8 1.8 0 3M13 5.5c-.8 1 .8 1.8 0 3"/></svg>作り方</button>
        <button role="tab" data-tab="fridge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="2.5" width="13" height="19" rx="2.5"/><path d="M5.5 9.5h13M8.5 5.5v2M8.5 12.5v3"/></svg>材料から</button>

        <button role="tab" data-tab="world"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></svg>世界のレシピ</button>

<!-- ポップなイラストのための共通フィルター -->

  <defs>
    <!-- 色を少し鮮やかに -->
    <filter id="pop-fill" color-interpolation-filters="sRGB"><feColorMatrix type="saturate" values="1.25"/></filter>
    <!-- 料理全体のやわらかい影（皿から少し浮いて見える） -->
    <filter id="pop-shadow" x="-15%" y="-15%" width="130%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.1" flood-color="#3a2416" flood-opacity=".32"/>
    </filter>
  </defs>

<div id="toast-root" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="timer-float"></div>

<script>
'use strict';
/* =========================================================
   レシピデータ（2人分）
   材料は「名前 分量」。末尾に ? を付けたものは「なくても作れる」扱い。
   ========================================================= */
const RECIPES = [];
function R(id, name, genre, type, method, min, ings, seas, steps){
    RECIPES.push({id, name, genre, type, method, min, ings: ings.split('|'), seas, steps: steps.split('|')});
}
// ---- 主菜 ----
R('nikujaga','肉じゃが','和','主菜','煮',30,'豚こま切れ肉 200g|じゃがいも 3個|玉ねぎ 1個|にんじん 1本|しらたき 1袋?','だし 300ml・醤油 大さじ3・砂糖 大さじ2・みりん 大さじ2・酒 大さじ2・サラダ油 大さじ1','じゃがいもは大きめの一口大、玉ねぎはくし切り、にんじんは乱切りにする。しらたきは下ゆでして食べやすく切る。|鍋に油を熱して豚肉を炒め、色が変わったら野菜としらたきを加えて全体に油を回す。|だし・砂糖・酒・みりんを加え、落としぶたをして中火で10分煮る。|醤油を加えてさらに10分、じゃがいもが柔らかくなるまで煮る。火を止めて少しおくと味がしみる。');
R('shogayaki','豚の生姜焼き','和','主菜','焼',15,'豚ロース薄切り肉 250g|玉ねぎ 1/2個|キャベツ 1/8個?','おろし生姜 小さじ2・醤油 大さじ2・みりん 大さじ2・酒 大さじ1・サラダ油 小さじ2','キャベツは千切りにして器に盛る。玉ねぎは薄切りにする。|生姜・醤油・みりん・酒を混ぜてタレを作る。|フライパンに油を熱し、豚肉を広げて両面を焼き、玉ねぎも加えて炒める。|タレを回し入れ、からめながら照りが出るまで煮詰める。');
R('karaage','鶏の唐揚げ','和','主菜','揚',30,'鶏もも肉 2枚（500g）|レモン 1/4個?','醤油 大さじ2・酒 大さじ1・おろしにんにく 小さじ1・おろし生姜 小さじ1・片栗粉 大さじ5・揚げ油 適量','鶏肉は一口大に切り、醤油・酒・にんにく・生姜をもみ込んで15分おく。|汁気を軽く切って片栗粉をまぶす。|170℃の油で3分揚げていったん取り出し、3分休ませる。|190℃に上げて1分、カラッと二度揚げする。好みでレモンを添える。');
R('teriyaki','照り焼きチキン','和','主菜','焼',20,'鶏もも肉 1枚（300g）|ブロッコリー 1/2株?','醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1・酒 大さじ1・サラダ油 小さじ1','鶏肉は厚い部分を開き、フォークで皮に穴をあける。ブロッコリーは塩ゆでする。|フライパンに皮目を下にして入れ、中火で6分、皮がパリッとするまで焼く。|裏返してふたをし、弱火で5分蒸し焼きにする。切って中まで白くなり、透明な汁が出れば火が通っている。|余分な脂を拭き取り、調味料を加えて煮からめる。切り分けてブロッコリーを添える。');
R('hamburg','ハンバーグ','洋','主菜','焼',30,'合いびき肉 300g|玉ねぎ 1/2個|卵 1個|パン粉 大さじ4?|牛乳 大さじ3?','塩 小さじ1/3・こしょう 少々・ナツメグ 少々・ケチャップ 大さじ3・中濃ソース 大さじ2・サラダ油 小さじ1','玉ねぎはみじん切りにして炒め、冷ます。パン粉は牛乳に浸す。|ひき肉に塩を入れて粘りが出るまでこね、玉ねぎ・卵・パン粉・こしょう・ナツメグを加えて混ぜる。|2等分して空気を抜きながら小判形にし、中央をくぼませる。|中火で両面に焼き色をつけ、ふたをして弱火で8分蒸し焼き。竹串を刺して透明な肉汁が出れば焼き上がり（赤い汁なら2分追加）。残った肉汁にケチャップとソースを加えて煮立て、ソースにする。');
R('stew','クリームシチュー','洋','主菜','煮',35,'鶏もも肉 250g|じゃがいも 2個|玉ねぎ 1個|にんじん 1本|ブロッコリー 1/2株?|牛乳 200ml|シチュールウ 1/2箱','水 400ml・サラダ油 大さじ1','鶏肉と野菜を一口大に切る。ブロッコリーは小房に分けて下ゆでする。|鍋に油を熱して鶏肉を炒め、玉ねぎ・にんじん・じゃがいもを加えて炒める。|水を加え、アクを取りながら15分煮る。|火を止めてルウを溶かし、牛乳を加えて弱火で5分煮る。ブロッコリーを加える。');
R('mapo','麻婆豆腐','中','主菜','炒',20,'木綿豆腐 1丁|豚ひき肉 150g|長ねぎ 1/2本','豆板醤 小さじ1・甜麺醤 大さじ1・おろしにんにく 小さじ1/2・おろし生姜 小さじ1/2・鶏ガラスープの素 小さじ1・水 150ml・醤油 小さじ2・水溶き片栗粉 大さじ2・ごま油 小さじ1','豆腐は2cm角に切って塩少々を入れた湯で2分ゆで、ざるに上げる。長ねぎはみじん切りにする。|フライパンでひき肉をカリッとするまで炒め、豆板醤・甜麺醤・にんにく・生姜を加えて香りを出す。|水・鶏ガラスープの素・醤油を加えて煮立て、豆腐を入れて3分煮る。|長ねぎを加え、水溶き片栗粉でとろみをつけ、ごま油を回しかける。');
R('hoikoro','回鍋肉','中','主菜','炒',15,'豚バラ薄切り肉 200g|キャベツ 1/4個|ピーマン 2個','甜麺醤 大さじ1.5・豆板醤 小さじ1/2・醤油 小さじ1・酒 大さじ1・おろしにんにく 小さじ1/2・サラダ油 小さじ1','キャベツはざく切り、ピーマンは乱切り、豚肉は4cm幅に切る。調味料は混ぜておく。|豚肉を炒めて脂を出し、いったん取り出す。豚肉は赤みがなくなるまでしっかり火を通す。|同じフライパンでキャベツとピーマンを強火でさっと炒める。|豚肉を戻し、合わせ調味料を加えて手早くからめる。');
R('chinjao','青椒肉絲','中','主菜','炒',15,'豚もも薄切り肉 200g|ピーマン 4個|たけのこ水煮 100g?','醤油・酒・片栗粉 各小さじ1（下味）・オイスターソース 大さじ1・醤油 小さじ1・砂糖 小さじ1/2・ごま油 小さじ1・サラダ油 大さじ1','豚肉・ピーマン・たけのこは細切りにする。豚肉に下味をもみ込む。|油を熱して豚肉をほぐしながら炒め、色が変わったら取り出す。|ピーマンとたけのこを強火で1分炒める。|豚肉を戻し、オイスターソース・醤油・砂糖で味をつけ、ごま油で香りづけする。');
R('gyoza','焼き餃子','中','主菜','焼',40,'豚ひき肉 150g|キャベツ 1/8個|ニラ 1/2束|餃子の皮 24枚','醤油 小さじ2・酒 小さじ1・ごま油 小さじ2・おろし生姜 小さじ1・おろしにんにく 小さじ1/2・塩 少々・サラダ油 大さじ1','キャベツはみじん切りにして塩少々でもみ、水気を絞る。ニラは細かく刻む。|ひき肉と調味料をよく練り、野菜を混ぜてあんを作る。|皮にあんをのせ、ふちに水をつけてひだを寄せながら包む。|油を熱して餃子を並べ、焼き色がついたら水50mlを入れてふたをし、水気がなくなるまで蒸し焼きにする。最後にごま油少々を回してパリッと焼く。');
R('meuniere','鮭のムニエル','洋','主菜','焼',15,'生鮭 2切れ|レモン 1/4個?','塩 少々・こしょう 少々・小麦粉 大さじ1・バター 15g・サラダ油 小さじ1','鮭に塩をふって10分おき、出てきた水気を拭く。|こしょうをふり、小麦粉を薄くまぶす。|油とバター半量を熱し、盛りつける面から中火で3分焼き、裏返して2分焼く。|残りのバターを加えて溶かし、スプーンで鮭にかけながら仕上げる。レモンを添える。');
R('sabamiso','さばの味噌煮','和','主菜','煮',25,'さば 2切れ|生姜 1かけ?','水 150ml・酒 50ml・味噌 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・醤油 小さじ1','さばは皮に切り目を入れ、熱湯を回しかけて臭みを取る。生姜は薄切りにする。|鍋に水・酒・砂糖・生姜を煮立て、さばを皮目を上にして入れる。|落としぶたをして中火で8分煮る。|煮汁で溶いた味噌とみりん・醤油を加え、煮汁をかけながら5分、とろりとするまで煮詰める。');
R('buriteri','ぶりの照り焼き','和','主菜','焼',20,'ぶり 2切れ|ししとう 6本?','醤油 大さじ2・みりん 大さじ2・酒 大さじ1・砂糖 小さじ1・小麦粉 少々・サラダ油 小さじ1','ぶりに塩少々をふって10分おき、水気を拭いて小麦粉を薄くまぶす。|油を熱し、ぶりを両面こんがり焼く。ししとうも一緒に焼いて取り出す。|余分な油を拭き取り、調味料を加えて煮立てる。|ぶりにタレをからめ、照りが出たら盛りつけてししとうを添える。');
R('nanban','チキン南蛮','和','主菜','揚',30,'鶏むね肉 1枚|卵 2個|玉ねぎ 1/4個|キャベツ 1/8個?','小麦粉 大さじ2・酢 大さじ3・砂糖 大さじ2・醤油 大さじ2・マヨネーズ 大さじ4・揚げ油 適量','卵1個はゆで卵にして刻み、玉ねぎのみじん切り・マヨネーズと混ぜてタルタルソースを作る。|鶏肉はそぎ切りにして塩こしょうし、小麦粉をまぶして残りの溶き卵にくぐらせる。|多めの油で両面を揚げ焼きにする。中まで白くなるまで、しっかり火を通す。|酢・砂糖・醤油を煮立てた甘酢に熱いうちにくぐらせ、タルタルをかける。千切りキャベツを添える。');
R('butakimu','豚キムチ炒め','韓','主菜','炒',10,'豚バラ薄切り肉 200g|白菜キムチ 150g|玉ねぎ 1/2個|ニラ 1/2束?','醤油 小さじ1・みりん 小さじ1・ごま油 大さじ1','豚肉は4cm幅、玉ねぎは薄切り、ニラは4cm長さに切る。|ごま油で豚肉を炒め、色が変わったら玉ねぎを加える。|キムチを加えて炒め合わせ、醤油・みりんで味をととのえる。|ニラを入れてさっと炒め、火を止める。');
R('japchae','チャプチェ','韓','主菜','炒',20,'牛こま切れ肉 150g|春雨 50g|ピーマン 2個|にんじん 1/3本|しいたけ 3枚?','醤油 大さじ2・砂糖 大さじ1・ごま油 大さじ1・おろしにんにく 小さじ1/2・白ごま 少々','春雨はゆでて食べやすく切る。野菜は細切りにする。|ごま油で牛肉を炒め、野菜を加えてしんなりするまで炒める。|春雨・醤油・砂糖・にんにくを加え、汁気がなくなるまで炒め合わせる。|白ごまをふる。');
R('ebichili','エビチリ','中','主菜','炒',20,'むきえび 200g|長ねぎ 1/2本','片栗粉 大さじ1・酒 小さじ1・ケチャップ 大さじ3・豆板醤 小さじ1/2・鶏ガラスープの素 小さじ1/2・水 100ml・砂糖 小さじ1・おろしにんにく/生姜 各小さじ1/2・水溶き片栗粉 大さじ1・サラダ油 大さじ1','えびは背わたを取り、片栗粉と水少々でもみ洗いして水気を拭く。酒と片栗粉少々をまぶす。|油でえびを両面焼いて取り出す。|にんにく・生姜・豆板醤を炒め、ケチャップ・鶏ガラスープの素・水・砂糖を加えて煮立てる。|えびとみじん切りの長ねぎを戻し、水溶き片栗粉でとろみをつける。');
R('happosai','八宝菜','中','主菜','炒',20,'豚こま切れ肉 150g|白菜 1/8個|にんじん 1/3本|しいたけ 3枚|うずらの卵（水煮） 6個?','鶏ガラスープの素 小さじ2・水 200ml・オイスターソース 大さじ1・醤油 小さじ1・酒 大さじ1・水溶き片栗粉 大さじ2・ごま油 小さじ1','白菜はそぎ切り、にんじんは短冊切り、しいたけは薄切りにする。|油で豚肉を炒め、にんじん・白菜の芯・しいたけを加えて炒める。豚肉は赤みがなくなるまでしっかり火を通す。|白菜の葉・うずらの卵・水と調味料を加えて3分煮る。|水溶き片栗粉でとろみをつけ、ごま油をたらす。');
R('chanchan','鮭のちゃんちゃん焼き','和','主菜','焼',20,'生鮭 2切れ|キャベツ 1/6個|玉ねぎ 1/2個|にんじん 1/3本?|しめじ 1/2パック?','味噌 大さじ2・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1・バター 15g','キャベツはざく切り、玉ねぎは薄切り、にんじんは短冊切り、しめじはほぐす。|味噌・みりん・酒・砂糖を混ぜる。|フライパンに野菜を広げ、中央に鮭をのせて合わせ味噌をかける。|ふたをして中弱火で10分蒸し焼きにし、バターをのせて崩しながら混ぜる。');
R('champuru','ゴーヤチャンプルー','和','主菜','炒',15,'ゴーヤ 1/2本|木綿豆腐 1/2丁|豚バラ薄切り肉 120g|卵 2個','醤油 小さじ2・かつお節 1パック・塩 少々・ごま油 大さじ1','ゴーヤは種とわたを取って薄切りにし、塩少々でもんで5分おき、水気を絞る。豆腐は水切りする。|ごま油で豆腐を手でちぎって焼き色をつけ、取り出す。|豚肉とゴーヤを炒め、豆腐を戻して醤油で味をつける。|溶き卵を回し入れてざっくり混ぜ、かつお節をふる。');
R('reishabu','冷しゃぶサラダ','和','主菜','和え',15,'豚しゃぶしゃぶ用肉 200g|レタス 3枚|トマト 1個|きゅうり 1本?','酒 少々・ポン酢 大さじ3・ごま油 小さじ1','野菜を食べやすく切って器に盛る。|沸騰直前（80℃くらい）の湯に酒を入れ、豚肉を1枚ずつ広げて色が変わるまでゆでる。|ざるに上げて自然に冷ます（氷水に入れると固くなる）。|野菜の上に盛り、ポン酢とごま油を合わせてかける。');
R('atsuage','厚揚げと豚肉の味噌炒め','和','主菜','炒',15,'厚揚げ 1枚|豚こま切れ肉 150g|キャベツ 1/6個|ピーマン 2個?','味噌 大さじ1.5・みりん 大さじ1・酒 大さじ1・砂糖 小さじ1・醤油 小さじ1・サラダ油 小さじ2','厚揚げは熱湯をかけて油抜きし、一口大に切る。キャベツはざく切り、ピーマンは乱切りにする。|調味料を混ぜておく。|油で豚肉を炒め、厚揚げを加えて焼き色をつける。|野菜を加えて炒め、合わせ調味料を回し入れてからめる。');
R('gratin','マカロニグラタン','洋','主菜','焼',35,'マカロニ 80g|鶏もも肉 150g|玉ねぎ 1/2個|しめじ 1/2パック?|牛乳 400ml|ピザ用チーズ 50g','バター 30g・小麦粉 大さじ3・コンソメ 小さじ1・塩 こしょう 少々・パン粉 少々','マカロニは表示どおりゆでる。鶏肉は一口大、玉ねぎは薄切りにする。|バターで鶏肉・玉ねぎ・しめじを炒め、小麦粉をふり入れて粉っぽさがなくなるまで炒める。|牛乳を少しずつ加えて混ぜ、コンソメ・塩・こしょうを入れてとろみがつくまで煮る。マカロニを混ぜる。|耐熱皿に入れてチーズとパン粉をのせ、トースターで焼き色がつくまで10分焼く。');
R('negishio','鶏むね肉のねぎ塩焼き','中','主菜','焼',15,'鶏むね肉 1枚|長ねぎ 1本|レモン 1/4個?','片栗粉 大さじ1・酒 小さじ1・ごま油 大さじ2・鶏ガラスープの素 小さじ1/2・塩 小さじ1/4・黒こしょう 少々','長ねぎはみじん切りにし、ごま油大さじ1・鶏ガラスープの素・塩・黒こしょうと混ぜてねぎ塩だれを作る。|鶏肉はそぎ切りにして酒をもみ込み、片栗粉をまぶす。|残りのごま油で鶏肉を両面焼き、ふたをして弱火で3分蒸し焼きにする。切って中まで白くなっていれば火が通っている。|器に盛ってねぎ塩だれをのせ、レモンを添える。');
R('subuta','酢豚','中','主菜','揚',30,'豚肩ロース肉 250g|玉ねぎ 1/2個|ピーマン 2個|にんじん 1/2本?','醤油・酒 各小さじ1（下味）・片栗粉 大さじ2・ケチャップ 大さじ2・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・水 大さじ4・片栗粉 小さじ1・揚げ油 適量','豚肉は一口大に切って下味をもみ込み、片栗粉をまぶす。野菜は乱切りにし、にんじんは下ゆでする。|甘酢の材料（ケチャップ・酢・砂糖・醤油・水・片栗粉）を混ぜておく。|多めの油で豚肉をカリッと揚げ焼きにし、野菜もさっと炒める。|甘酢を加えて手早く混ぜ、とろみとつやが出たら火を止める。');
R('rollcabbage','ロールキャベツ','洋','主菜','煮',50,'キャベツ 6枚|合いびき肉 250g|玉ねぎ 1/2個|卵 1個?|ベーコン 2枚?','パン粉 大さじ3・塩 こしょう 少々・コンソメ 小さじ2・水 500ml・ローリエ 1枚','キャベツの葉は芯をそいでゆで、しんなりさせる。|ひき肉・みじん切りの玉ねぎ・卵・パン粉・塩・こしょうを練り、6等分する。|キャベツでたねを包み、巻き終わりを下にして鍋にすき間なく並べる。|ベーコン・水・コンソメ・ローリエを加え、落としぶたをして弱火で30分煮る。');
R('chikuzen','筑前煮','和','主菜','煮',40,'鶏もも肉 1枚|れんこん 100g|ごぼう 1/2本|にんじん 1/2本|こんにゃく 1/2枚?|しいたけ 3枚?','だし 200ml・醤油 大さじ2.5・砂糖 大さじ1.5・みりん 大さじ2・酒 大さじ2・サラダ油 大さじ1','鶏肉と野菜は一口大の乱切りにする。こんにゃくはちぎって下ゆでする。|油で鶏肉を炒め、野菜とこんにゃくを加えて全体に油を回す。|だし・酒・砂糖を加え、落としぶたをして10分煮る。|醤油・みりんを加え、煮汁が少なくなるまで鍋をゆすりながら煮からめる。');
R('buridaikon','ぶり大根','和','主菜','煮',45,'ぶり 2切れ|大根 1/3本|生姜 1かけ?','水 400ml・酒 100ml・醤油 大さじ3・砂糖 大さじ2・みりん 大さじ2','大根は2cm厚さの半月切りにし、米のとぎ汁（または水）で15分下ゆでする。|ぶりは熱湯を回しかけて臭みを取る。|鍋に水・酒・砂糖・生姜を煮立て、大根とぶりを入れて落としぶたで10分煮る。|醤油・みりんを加え、ときどき煮汁をかけながらさらに15分煮る。');
R('okonomi','お好み焼き','和','主菜','焼',25,'キャベツ 1/4個|豚バラ薄切り肉 100g|卵 2個|天かす 大さじ3?','小麦粉 100g・だし 120ml・お好みソース/マヨネーズ/かつお節/青のり 各適量・サラダ油 小さじ2','キャベツは粗みじん切りにする。|小麦粉とだしを混ぜ、卵・キャベツ・天かすを加えてざっくり混ぜる。|油を熱して生地を丸く広げ、豚肉をのせて中火で4分焼く。|裏返してふたをし、弱火で5分焼く。ソース・マヨネーズ・かつお節・青のりをかける。');
R('mabonasu','麻婆なす','中','主菜','炒',20,'なす 3本|豚ひき肉 150g|長ねぎ 1/2本?','豆板醤 小さじ1・甜麺醤 大さじ1・醤油 小さじ2・鶏ガラスープの素 小さじ1・水 120ml・水溶き片栗粉 大さじ1・サラダ油 大さじ2・ごま油 少々','なすは乱切りにし、多めの油で焼いてしんなりさせて取り出す。|ひき肉を炒め、豆板醤・甜麺醤を加えて香りを出す。ひき肉は赤みがなくなるまでしっかり炒める。|水・鶏ガラスープの素・醤油を加えて煮立て、なすを戻して2分煮る。|みじん切りの長ねぎを加え、水溶き片栗粉でとろみをつけ、ごま油をたらす。');

R('curry','カレーライス','洋','ごはん','煮',40,'豚こま切れ肉 200g|じゃがいも 2個|玉ねぎ 2個|にんじん 1本|カレールウ 1/2箱|ご飯 2杯分','水 600ml・サラダ油 大さじ1','野菜と肉を一口大に切る。|鍋に油を熱し、玉ねぎを炒めてしんなりしたら肉・にんじん・じゃがいもを炒める。|水を加えて沸騰したらアクを取り、弱めの中火で15分煮る。|火を止めてルウを溶かし、とろみがつくまで5分煮る。ご飯にかける。');
R('oyakodon','親子丼','和','ごはん','煮',15,'鶏もも肉 200g|玉ねぎ 1/2個|卵 3個|ご飯 2杯分|三つ葉 少々?','だし 150ml・醤油 大さじ2・みりん 大さじ2・砂糖 小さじ1','鶏肉は小さめの一口大、玉ねぎは薄切りにする。|小さめのフライパンにだしと調味料を煮立て、鶏肉と玉ねぎを入れて5分煮る。|溶き卵の2/3を回し入れ、ふたをして30秒。残りを加えて半熟で火を止める（小さな子どもや妊娠中の人の分は、ふたをしてもう1分加熱する）。|ご飯にすべらせるようにのせ、三つ葉を散らす。');
R('gyudon','牛丼','和','ごはん','煮',15,'牛こま切れ肉 200g|玉ねぎ 1個|ご飯 2杯分|紅しょうが 適量?','だし 150ml・醤油 大さじ3・みりん 大さじ2・酒 大さじ2・砂糖 大さじ1','玉ねぎは1cm幅のくし切りにする。|鍋にだしと調味料を煮立て、玉ねぎを入れて3分煮る。|牛肉をほぐしながら加え、アクを取って5分煮る。|ご飯に煮汁ごとのせ、紅しょうがを添える。');
R('omurice','オムライス','洋','ごはん','炒',25,'鶏もも肉 100g|玉ねぎ 1/2個|卵 4個|ご飯 2杯分','ケチャップ 大さじ5・バター 20g・塩 こしょう 少々・牛乳 大さじ2','鶏肉は1cm角、玉ねぎはみじん切りにする。|バター半量で鶏肉と玉ねぎを炒め、ケチャップを加えて水分を飛ばし、ご飯を混ぜてケチャップライスにする。|1人分ずつ、卵2個と牛乳大さじ1を溶き、残りのバターを人数分に分けて半熟に焼く。|ケチャップライスを人数分に等分し、1人分ずつのせて包み、皿に返す。残りも同様に作り、ケチャップをかける。');
R('gapao','ガパオライス','エスニック','ごはん','炒',15,'鶏ひき肉 200g|パプリカ 1/2個|玉ねぎ 1/2個|卵 2個|ご飯 2杯分|バジル 10枚?','ナンプラー 大さじ1・オイスターソース 大さじ1・砂糖 小さじ1・おろしにんにく 小さじ1・赤唐辛子 1本・サラダ油 適量','玉ねぎとパプリカは1cm角に切る。|多めの油で卵を焼き、ふちがカリッとした目玉焼きを作る。|にんにくと唐辛子を炒め、ひき肉と野菜を加えて炒め、調味料で味をつける。|バジルをちぎって加えてさっと混ぜ、ご飯に盛って目玉焼きをのせる。');
R('tacorice','タコライス','エスニック','ごはん','炒',15,'合いびき肉 200g|玉ねぎ 1/2個|レタス 3枚|トマト 1個|ピザ用チーズ 40g?|ご飯 2杯分','ケチャップ 大さじ2・中濃ソース 大さじ1・カレー粉 小さじ1・おろしにんにく 小さじ1/2・サラダ油 小さじ1','玉ねぎはみじん切り、レタスは細切り、トマトは角切りにする。|油でにんにくと玉ねぎを炒め、ひき肉を加えてポロポロに炒める。ひき肉は赤みがなくなるまでしっかり炒める。|ケチャップ・ソース・カレー粉で味をつけ、汁気を飛ばす。|ご飯にレタス・ひき肉・チーズ・トマトの順にのせる。');
R('chahan','チャーハン','中','ごはん','炒',10,'ご飯 2杯分|卵 2個|長ねぎ 1/2本|ハム 4枚','鶏ガラスープの素 小さじ1・醤油 小さじ1・塩 こしょう 少々・サラダ油 大さじ2','長ねぎはみじん切り、ハムは1cm角に切る。|油を強火で熱して溶き卵を入れ、すぐにご飯を加えて卵をからめながら炒める。|ハムと長ねぎを加え、ご飯がパラッとするまで炒める。|鶏ガラスープの素・塩・こしょうで味をつけ、鍋肌から醤油を回し入れる。');
R('takikomi','きのこの炊き込みご飯','和','ごはん','炊',60,'米 2合|しめじ 1パック|まいたけ 1パック?|油揚げ 1枚|にんじん 1/3本?','醤油 大さじ2・みりん 大さじ1・酒 大さじ1・塩 小さじ1/3・だし 適量','米は洗ってざるに上げ、30分おく。|しめじ・まいたけはほぐし、油揚げとにんじんは細切りにする。|炊飯器に米と調味料を入れ、だしを2合の目盛りまで注ぐ。|具をのせて普通に炊き、炊き上がったら全体を混ぜる。');
R('napolitan','ナポリタン','洋','麺','炒',20,'スパゲッティ 200g|ウインナー 4本|玉ねぎ 1/2個|ピーマン 2個','ケチャップ 大さじ6・バター 10g・粉チーズ 適量・サラダ油 小さじ2・塩 少々','スパゲッティは表示時間どおりゆでる。|ウインナーは斜め切り、玉ねぎは薄切り、ピーマンは輪切りにする。|油でウインナーと野菜を炒め、ケチャップを加えて酸味を飛ばすように1分炒める。|スパゲッティとバターを加えてからめ、粉チーズをふる。');
R('yakisoba','ソース焼きそば','和','麺','炒',15,'焼きそば麺 2玉|豚こま切れ肉 120g|キャベツ 1/8個|もやし 1/2袋?|にんじん 1/4本?','ウスターソース 大さじ3・中濃ソース 大さじ1・青のり/紅しょうが 適量・サラダ油 大さじ1','キャベツはざく切り、にんじんは短冊切りにする。|油で豚肉を炒め、野菜ともやしを加えて炒める。豚肉は赤みがなくなるまでしっかり火を通す。|麺と水大さじ2を加え、ほぐしながら炒める。|ソースを加えて全体にからめ、青のりと紅しょうがを添える。');

R('kinokopasta','きのこの和風パスタ','和','麺','炒',15,'スパゲッティ 200g|しめじ 1パック|まいたけ 1パック?|ベーコン 60g?|大葉 4枚?','醤油 大さじ1.5・バター 15g・おろしにんにく 小さじ1/2・オリーブオイル 大さじ1','スパゲッティをゆで始める。きのこはほぐし、ベーコンは1cm幅に切る。|オリーブオイルとにんにくを弱火で熱し、ベーコンときのこを炒める。|ゆでたスパゲッティとゆで汁大さじ3を加えてからめる。|醤油とバターで味をつけ、千切りの大葉をのせる。');

R('kinpira','きんぴらごぼう','和','副菜','炒',15,'ごぼう 1本|にんじん 1/3本','醤油 大さじ1.5・砂糖 大さじ1・みりん 大さじ1・酒 大さじ1・ごま油 大さじ1・赤唐辛子 少々・白ごま 少々','ごぼうとにんじんは細切りにし、ごぼうは水にさらす。|ごま油と唐辛子を熱し、ごぼう・にんじんを中火で3分炒める。|調味料を加え、汁気がなくなるまで炒める。|白ごまをふる。');

R('tamagosoup','中華風卵スープ','中','汁物','汁',10,'卵 1個|長ねぎ 1/3本|わかめ（乾燥） 2g?','水 400ml・鶏ガラスープの素 小さじ2・醤油 小さじ1/2・塩 こしょう 少々・水溶き片栗粉 小さじ2・ごま油 少々','長ねぎは斜め薄切りにする。|水と鶏ガラスープの素を煮立て、ねぎとわかめを入れる。|醤油・塩・こしょうで味をつけ、水溶き片栗粉で軽くとろみをつける。|溶き卵を細く回し入れ、ふんわり固まったらごま油をたらす。');
R('consomme','玉ねぎのコンソメスープ','洋','汁物','汁',15,'玉ねぎ 1/2個|ベーコン 1枚?','水 400ml・コンソメ 小さじ2・塩 こしょう 少々・パセリ 少々','玉ねぎは薄切り、ベーコンは細切りにする。|鍋でベーコンを炒め、玉ねぎを加えてしんなりするまで炒める。|水とコンソメを加えて5分煮る。|塩・こしょうで味をととのえ、パセリを散らす。');

R('sundubu','スンドゥブチゲ','韓','汁物','汁',20,'絹ごし豆腐 1丁|あさり 150g?|豚バラ薄切り肉 80g|白菜キムチ 100g|卵 2個?|長ねぎ 1/2本?','コチュジャン 大さじ1・おろしにんにく 小さじ1・鶏ガラスープの素 小さじ2・醤油 小さじ1・水 400ml・ごま油 大さじ1','ごま油でにんにく・豚肉・キムチを炒める。|水・鶏ガラスープの素・コチュジャンを加えて煮立て、あさりを入れる。|豆腐をスプーンで大きくすくって入れ、5分煮て醤油で味をととのえる。|卵を落とし、ねぎを散らして半熟で火を止める。（小さな子どもや妊娠中の人の分は、卵が白く固まるまで火を通す）');

R('sabashio','さばの塩焼き','和','主菜','焼',20,'さば 2切れ|大根 3cm?','塩 小さじ1/2・醤油 少々','さばの両面に塩をふって10分おき、出てきた水気を拭く。|皮に浅く切り目を入れる。|魚焼きグリルで盛りつける面から中火で6分、返して4分焼く。|大根おろしを添え、醤油を少したらす。');
R('sanma','さんまの塩焼き','和','主菜','焼',20,'さんま 2尾|大根 3cm?|すだち 1個?','塩 小さじ1/2','さんまは洗って水気を拭き、半分に切る。|両面に塩をふって10分おく。|グリルで中火で片面5分ずつ、皮がこんがりするまで焼く。|大根おろしとすだちを添える。');
R('ajifry','あじフライ','和','主菜','揚',30,'あじ（開いたもの） 4枚|卵 1個|キャベツ 1/6個?','塩 こしょう 少々・小麦粉 大さじ2・パン粉 1カップ・揚げ油 適量・中濃ソース 適量','あじは水気を拭き、塩こしょうをふる。|小麦粉→溶き卵→パン粉の順に衣をつける。|170℃の油で3分、きつね色になるまで揚げる。|千切りキャベツを添え、ソース（またはタルタル）で食べる。');
R('iwashiume','いわしの梅煮','和','主菜','煮',30,'いわし 4尾|梅干し 2個|生姜 1かけ?','水 200ml・酒 50ml・醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1','いわしは頭と内臓を除き、よく洗って水気を拭く。生姜は薄切りにする。|鍋に調味料と水を煮立て、いわし・梅干し・生姜を並べ入れる。|落としぶたをして中弱火で15分煮る。|煮汁をかけながら、とろみが出るまで煮詰める（骨までやわらかく食べられる）。');
R('kareini','かれいの煮付け','和','主菜','煮',20,'かれい 2切れ|生姜 1かけ?|ごぼう 1/3本?','水 150ml・酒 50ml・醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1','かれいは皮に切り目を入れ、熱湯を回しかけて臭みを取る。ごぼうは5cm長さに切る。|フライパンに調味料と水、生姜を煮立てる。|かれいとごぼうを入れ、落としぶたをして中火で10分煮る。|煮汁をかけながら2〜3分煮て、照りを出す。');
R('hoilyaki','鮭のホイル焼き','洋','主菜','焼',20,'生鮭 2切れ|玉ねぎ 1/4個|しめじ 1/2パック|ピーマン 1個?','塩 こしょう 少々・バター 20g・醤油 小さじ2・レモン 適量','鮭に塩こしょうをふる。玉ねぎは薄切り、しめじはほぐす。|アルミホイルに玉ねぎを敷き、鮭・しめじ・ピーマンをのせてバターをのせる。|口をしっかり閉じ、フライパンに並べてふたをし、中火で12分蒸し焼きにする。|開いて醤油をたらし、レモンを添える。');
R('amazu_sakana','白身魚の甘酢あんかけ','中','主菜','揚',25,'生だら 2切れ|玉ねぎ 1/4個|にんじん 1/4本|ピーマン 1個?','塩 少々・片栗粉 大さじ2・揚げ油 適量・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・ケチャップ 大さじ1・水 大さじ4・片栗粉 小さじ1','たらは一口大に切って塩をふり、水気を拭いて片栗粉をまぶす。野菜は細切りにする。|多めの油でたらを揚げ焼きにして取り出す。|同じフライパンで野菜を炒め、甘酢の材料（酢・砂糖・醤油・ケチャップ・水・片栗粉）を加えてとろみをつける。|たらにあんをかける。');
R('tebasappari','手羽元のさっぱり煮','和','主菜','煮',35,'鶏手羽元 8本|ゆで卵 2個?','水 200ml・酢 100ml・醤油 大さじ3・砂糖 大さじ2・おろしにんにく 小さじ1','手羽元は骨に沿って切り目を入れる。|フライパンで手羽元の表面を焼きつける。|水・酢・醤油・砂糖・にんにくを加え、ふたをして中火で20分煮る。|ゆで卵を加え、煮汁をからめながら5分煮詰める（酢の酸味はとんでまろやかになる）。');
R('yurinchi','油淋鶏','中','主菜','揚',25,'鶏もも肉 1枚|長ねぎ 1/2本','塩 こしょう 少々・片栗粉 大さじ3・揚げ油 適量・醤油 大さじ2・酢 大さじ1.5・砂糖 大さじ1・おろし生姜 小さじ1・ごま油 小さじ1','鶏肉は厚みを均一に開き、塩こしょうをして片栗粉をまぶす。|長ねぎはみじん切りにし、醤油・酢・砂糖・生姜・ごま油と混ぜてねぎだれを作る。|多めの油で皮目から鶏肉を揚げ焼きにし、両面カリッとさせる。|食べやすく切って、ねぎだれをたっぷりかける。');
R('piccata','鶏むね肉のピカタ','洋','主菜','焼',15,'鶏むね肉 1枚|卵 1個','塩 こしょう 少々・小麦粉 大さじ1・粉チーズ 大さじ1・サラダ油 大さじ1・ケチャップ 適量','鶏肉はそぎ切りにして塩こしょうをふり、小麦粉をまぶす。|溶き卵に粉チーズを混ぜる。|鶏肉を卵液にくぐらせ、油を熱したフライパンで弱めの中火で片面2〜3分ずつ、中まで火が通るまで焼く。|残った卵液をからめながら焼き、ケチャップを添える。');
R('nikudango','肉団子の甘酢あん','中','主菜','揚',30,'豚ひき肉 250g|玉ねぎ 1/4個|卵 1個?','片栗粉 大さじ1・塩 少々・揚げ油 適量・ケチャップ 大さじ2・酢 大さじ2・砂糖 大さじ2・醤油 大さじ1・水 大さじ4・片栗粉 小さじ1','玉ねぎはみじん切りにし、ひき肉・卵・片栗粉・塩とよく練る。|一口大に丸め、170℃の油で4分揚げる（多めの油で転がしながら焼いてもよい）。割って中まで火が通っているか確かめる。|甘酢の材料をフライパンで煮立て、とろみをつける。|肉団子を入れてからめる。');
R('butadaikon','豚バラ大根','和','主菜','煮',35,'豚バラ薄切り肉 150g|大根 1/3本|生姜 1かけ?','だし 300ml・醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1・酒 大さじ1・ごま油 小さじ1','大根は1cm幅のいちょう切り、豚肉は4cm幅に切る。|ごま油で豚肉を炒め、大根を加えて全体に油を回す。|だしと調味料、せん切りの生姜を加え、落としぶたで20分煮る。|大根が透き通ったら火を止め、少しおいて味を含ませる。');
R('kakuni','豚の角煮','和','主菜','煮',90,'豚バラかたまり肉 400g|長ねぎの青い部分 1本?|生姜 1かけ?|ゆで卵 2個?','水 600ml・酒 100ml・醤油 大さじ4・砂糖 大さじ3・みりん 大さじ2','豚肉は4cm角に切り、フライパンで全面に焼き色をつける。|鍋にたっぷりの水と長ねぎ・生姜を入れて豚肉を40分下ゆでし、ゆで汁を捨てる。|水600mlと調味料を加え、落としぶたで30分煮る。|ゆで卵を加え、煮汁が半分になるまで10分煮詰める。');
R('nasumiso','なすと豚肉の味噌炒め','和','主菜','炒',15,'なす 2本|豚バラ薄切り肉 150g|ピーマン 2個?','味噌 大さじ1.5・みりん 大さじ1・砂糖 小さじ2・酒 大さじ1・サラダ油 大さじ2','なすは乱切り、ピーマンは乱切り、豚肉は4cm幅に切る。調味料を混ぜておく。|油でなすを焼き、しんなりしたら取り出す。|豚肉を炒め、なすとピーマンを戻す。豚肉は赤みがなくなるまでしっかり火を通す。|合わせ味噌を加えて炒めからめる。');
R('shigureni','牛肉とごぼうのしぐれ煮','和','主菜','煮',20,'牛こま切れ肉 200g|ごぼう 1/2本|生姜 1かけ','醤油 大さじ2・みりん 大さじ2・砂糖 大さじ1・酒 大さじ2・水 50ml','ごぼうはささがきにして水にさらし、生姜はせん切りにする。|鍋に調味料と水、生姜を煮立て、ごぼうを3分煮る。|牛肉をほぐしながら加え、アクを取る。|汁気がほとんどなくなるまで煮詰める（作り置きにも向く）。');
R('nikudofu','肉豆腐','和','主菜','煮',20,'牛こま切れ肉 150g|木綿豆腐 1丁|長ねぎ 1本|しらたき 1袋?','だし 200ml・醤油 大さじ3・みりん 大さじ2・砂糖 大さじ1.5・酒 大さじ2','豆腐は8等分に切り、長ねぎは斜め切りにする。しらたきは下ゆでする。|鍋にだしと調味料を煮立て、牛肉を入れてアクを取る。|豆腐・長ねぎ・しらたきを加え、落としぶたで10分煮る。|火を止めて少しおき、豆腐に味を含ませる。');
R('bulgogi','プルコギ','韓','主菜','炒',20,'牛こま切れ肉 200g|玉ねぎ 1/2個|にんじん 1/3本|ピーマン 2個?|ニラ 1/3束?','醤油 大さじ2・砂糖 大さじ1・ごま油 大さじ1・おろしにんにく 小さじ1・酒 大さじ1・白ごま 少々','牛肉に醤油・砂糖・にんにく・酒をもみ込んで10分おく。|玉ねぎは薄切り、にんじんとピーマンは細切り、ニラは4cm長さに切る。|ごま油で牛肉を炒め、色が変わったら野菜を加えて炒め合わせる。|ニラを加えてさっと混ぜ、白ごまをふる。');
R('dakgalbi','タッカルビ','韓','主菜','炒',25,'鶏もも肉 1枚|キャベツ 1/6個|玉ねぎ 1/2個|さつまいも 1/2本?|ピザ用チーズ 50g?','コチュジャン 大さじ2・醤油 大さじ1・砂糖 大さじ1・酒 大さじ1・おろしにんにく 小さじ1・ごま油 大さじ1','鶏肉は一口大に切り、調味料をもみ込んで10分おく。|キャベツはざく切り、玉ねぎはくし切り、さつまいもは1cm幅の半月切りにする。|ごま油で鶏肉を焼き、野菜を加えてふたをし、中火で8分蒸し焼きにする。鶏肉の中まで白くなるまで火を通す。|全体を混ぜ、チーズをのせてふたをし、溶けたら完成。');
R('banbanji','棒棒鶏','中','主菜','和え',20,'鶏むね肉 1枚|きゅうり 1本|トマト 1個?','酒 大さじ1・塩 少々・練りごま 大さじ2・醤油 大さじ1・酢 大さじ1・砂糖 小さじ2・ごま油 小さじ1','鶏肉に酒と塩をふり、ふたをして弱火で8分蒸し焼きにし、そのまま冷ます。中まで白くなり、透明な汁が出るまで火を通す。|きゅうりは細切り、トマトは薄切りにする。|鶏肉を手で細く裂く。|器に野菜と鶏肉を盛り、練りごま・醤油・酢・砂糖・ごま油を混ぜたたれをかける。');
R('tofuhamburg','豆腐ハンバーグ','和','主菜','焼',30,'鶏ひき肉 150g|木綿豆腐 1/2丁|玉ねぎ 1/4個|しめじ 1/2パック?','パン粉 大さじ3・塩 少々・サラダ油 小さじ1・大根おろし 適量・ポン酢 大さじ3','豆腐はキッチンペーパーで包み、10分重しをして水切りする。玉ねぎはみじん切り。|ひき肉・豆腐・玉ねぎ・パン粉・塩をよく練り、4等分して小判形にする。|油を熱して両面に焼き色をつけ、ふたをして弱火で6分蒸し焼き。しめじも一緒に焼く。|大根おろしをのせ、ポン酢をかける。');
R('pimannikuzume','ピーマンの肉詰め','洋','主菜','焼',30,'ピーマン 4個|合いびき肉 200g|玉ねぎ 1/4個|卵 1個?','パン粉 大さじ3・牛乳 大さじ2・塩 こしょう 少々・小麦粉 少々・サラダ油 小さじ2・ケチャップ 大さじ2・中濃ソース 大さじ2','ピーマンは縦半分に切って種を取り、内側に小麦粉をふる。|ひき肉・みじん切りの玉ねぎ・卵・パン粉・牛乳・塩こしょうを練る。|ピーマンに肉だねをすき間なく詰める。|肉の面から焼き、焼き色がついたら返してふたをし、弱火で6分、竹串を刺して透明な肉汁が出るまで焼く。ケチャップとソースを加えてからめる。');
R('torinotomatoni','鶏肉のトマト煮','洋','主菜','煮',30,'鶏もも肉 1枚|玉ねぎ 1/2個|トマト缶 1缶|しめじ 1パック?','塩 こしょう 少々・オリーブオイル 大さじ1・おろしにんにく 小さじ1・コンソメ 小さじ1・砂糖 小さじ1','鶏肉は一口大に切り、塩こしょうをふる。玉ねぎは薄切り、しめじはほぐす。|オリーブオイルとにんにくで鶏肉を皮目から焼く。|玉ねぎ・しめじを加えて炒め、トマト缶・コンソメ・砂糖を入れる。|ふたをして15分煮て、塩こしょうで味をととのえる。');
R('ikasatoimo','いかと里芋の煮物','和','主菜','煮',35,'いか 1杯|里芋 6個','だし 300ml・醤油 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・酒 大さじ2','いかは内臓と軟骨を除き、胴は輪切り、足は食べやすく切る。|里芋は皮をむいて塩もみし、水で洗ってぬめりを取る。|だしと調味料で里芋を15分煮る。|いかを加えて5分煮る（煮すぎると固くなる）。火を止めて味を含ませる。');
R('atsuagesoboro','厚揚げのそぼろあんかけ','和','主菜','煮',15,'厚揚げ 1枚|鶏ひき肉 100g|長ねぎ 少々?','だし 200ml・醤油 大さじ1.5・みりん 大さじ1.5・砂糖 小さじ1・水溶き片栗粉 大さじ1','厚揚げは熱湯をかけて油抜きし、一口大に切る。|鍋でひき肉を炒め、だしと調味料を加える。ひき肉は赤みがなくなるまでしっかり炒める。|厚揚げを入れて5分煮る。|水溶き片栗粉でとろみをつけ、小口切りのねぎを散らす。');

R('soborodon','鶏そぼろ丼','和','ごはん','炒',20,'鶏ひき肉 200g|卵 2個|さやいんげん 6本?|ご飯 2杯分','醤油 大さじ2・砂糖 大さじ1.5・みりん 大さじ1・酒 大さじ1・おろし生姜 小さじ1・（卵用）砂糖 小さじ2・塩 少々','鍋にひき肉と調味料・生姜を入れ、火にかける前によく混ぜる。|中火で菜箸4〜5本を使って混ぜながら、汁気がなくなるまで炒る。|卵に砂糖と塩を混ぜ、別の鍋で同じように炒り卵にする。いんげんはゆでて斜め切り。|ご飯にそぼろ・炒り卵・いんげんを彩りよくのせる。');
R('chukadon','中華丼','中','ごはん','炒',20,'豚こま切れ肉 120g|白菜 1/8個|にんじん 1/3本|しいたけ 2枚?|うずらの卵（水煮） 4個?|ご飯 2杯分','鶏ガラスープの素 小さじ2・水 250ml・オイスターソース 大さじ1・醤油 小さじ1・水溶き片栗粉 大さじ2・ごま油 小さじ1・サラダ油 大さじ1','白菜はそぎ切り、にんじんは短冊切り、しいたけは薄切りにする。|油で豚肉を炒め、野菜を加えて炒める。豚肉は赤みがなくなるまでしっかり火を通す。|水・鶏ガラ・オイスターソース・醤油・うずらの卵を加えて3分煮る。|水溶き片栗粉でとろみをつけてごま油をたらし、ご飯にかける。');
R('bibimbap','ビビンバ','韓','ごはん','和え',25,'牛こま切れ肉 120g|もやし 1/2袋|ほうれん草 1/2束|にんじん 1/3本|卵 2個?|ご飯 2杯分','ごま油 大さじ2・醤油 大さじ1.5・砂糖 小さじ2・おろしにんにく 小さじ1/2・塩 少々・白ごま 適量・コチュジャン 適量','もやし・ほうれん草・細切りのにんじんをそれぞれゆで、ごま油・塩・白ごまで和えてナムルにする。|牛肉をごま油で炒め、醤油・砂糖・にんにくで甘辛く味をつける。|卵は目玉焼き（または温泉卵）にする。|ご飯にナムルと牛肉、卵をのせ、コチュジャンを添えて混ぜて食べる。');
R('hayashi','ハヤシライス','洋','ごはん','煮',30,'牛こま切れ肉 200g|玉ねぎ 1個|しめじ 1パック?|ハヤシルウ 1/2箱|ご飯 2杯分','水 400ml・サラダ油 大さじ1','玉ねぎは薄切り、しめじはほぐす。|油で玉ねぎをしんなりするまで炒め、牛肉としめじを加えて炒める。|水を加えて煮立て、アクを取って10分煮る。|火を止めてルウを溶かし、とろみがつくまで5分煮てご飯にかける。');
R('drycurry','ドライカレー','洋','ごはん','炒',20,'合いびき肉 200g|玉ねぎ 1/2個|にんじん 1/3本|ピーマン 1個?|ご飯 2杯分','カレー粉 大さじ1・ケチャップ 大さじ2・中濃ソース 大さじ1・コンソメ 小さじ1・塩 こしょう 少々・サラダ油 小さじ2','野菜はすべてみじん切りにする。|油で玉ねぎとにんじんを炒め、ひき肉を加えてポロポロになるまで炒める。|カレー粉をふって香りを出し、ピーマン・ケチャップ・ソース・コンソメを加える。|汁気を飛ばし、塩こしょうで味をととのえてご飯に添える。');
R('hiyashichuka','冷やし中華','中','麺','和え',20,'中華麺 2玉|ハム 4枚|きゅうり 1本|卵 2個|トマト 1個?','醤油 大さじ3・酢 大さじ3・砂糖 大さじ2・ごま油 大さじ1・水 大さじ2・（卵用）砂糖 小さじ1・サラダ油 少々','たれの材料（醤油・酢・砂糖・ごま油・水）を混ぜて冷やす。|卵に砂糖を混ぜて薄焼きにし、細切りにして錦糸卵を作る。ハム・きゅうりも細切り、トマトはくし切り。|麺をゆでて冷水でしめ、水気をよく切る。|器に麺を盛って具を並べ、たれをかける。');

R('kenchinjiru','けんちん汁','和','汁物','汁',25,'大根 3cm|にんじん 1/3本|ごぼう 1/3本|木綿豆腐 1/2丁|里芋 2個?|こんにゃく 1/4枚?','だし 600ml・醤油 大さじ1.5・塩 少々・ごま油 小さじ2','野菜はいちょう切りや乱切りに、こんにゃくはちぎって下ゆでする。|ごま油で野菜とこんにゃくを炒める。|豆腐を手でくずし入れて炒め、だしを加えて10分煮る。|醤油と塩で味をととのえる。');
