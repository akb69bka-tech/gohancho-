# push / PR でテストを実行する（外部サービス・秘密情報は使わない。無料枠で収まるよう 15 分で打ち切る）
#   JS 構文チェック・国ごとのレシピ(packs)の検査・17言語の翻訳が 0 missing・ブラウザでの短縮テスト（tools/qa/run-all.sh --quick。失敗した項目のログは表のあとに出る）
name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright (chromium) を入れる
        # GitHub の機械で apt の名前解決が落ちることがある（11/11 v137: azure.archive.ubuntu.com が引けず2回とも止まった）。
        # 1回目が落ちたら apt の取り先を archive.ubuntu.com に替えてやり直し、それでも落ちたらブラウザ本体だけ入れる（足りない依存はテストで落ちて分かる）
        run: |
          npm install -g playwright@1.56.1
          if playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::apt の取得に失敗。取り先を archive.ubuntu.com に替えてやり直す"
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3 || true
          if playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::依存の取得をあきらめ、ブラウザ本体だけ入れる"
          playwright install chromium
      - name: 静的チェック（JS 構文・packs・17言語）
        run: |
          node tools/qa/check-syntax.mjs
          node tools/packs/check.mjs
          for l in ar de en es fil fr hi id it ko pl pt-BR th tr vi zh-Hans zh-Hant; do
            echo "== $l"; node tools/i18n/extract.mjs --check "$l"
          done
      - name: ブラウザテスト（短縮モード）
        run: |
          export NODE_PATH="$(npm root -g)"
          tools/qa/run-all.sh --quick --jobs 4 --skip syntax,packs,i18n,steps,terms
