# ご飯帖の公開ページ（Web 版・プライバシーポリシー・サポート）を GitHub Pages に出す
# main の gohancho/ が変わるたびに自動で更新。URL: https://akb69bka-tech.github.io/gohancho-/
# 初回だけ: GitHub の Settings → Pages → Source を「GitHub Actions」にする
name: Pages

on:
  push:
    branches: [main]
    paths: ['gohancho/**', 'tools/build/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 第49回 R184: 公開する前に、コメント・字下げ・空白を取って軽くする（本体 2.37MB → 1.71MB。動きは同じ: 構文木で読み比べて、違えば止まる）
      # 遅い回線ではじめて開いたとき、国を選ぶ画面までの時間が短くなる。無料（npm の typescript だけを使う）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g typescript@6.0.2
      - run: node tools/build/slim.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
